[package]
name = "otto-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
otto-core = { workspace = true }
otto-netguard = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
tokio-tungstenite = { workspace = true }
# HTML parsing for the extraction pipeline (readability pass + html->markdown).
# MIT, pure Rust — no other crate in the workspace pulls in an HTML parser yet.
scraper = "0.20"
# Tree type scraper's `Html` is built on (transitive via scraper already, but
# Rust requires a direct dependency to name `ego_tree::NodeRef` ourselves).
ego-tree = "0.6"
# Remote live view (`live` module): screencast frames arrive base64-encoded,
# the Chromium download is sha256-verified, timestamps on the wire.
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
# `dup2` of the CDP pipe onto fds 3/4 in the Chromium child (pre_exec).
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
