[package]
name = "otto-dbviewer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hex = { workspace = true }
otto-core = { workspace = true }
otto-state = { workspace = true }
otto-rbac = { workspace = true }
otto-ssh = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
# ClickHouse HTTP response compression (DB2-05), decoded per chunk in the
# driver rather than via reqwest's zstd feature (that would turn on silent
# auto-decompression for every reqwest client in the daemon). Already in the
# tree through the mongodb driver's zstd wire compression.
zstd = { version = "0.13.3", default-features = false }
sqlx = { workspace = true, features = ["mysql", "postgres", "tls-rustls", "bigdecimal", "time", "chrono", "uuid", "ipnetwork", "mac_address"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }
# Wire compression is not a nice-to-have here: a fat-document collection read
# over an SSH tunnel is bandwidth-bound (measured ~68 KB/s on a real bastion),
# and this payload shape compresses ~39x with zstd — 54s → ~1.5s.
mongodb = { version = "3.9.1", features = [
    "socks5-proxy",
    "zstd-compression",
    "snappy-compression",
    "zlib-compression",
] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
clickhouse = { version = "0.15.2", features = ["rustls-tls"] }
klickhouse = { version = "0.15.3", features = ["tls"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "tls12", "std"] }
rustls-pki-types = "1.15.1"
webpki-roots = "1.0.9"
# mongosh-script execution: the pasted script is written to a temp .js file and
# run through the real `mongosh --file` (drivers/mongodb.rs `run_script`).
tempfile = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
sqlx = { workspace = true }
