[package]
name = "otto-k8s"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
otto-core = { workspace = true }
otto-rbac = { workspace = true }
otto-state = { workspace = true }
otto-pty = { workspace = true }
otto-connections = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
# The monitor's long-lived `kubectl proxy` gateway (monitor/gateway.rs) speaks
# HTTP/1.1 over a private Unix socket (reqwest has no Unix-socket connector).
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
# Direct `aws_accounts` lookup for eks-source clusters (env injection) — the
# full AWS repo lives in otto-aws; see `clusters::aws_env_for`.
sqlx = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
sqlx = { workspace = true }
