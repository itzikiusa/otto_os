[package]
name = "otto-design"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
otto-core = { workspace = true }
otto-state = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
# Brand-kit tokens become CSS vars in the kit's own order (theme.rs). ottod
# already gets insertion order via bson's `preserve_order`; declaring it here
# keeps `cargo test -p otto-design` on the same (non-alphabetical) map.
serde_json = { workspace = true, features = ["preserve_order"] }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
