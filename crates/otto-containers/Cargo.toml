[package]
name = "otto-containers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
otto-core = { workspace = true }
otto-connections = { workspace = true }
otto-pty = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
dirs = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
# Docker Engine API v1.47 over Unix domain sockets (mirrors otto-k8s gateway).
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"

[dev-dependencies]
chrono = { workspace = true }
tempfile = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
hyper = { version = "1.12.0", features = ["client", "server", "http1"] }
