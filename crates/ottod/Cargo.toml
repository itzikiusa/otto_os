[package]
name = "ottod"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Keep changing UI assets in the binary, outside the server crate's build inputs.
embed-ui = ["dep:rust-embed"]

[dependencies]
otto-core.workspace = true
otto-state.workspace = true
otto-keychain.workspace = true
otto-server.workspace = true
# The control-plane catalog (`otto_mcp::outward`) the native tool listing is
# generated from, and the shared gateway budget (architecture-1-05, integrations-4-01).
otto-mcp.workspace = true
rust-embed = { workspace = true, optional = true, features = ["deterministic-timestamps"] }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
otto-sessions.workspace = true
otto-usage.workspace = true
otto-transcript.workspace = true
sqlx.workspace = true
# The ClickHouse-backed telemetry service. Linked under the `otto_telemetry`
# name so existing `otto_telemetry::TelemetryService` / `::context` paths keep
# resolving (the collector re-exports the leaf `otto-telemetry`); only the
# composition root (otto-server, ottod) may depend on the collector.
otto-telemetry = { path = "../otto-telemetry-collector", package = "otto-telemetry-collector" }
# `ottod mcp-tools` (Task B2b): the first-party MCP tool server calls back into
# the running daemon over loopback HTTP with a per-session read-only token.
reqwest.workspace = true

# getrlimit/setrlimit: raise the soft open-file limit at startup (launchd's
# 256 default is far too low for a PTY-heavy daemon).
rustix = { workspace = true, features = ["process"] }

# TLS for the optional 0.0.0.0 network listener (S3). rustls-only to match the
# rest of the tree (reqwest uses rustls). `tls-rustls-no-provider` so we install
# the crypto provider explicitly (both ring + aws-lc are compiled in this tree,
# so the default is ambiguous and would panic). `rcgen` mints a persisted
# self-signed cert on first use so the listener works out of the box.
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
rustls-pemfile = "2.2.0"
rcgen = "0.14.10"
sha2 = "0.11.1"
