[package]
name = "otto-workflows"
version.workspace = true
edition.workspace = true
license.workspace = true

# Workflow engine pieces that need nothing from the server: the node-kind
# catalog, graph validation, retry policy, durable loop checkpoints and the
# per-run context files. The engine itself (`otto-server/src/workflow_engine.rs`)
# still lives in otto-server; it consumes these.

[dependencies]
otto-core = { workspace = true }
otto-state = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
