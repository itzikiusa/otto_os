[package]
name = "otto-server"
version.workspace = true
edition.workspace = true
license.workspace = true
# Integration tests link as ONE binary (tests/it.rs `#[path]`-includes each
# tests/<suite>.rs): every test binary links the whole workspace, so 19 of them
# cost 19 links + 19 copies on disk per change. A guard test in it.rs fails if
# a tests/*.rs file is neither included there nor a [[test]] below.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

# Sets process env vars (OTTO_E2E, OTTO_SNIP_CAPTURE_CMD): kept out of `it` so
# they can't leak into other suites under `cargo test`'s one-process runner.
[[test]]
name = "snips"
path = "tests/snips.rs"

[features]
default = []
# Test fixtures (`otto_server::test_support`, `ServerCtx::for_tests`). Enabled for
# this crate's own integration tests by the self dev-dependency below; never in
# a release build.
test-util = []

[dependencies]
hex = { workspace = true }
regex = "1.13"
tokio-util = { version = "0.7.19", features = ["io"] }
tempfile.workspace = true
rustix = { workspace = true, features = ["process"] }
otto-core.workspace = true
otto-state.workspace = true
otto-rbac.workspace = true
otto-netguard.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
futures-util.workspace = true
tracing.workspace = true
dirs.workspace = true
mime_guess.workspace = true
otto-sessions.workspace = true
otto-sandbox.workspace = true
otto-connections.workspace = true
otto-aws.workspace = true
otto-k8s.workspace = true
otto-ssh.workspace = true
otto-dbviewer.workspace = true
otto-brokers.workspace = true
otto-mcp.workspace = true
otto-orchestrator.workspace = true
otto-git.workspace = true
otto-issues.workspace = true
otto-channels.workspace = true
otto-improve.workspace = true
otto-context.workspace = true
otto-skills.workspace = true
otto-usage.workspace = true
otto-telemetry.workspace = true
otto-agent-run.workspace = true
otto-review.workspace = true
# Conversation view: the shared transcript parser (design docs/design/conversation-view.md).
otto-transcript.workspace = true
otto-product.workspace = true
otto-canvas.workspace = true
# Design Hall — the artifact graph (projects / artifacts / versions / links).
otto-design.workspace = true
otto-swarm.workspace = true
otto-workgraph.workspace = true
otto-workflows.workspace = true
otto-memory.workspace = true
otto-vault.workspace = true
otto-pty.workspace = true
otto-browser.workspace = true
async-trait.workspace = true
reqwest.workspace = true
chrono.workspace = true
chrono-tz = "0.10.4"
base64.workspace = true
tokio-tungstenite.workspace = true
# API-client engines: gRPC (tonic/protox/prost-reflect) + boa_engine scripts,
# split out so server edits don't re-check those dependency trees.
otto-apiclient.workspace = true
uuid.workspace = true
rand.workspace = true
reqwest_cookie_store.workspace = true
sha2.workspace = true
# TURN REST credentials: ephemeral HMAC-SHA1, never return the shared secret.
hmac = "0.13.0"
sha1 = "0.11.0"

# Secrets store status + the confirmed "Secure secrets" migration
# (`/admin/secrets/*`); browser-credential route tests also use its FileStore.
otto-keychain.workspace = true

[dev-dependencies]
# Self dev-dependency: turns on `test-util` for tests/*.rs.
otto-server = { path = ".", features = ["test-util"] }
# RBAC guard integration tests drive a minimal router via tower's oneshot and
# read the response body. Pinned to the versions axum 0.8 already resolves.
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
# Isolated Jira/Confluence captures for the actual workflow publication path.
wiremock = "0.6.5"
# browser_login's audit-log test captures real `tracing` output (via a custom
# `MakeWriter`) to assert the domain is logged and the password never is.
tracing-subscriber.workspace = true

# Local shared-screen OCR; Vision ships with macOS (no cloud credentials).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes"] }
