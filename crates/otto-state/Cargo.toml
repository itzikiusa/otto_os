[package]
name = "otto-state"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
otto-core.workspace = true
sqlx.workspace = true
serde.workspace = true
# raw_value: node detail finds its node without building every node's Value.
serde_json = { workspace = true, features = ["raw_value"] }
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true
# Chunked prune yields the SQLite writer between batches (tokio::time::sleep);
# sqlx already runs on the tokio runtime here.
tokio.workspace = true
# DbPool's Executor impl returns sqlx's boxed stream/future types.
futures-util.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
