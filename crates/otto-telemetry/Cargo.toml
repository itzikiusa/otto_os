# The instrumentation LEAF: span types, `context::{scope, measure,
# measure_result}` and the `SpanSink` trait. Library crates (otto-git,
# otto-dbviewer, otto-agent-run) depend on this only; the ClickHouse-backed
# service lives in `otto-telemetry-collector`, which only the daemon
# composition root (otto-server, ottod) links.
