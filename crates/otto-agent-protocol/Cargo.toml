[package]
name = "otto-agent-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Structured agent runtime: agent CLIs driven over stdio protocols (stream-json / app-server / ACP) behind one driver trait, the normalized event stream + replay ring, and the /runtime-sessions router"

[dependencies]
otto-core = { workspace = true }
otto-state = { workspace = true }
# The PTY spawn's safety pipeline (cwd refusal, trust, context, Seatbelt) via
# `SessionManager::prepare_runtime_spawn`; `CommandSpec` is its spec type.
otto-sessions = { workspace = true }
otto-pty = { workspace = true }
otto-telemetry = { workspace = true }
# Claude's plan limits (`rate_limit_event` frames) recorded passively per login.
otto-usage = { workspace = true }
# Claude's project-folder encoder for the `ai-title` transcript probe.
otto-transcript = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
# `--session-id` for a fresh Claude thread (the CLI requires a UUID).
uuid = { workspace = true }
# Decoding prompt attachments before they are stored.
base64 = { workspace = true }
# ACP wire types (the official SDK's schema; protocol v1). Only the types: the
# runtime owns the process and the JSON-RPC framing (see src/acp.rs).
agent-client-protocol = { version = "5.0.0", default-features = false }
# killpg: interrupt / kill the child's whole process group.
libc = "0.2.191"
sqlx = { workspace = true }

[features]
# The in-memory fake agents (`scripted`: the fake programs behind the
# runtime's ChildTransport seam, no process) and the `OTTO_FAKE:` script
# protocol (`fake_script`) for other crates' integration suites.
test-util = []

[dev-dependencies]
tempfile = { workspace = true }
# tests/fake_script.rs: the scripted driver, and the engine's real prompt
# shapes (step preamble, reviewer prompt) the fakes' finders read.
otto-agent-protocol = { path = ".", features = ["test-util"] }
otto-workflows = { workspace = true }
otto-review = { workspace = true }

# Test doubles: an ACP agent, a Codex app-server and Claude's SDK stream-json
# over stdio, all acting out the `OTTO_FAKE:` scripts of src/fake_script.rs.
# Integration tests reach them via `CARGO_BIN_EXE_otto-fake-{agent,codex,claude}`.
[[bin]]
name = "otto-fake-agent"
path = "src/bin/otto-fake-agent.rs"
test = false
doc = false

[[bin]]
name = "otto-fake-codex"
path = "src/bin/otto-fake-codex.rs"
test = false
doc = false

[[bin]]
name = "otto-fake-claude"
path = "src/bin/otto-fake-claude.rs"
test = false
doc = false

[[bin]]
name = "otto-runtime-holder"
path = "src/bin/otto-runtime-holder.rs"
test = false
doc = false
