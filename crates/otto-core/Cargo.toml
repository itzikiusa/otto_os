[package]
name = "otto-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hex = { workspace = true }
# `rc`: bus events carry `Arc<str>` / `Arc<[_]>` payloads (cheap clones).
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
ulid.workspace = true
sha2.workspace = true
# `secrets::get_async` runs keychain misses on the blocking pool.
tokio = { workspace = true }
# `cadence`: schedule wall-clock times in the schedule's IANA timezone.
chrono-tz = "0.10.4"

