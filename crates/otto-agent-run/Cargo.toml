[package]
name = "otto-agent-run"
version.workspace = true
edition.workspace = true
license.workspace = true

# Agent-run primitives shared by every engine that drives a CLI agent through a
# PTY session (code review, workflows, swarm, goal loops, product runs…): the
# result-file watcher + recovery loop (`agent_run`), the transcript-based turn
# oracle (`turn_oracle`), off-runtime blocking IO (`offload`) and screen text
# helpers (`screen`), the resumable managed-session turn runner
# (`session_turn`) and the shared assist job (`assist`). Leaf crate: depends
# on no otto-server code.

[dependencies]
otto-core.workspace = true
otto-sessions.workspace = true
otto-orchestrator.workspace = true
otto-telemetry.workspace = true
otto-transcript.workspace = true
# The resume-ownership authority reads the `sessions` row
# (`session_turn::resume`); already a dependency of otto-sessions.
otto-state.workspace = true
chrono.workspace = true
serde_json.workspace = true
# Per-turn reply directories (`session_turn::reply`).
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# session_turn lifecycle tests drive a real SessionManager on a migrated sqlite
# and spawn plain /bin/sh sessions.
otto-pty.workspace = true
