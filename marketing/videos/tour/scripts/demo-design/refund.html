<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Refund confirmation</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; font:16px/1.5 -apple-system, 'SF Pro Text', sans-serif; color:#111827;
         background: linear-gradient(160deg, #EEF2FF, #F5F3FF 50%, #ECFDF5); }
  .card { width: 440px; background:#fff; border-radius:26px; padding:34px; text-align:center; box-shadow: 0 30px 60px rgba(17,24,39,.12); }
  .ok { width:72px; height:72px; margin:0 auto 14px; border-radius:50%; background:#D1FAE5; display:grid; place-items:center; font-size:36px; color:#059669; }
  h1 { font-size:28px; margin:0 0 6px; letter-spacing:-.4px; }
  p { color:#6B7280; margin:0 0 20px; }
  .amt { font-size:44px; font-weight:800; color:#4F46E5; margin: 4px 0 18px; }
  .btn { display:block; border-radius:999px; padding:14px; background:#4F46E5; color:#fff; font-weight:700; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="ok">✓</div>
    <h1>Refund on its way</h1>
    <p>We saw the photo — sorry about the damage.</p>
    <div class="amt">$129.00</div>
    <a class="btn">Back to my orders</a>
  </div>
</body>
</html>
