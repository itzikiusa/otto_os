# Comparison and resource audit: docs/testing/ci-performance.md.
# nextest does not run doctests: follow it with `cargo test --workspace --doc`.
nextest-version = "0.9.146"

[profile.default]
# Bound process-per-test fan-out, including each test's own Tokio/SQLite threads.
test-threads = 8
retries = 0

[profile.ci]
# Keep fan-out bounded on the smaller hosted runner; inherit resource groups.
test-threads = 4

[test-groups]
# e2e.rs has an in-process SERIAL mutex around ClickHouse startup. Reproduce
# that exclusion across processes; temp directories/ephemeral ports alone
# do not prevent concurrent server startup from exceeding readiness deadlines.
clickhouse = { max-threads = 1 }
# PTY/session tests spawn real shells and use short readiness/kill deadlines.
# Keep their system process pressure bounded across all test binaries.
processes = { max-threads = 2 }
# Wall-clock gates (otto-server tests/runtime_lag.rs: worst ticker lag under a
# 20 ms budget). One at a time, and each runs ALONE (`threads-required` in the
# override below) — on main's CI (d6207941) they shared the 4 vCPUs with three
# other test processes plus the ClickHouse servers the k8s ratchets spawn
# (outside nextest's slot count) and all three attempts landed at 20–21 ms.
# Each case still takes the best of three attempts against outside noise.
timing = { max-threads = 1 }

[[profile.default.overrides]]
filter = '(package(otto-usage) & binary(e2e)) | (package(otto-server) & binary(it) & test(/^k8s_monitor_clickhouse::/))'
test-group = 'clickhouse'

[[profile.default.overrides]]
filter = 'package(otto-pty) | package(otto-sessions) | package(otto-sandbox)'
test-group = 'processes'

[[profile.default.overrides]]
filter = 'package(otto-server) & binary(it) & test(/^runtime_lag::/)'
test-group = 'timing'
threads-required = 'num-test-threads'

# Unit tests with short UNSCALED wall-clock asserts ("returned in < 50 ms",
# "did not wait for the Keychain", "woken by the poke"): they prove something
# did not block, so they are only meaningful without CPU contention. Run them
# alone in the timing group instead of padding every budget for a loaded runner.
[[profile.default.overrides]]
filter = '''
(package(otto-server) & kind(lib) & (
    test(/goal_loop_tests::until_flag_wakes_on_ring_and_backstops_a_silent_store$/)
  | test(/swarm_wake::tests::a_poke_wakes_the_coordinator_after_the_min_gap$/)
  | test(/goal_loop_commands::tests::cancellation_kills_verification_descendants$/)))
| (package(otto-state) & test(/maintenance::tests::offline_compaction_swaps_verified_copy_and_keeps_old_until_confirmed$/))
| (package(otto-keychain) & test(/control::tests::locked_keychain_times_out_instead_of_blocking$/))
'''
test-group = 'timing'
threads-required = 'num-test-threads'
