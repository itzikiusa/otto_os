name: Otto CodeQL Configuration

# Right-sized CodeQL config for a local-loopback developer desktop app:
# 1. Never scan vendored third-party crates, test suites, E2E harnesses,
#    example plugins, or docs (eliminates huge compile/analysis waste and
#    test-fixture false positives).
# 2. Run only high-precision, high/critical-severity vulnerability rules, and
#    exclude rules whose assumptions do not fit a local developer workbench
#    (e.g. user-configured HTTP endpoints in the REST/Confluence client,
#    content-hash SHA/MD5 keys, UI tab state in localStorage, or intentional
#    `insecure_tls` toggles in the API client).

query-filters:
  - exclude:
      problem.severity:
        - warning
        - recommendation
  - exclude:
      precision:
        - low
        - medium
  - exclude:
      id: rust/cleartext-transmission
  - exclude:
      id: rust/cleartext-logging
  - exclude:
      id: rust/weak-sensitive-data-hashing
  - exclude:
      id: rust/disabled-certificate-check
  - exclude:
      id: rust/path-injection
  - exclude:
      id: js/clear-text-storage-of-sensitive-data
  - exclude:
      id: js/functionality-from-untrusted-source

paths-ignore:
  - vendor/**
  - marketing/**
  - '**/tests/**'
  - '**/*_test.rs'
  - '**/*_tests.rs'
  - crates/**/benches/**
  - ui/e2e/**
  - ui/unit/**
  - examples/**
  - packaging/tests/**
  - scripts/test_*.py
  - docs/**
  - dev/**
