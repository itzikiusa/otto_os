name: macOS

# The shipping platform, compiled, linted and tested on Darwin. Linux CI
# (ci.yml) never compiles the `cfg(target_os = "macos")` branches: the
# Seatbelt sandbox (otto-sandbox, and the sessions + scheduled tasks it
# confines), the objc2 Vision FFI and Darwin resource probes (otto-rooms,
# otto-server, otto-telemetry-collector), ottod's launchd/Keychain wiring,
# otto-pty's Darwin PTY semantics, the Keychain store, otto-ssh's real-OpenSSH SFTP test, and the
# standalone Tauri desktop workspace (apps/desktop/src-tauri — not part of the
# root workspace).
#
# ONE workflow, one cargo cache (S12-310): the old macos.yml + macos-server.yml
# both cold-built the pty/sessions/sandbox chain on separate caches.
#
# Which crates (scripts/macos-ci-crates.py; `--check` in ci.yml's Rust job
# fails when this file drifts):
#   * the `-p` lists below = every crate whose code mentions
#     `target_os = "macos"`, plus otto-pty / ottod (Darwin behaviour without a
#     cfg). A macOS-only test in a crate missing here would never run (S12-306).
#   * the `crates/<dir>/**` trigger paths = those crates plus their reverse
#     dependents. A forward-dependency change that breaks macOS-only code is
#     caught by the nightly run and the push to main.
# The desktop job runs only when apps/desktop/ (or this file) changed. On a
# PR the daemon job always runs the macOS-cfg clippy; its test run only when
# a Darwin-behaviour crate changed (see the route step) — main + nightly
# always run both.

on:
  pull_request:
    paths:
      - 'crates/otto-agent-run/**'
      - 'crates/otto-apiclient/**'
      - 'crates/otto-assistant/**'
      - 'crates/otto-automation/**'
      - 'crates/otto-aws/**'
      - 'crates/otto-brokers/**'
      - 'crates/otto-browser/**'
      - 'crates/otto-canvas/**'
      - 'crates/otto-channels/**'
      - 'crates/otto-connections/**'
      - 'crates/otto-dbviewer/**'
      - 'crates/otto-design-assist/**'
      - 'crates/otto-improve/**'
      - 'crates/otto-insights/**'
      - 'crates/otto-k8s/**'
      - 'crates/otto-keychain/**'
      - 'crates/otto-orchestrator/**'
      - 'crates/otto-product/**'
      - 'crates/otto-pty/**'
      - 'crates/otto-review/**'
      - 'crates/otto-rooms/**'
      - 'crates/otto-sandbox/**'
      - 'crates/otto-server/**'
      - 'crates/otto-sessions/**'
      - 'crates/otto-ssh/**'
      - 'crates/otto-telemetry-collector/**'
      - 'crates/otto-workflows/**'
      - 'crates/ottod/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.config/nextest.toml'
      - 'apps/desktop/**'
      - '.github/workflows/macos.yml'
  push:
    branches: [main]
    paths:
      - 'crates/otto-agent-run/**'
      - 'crates/otto-apiclient/**'
      - 'crates/otto-assistant/**'
      - 'crates/otto-automation/**'
      - 'crates/otto-aws/**'
      - 'crates/otto-brokers/**'
      - 'crates/otto-browser/**'
      - 'crates/otto-canvas/**'
      - 'crates/otto-channels/**'
      - 'crates/otto-connections/**'
      - 'crates/otto-dbviewer/**'
      - 'crates/otto-design-assist/**'
      - 'crates/otto-improve/**'
      - 'crates/otto-insights/**'
      - 'crates/otto-k8s/**'
      - 'crates/otto-keychain/**'
      - 'crates/otto-orchestrator/**'
      - 'crates/otto-product/**'
      - 'crates/otto-pty/**'
      - 'crates/otto-review/**'
      - 'crates/otto-rooms/**'
      - 'crates/otto-sandbox/**'
      - 'crates/otto-server/**'
      - 'crates/otto-sessions/**'
      - 'crates/otto-ssh/**'
      - 'crates/otto-telemetry-collector/**'
      - 'crates/otto-workflows/**'
      - 'crates/ottod/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.config/nextest.toml'
      - 'apps/desktop/**'
      - '.github/workflows/macos.yml'
  schedule:
    - cron: '53 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Cheap Linux router: which macOS jobs this change needs. Non-PR events
  # (push to main, nightly, dispatch) run both.
  changes:
    name: Route (what changed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      daemon: ${{ steps.route.outputs.daemon }}
      desktop: ${{ steps.route.outputs.desktop }}
      mac_tests: ${{ steps.route.outputs.mac_tests }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts
          filter: blob:none
      # The PR's file list from the API (the old full-history checkout took
      # up to 4 min on this repo). The workflow only triggers on the paths
      # above, so anything outside apps/desktop/ is daemon-relevant.
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "${CHANGED:-0}" -ge 3000 ]; then
            { python3 scripts/ci-route.py --all; echo mac_tests=true; } | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt" \
            || [ "$(wc -l < "$RUNNER_TEMP/changed.txt")" -ne "$CHANGED" ]; then
            echo "::warning::could not list the PR's files; running every job"
            { python3 scripts/ci-route.py --all; echo mac_tests=true; } | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci-route.py < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
          # The macOS TEST run (7–10 min of build on a 3-core runner) on a PR
          # only when a crate whose Darwin behaviour it tests changed; every
          # PR still gets the macOS-cfg clippy (a full type-check of the
          # Darwin code), and pushes to main + the nightly run the tests.
          if grep -qE '^(crates/(otto-sandbox|otto-pty|otto-keychain|otto-sessions|otto-rooms|otto-ssh|otto-telemetry-collector|otto-apiclient|otto-automation|otto-brokers|otto-browser|ottod)/|Cargo\.lock$|\.config/nextest\.toml$|\.github/workflows/macos\.yml$)' "$RUNNER_TEMP/changed.txt"; then
            echo mac_tests=true | tee -a "$GITHUB_OUTPUT"
          else
            echo mac_tests=false | tee -a "$GITHUB_OUTPUT"
          fi

  daemon:
    name: Daemon crates (macOS)
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Blobless sparse checkout: skips ~240 MB of videos / screenshots.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/marketing/
            !/docs/reviews/
            !/docs/testing/room-games/

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy

      - name: Restore cargo + workspace targets
        id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/debug/ottod
            target/.ci-source-hashes.json
          key: cargo-full-${{ runner.os }}-daemon-v1-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', '.cargo/config.toml') }}-${{ hashFiles('crates/**', 'vendor/**') }}
          restore-keys: |
            cargo-full-${{ runner.os }}-daemon-v1-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', '.cargo/config.toml') }}-
            cargo-full-${{ runner.os }}-daemon-v1-

      - name: Restore cached source mtimes
        run: python3 scripts/ci-cargo-cache.py restore

      - name: Install nextest
        uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-nextest@0.9.150

      # otto-server links otto-brokers → rdkafka-sys, which builds librdkafka
      # with CMake (libcurl headers ship in the macOS SDK).
      - name: Ensure cmake
        run: command -v cmake || brew install cmake

      - name: cargo clippy (macOS cfg)
        run: >-
          cargo clippy
          -p otto-apiclient -p otto-automation -p otto-brokers -p otto-browser -p otto-keychain -p otto-pty -p otto-rooms -p otto-sandbox -p otto-server -p otto-sessions -p otto-ssh -p otto-telemetry-collector -p ottod
          --features otto-server/test-util
          --lib --bins --test holder --test ring_allocation --test seatbelt_exec --test agent_messaging --test broadcast_e2e --test folder_trust_overcome --test isolation --test persist_restart --test terminal_latency --test lightpanda --test lightpanda_login --test snips --test profile_lock
          -- -D warnings

      # Unit tests plus each crate's integration binaries — except
      # otto-server's `it`, platform-neutral HTTP/DB coverage that Linux CI
      # already runs in full (omitted from `--test` so Cargo never compiles it
      # on macOS, while `--features otto-server/test-util` compiles `otto-server`
      # once for both `ottod` and `snips`).
      - name: Build test binaries
        if: needs.changes.outputs.mac_tests == 'true'
        run: >-
          cargo nextest run --no-run
          -p otto-apiclient -p otto-automation -p otto-brokers -p otto-browser -p otto-keychain -p otto-pty -p otto-rooms -p otto-sandbox -p otto-server -p otto-sessions -p otto-ssh -p otto-telemetry-collector -p ottod
          --features otto-server/test-util
          --lib --bins --test holder --test ring_allocation --test seatbelt_exec --test agent_messaging --test broadcast_e2e --test folder_trust_overcome --test isolation --test persist_restart --test terminal_latency --test lightpanda --test lightpanda_login --test snips --test profile_lock
          --profile ci

      # Saved by main pushes / the nightly only (PR saves evicted main's
      # caches at the 10 GB repo cap; see ci.yml).
      - name: Prepare cargo cache manifest
        if: github.event_name != 'pull_request' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: python3 scripts/ci-cargo-cache.py prepare-save

      - name: Save cargo cache
        if: github.event_name != 'pull_request' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/debug/ottod
            target/.ci-source-hashes.json
          key: cargo-full-${{ runner.os }}-daemon-v1-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', '.cargo/config.toml') }}-${{ hashFiles('crates/**', 'vendor/**') }}

      - name: cargo nextest
        if: needs.changes.outputs.mac_tests == 'true'
        run: >-
          cargo nextest run
          -p otto-apiclient -p otto-automation -p otto-brokers -p otto-browser -p otto-keychain -p otto-pty -p otto-rooms -p otto-sandbox -p otto-server -p otto-sessions -p otto-ssh -p otto-telemetry-collector -p ottod
          --features otto-server/test-util
          --lib --bins --test holder --test ring_allocation --test seatbelt_exec --test agent_messaging --test broadcast_e2e --test folder_trust_overcome --test isolation --test persist_restart --test terminal_latency --test lightpanda --test lightpanda_login --test snips --test profile_lock
          --profile ci --no-fail-fast

  desktop:
    name: Desktop app (Tauri, macOS)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Blobless sparse checkout: skips ~240 MB of videos / screenshots.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/marketing/
            !/docs/reviews/
            !/docs/testing/room-games/

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          save-if: ${{ github.event_name != 'pull_request' }}

      # tauri-build checks that the sidecar (`binaries/ottod-<triple>`) and the
      # frontend dist exist at compile time. The real ones are built by the
      # release workflow; lint/test only needs placeholders, so skip building
      # the daemon + UI here.
      - name: Stage placeholder sidecar + frontend
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p binaries ../../../ui/dist
          printf '#!/bin/sh\nexit 0\n' > "binaries/ottod-${triple}"
          chmod +x "binaries/ottod-${triple}"
          [ -f ../../../ui/dist/index.html ] || echo '<!doctype html><title>Otto</title>' > ../../../ui/dist/index.html

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
