name: CI

# Sub-5-minute PR gate for the Rust workspace + Svelte UI.
# Architecture for <5m wall-clock feedback:
#   1. Parallel crate-group test shards (`core`, `features`, `server-unit`,
#      `server-it`) with `ld.lld` and `Swatinem/rust-cache` (`cache-all-crates:
#      true` so unchanged workspace crates are cached across commits, not just
#      crates.io deps). A metadata check in `rust-lint` verifies that the union
#      of `-p` crates across test jobs equals 100% of `cargo metadata` members.
#   2. `e2e-gate` splits across 4 parallel single-browser shards (`chromium`
#      1/2 & 2/2, `webkit` 1/2 & 2/2) and folds all 4 JSON reports into the
#      blocking `e2e-flaky-check.mjs --gate` verdict.
#   3. Long `#[ignore]`d stress/sleep suites (`_at_50k_revisions_`, telemetry
#      crash-recovery) and the 4-shard full functional E2E matrix run nightly in
#      `perf-nightly.yml` and `e2e-nightly.yml`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CLICKHOUSE_VERSION: 26.8.34.13
  CLICKHOUSE_SHA512: e5c753b258679daa882747aaec10b351a85bcad1412af7957d4a4616dcf5b45663da219bd37fe0697fde2ae76dbed2ba5b414ce9a5c8044c6d1fa0142e03e4cc
  NEXTEST_VERSION: 0.9.150

jobs:
  rust-lint:
    name: Rust (fmt · clippy · guards)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Ensure runner disk headroom
        run: |
          required_kib=$((30 * 1024 * 1024))
          for unused_tool in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            available_kib=$(df -Pk . | awk 'NR == 2 {print $4}')
            if (( available_kib >= required_kib )); then
              break
            fi
            sudo rm -rf "$unused_tool"
          done
          df -h /

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: macOS workflow covers every crate with macOS-only code
        run: python3 scripts/macos-ci-crates.py --check

      - name: Rust LOC ratchet
        run: python3 scripts/loc-ratchet.py

      - name: Verify CI test shards cover every workspace crate and nextest filter
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess, sys, tomllib

          meta = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--format-version", "1", "--no-deps", "--offline"],
                  text=True,
              )
          )
          members = {p["name"] for p in meta["packages"] if p["id"] in set(meta["workspace_members"])}
          ci = pathlib.Path(".github/workflows/ci.yml").read_text()

          tested = set()
          for marker in ("# TEST_GROUP_CORE", "# TEST_GROUP_FEATURES", "# TEST_GROUP_SERVER_UNIT"):
              i = ci.rindex(marker)
              j = ci.find("- name:", i + len(marker))
              block = ci[i : j if j != -1 else len(ci)]
              tested |= set(re.findall(r"-p\s+([A-Za-z0-9_-]+)", block))

          missing = sorted(members - tested)
          extra = sorted(tested - members)
          if missing or extra:
              print(f"::error file=.github/workflows/ci.yml::workspace crate coverage drift: missing={missing} extra={extra}")
              sys.exit(1)

          checked_pkgs = set()
          for m in re.finditer(r"check-nextest-filters\.py\s+--packages\s+([^\n]+)", ci):
              for tok in m.group(1).split():
                  if tok.startswith("--"):
                      break
                  checked_pkgs.add(tok)

          cfg = tomllib.loads(pathlib.Path(".config/nextest.toml").read_text())
          needed_pkgs = set()
          for prof in cfg.get("profile", {}).values():
              for ov in prof.get("overrides", []):
                  needed_pkgs |= set(re.findall(r"package\(([A-Za-z0-9_-]+)\)", ov.get("filter", "")))
          unchecked = sorted(needed_pkgs - checked_pkgs)
          if unchecked:
              print(f"::error file=.github/workflows/ci.yml::nextest override packages not checked in CI: {unchecked}")
              sys.exit(1)
          print(f"ci crate coverage: ok ({len(members)} crates, {len(needed_pkgs)} nextest filter packages)")
          PY

      - name: Enable fast lld linker
        run: |
          if command -v ld.lld >/dev/null 2>&1; then
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/ld
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/x86_64-linux-gnu-ld
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: rust-lint
          cache-all-crates: true
          cache-on-failure: true

      - name: Install librdkafka build deps
        run: |
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          sudo python3 scripts/ci-apt-install.py cmake libcurl4-openssl-dev

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test-core:
    name: Rust · core & sessions (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Enable fast lld linker
        run: |
          if command -v ld.lld >/dev/null 2>&1; then
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/ld
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/x86_64-linux-gnu-ld
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: perf-gates
          cache-all-crates: true
          save-if: false

      - name: Install nextest
        run: |
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          tool_dir="$RUNNER_TEMP/otto-test-tools"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' 'b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f' "$archive" | sha256sum --check
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" cargo-nextest
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Install ClickHouse
        run: |
          archive="$RUNNER_TEMP/clickhouse.tgz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ClickHouse/ClickHouse/releases/download/v$CLICKHOUSE_VERSION-lts/clickhouse-common-static-$CLICKHOUSE_VERSION-amd64.tgz" \
            --output "$archive"
          printf '%s  %s\n' "$CLICKHOUSE_SHA512" "$archive" | sha512sum --check
          mkdir -p "$RUNNER_TEMP/ch"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ch"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$(find "$RUNNER_TEMP/ch" -type f -name clickhouse -path '*/bin/*' | head -n 1)" "$HOME/.local/bin/clickhouse"
          rm -rf "$RUNNER_TEMP/ch" "$archive"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: cargo nextest (core & sessions)
        env:
          OTTO_REQUIRE_CLICKHOUSE: "1"
        run: |
          # TEST_GROUP_CORE
          cargo nextest run \
            -p otto-core -p otto-git -p otto-git-cmd -p otto-keychain -p otto-netguard \
            -p otto-pty -p otto-rbac -p otto-sandbox -p otto-sessions -p otto-ssh \
            -p otto-state -p otto-telemetry -p otto-telemetry-collector -p otto-transcript \
            -p otto-usage \
            --profile ci --no-fail-fast --partition hash:${{ matrix.shard }}/2

      - name: nextest override filters match tests (core)
        if: matrix.shard == 1
        run: python3 scripts/check-nextest-filters.py --packages otto-usage otto-state otto-keychain otto-pty otto-sessions otto-sandbox

      - name: Terminal emulator budgets (otto-pty, release)
        if: matrix.shard == 1
        env:
          OTTO_PERF: '1'
          OTTO_PERF_BUDGET_SCALE: '3'
        run: cargo test -p otto-pty --release --lib perf_budgets -- --nocapture

      - name: cargo test (doctests · core)
        if: matrix.shard == 2
        run: cargo test --doc -p otto-sessions

  rust-test-features:
    name: Rust · domain & features (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Enable fast lld linker
        run: |
          if command -v ld.lld >/dev/null 2>&1; then
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/ld
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/x86_64-linux-gnu-ld
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: perf-gates
          cache-all-crates: true
          save-if: false

      - name: Install nextest
        run: |
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          tool_dir="$RUNNER_TEMP/otto-test-tools"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' 'b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f' "$archive" | sha256sum --check
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" cargo-nextest
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Install librdkafka build deps
        run: |
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          sudo python3 scripts/ci-apt-install.py cmake libcurl4-openssl-dev

      - name: cargo nextest (domain & features)
        run: |
          # TEST_GROUP_FEATURES
          cargo nextest run \
            -p otto-agent-run -p otto-apiclient -p otto-assistant -p otto-automation \
            -p otto-aws -p otto-brokers -p otto-browser -p otto-canvas -p otto-channels \
            -p otto-connections -p otto-context -p otto-dbviewer -p otto-design \
            -p otto-design-assist -p otto-improve -p otto-insights -p otto-issues \
            -p otto-k8s -p otto-mcp -p otto-memory -p otto-orchestrator -p otto-product \
            -p otto-review -p otto-rooms -p otto-skills -p otto-vault -p otto-workflows \
            --profile ci --no-fail-fast --partition hash:${{ matrix.shard }}/2

      - name: nextest override filters match tests (features)
        if: matrix.shard == 1
        run: python3 scripts/check-nextest-filters.py --packages otto-automation otto-agent-run

      - name: cargo test (doctests · features)
        if: matrix.shard == 2
        run: cargo test --doc -p otto-context -p otto-design -p otto-issues -p otto-product -p otto-review

  rust-test-server-unit:
    name: Rust · server unit & ottod (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Enable fast lld linker
        run: |
          if command -v ld.lld >/dev/null 2>&1; then
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/ld
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/x86_64-linux-gnu-ld
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: perf-gates
          cache-all-crates: true
          save-if: false

      - name: Install nextest
        run: |
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          tool_dir="$RUNNER_TEMP/otto-test-tools"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' 'b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f' "$archive" | sha256sum --check
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" cargo-nextest
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Install librdkafka build deps
        run: |
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          sudo python3 scripts/ci-apt-install.py cmake libcurl4-openssl-dev

      - name: cargo nextest (server unit & ottod)
        run: |
          # TEST_GROUP_SERVER_UNIT
          cargo nextest run \
            -p otto-server -p ottod \
            --lib --bins --test snips --test profile_lock \
            --profile ci --no-fail-fast --partition hash:${{ matrix.shard }}/2

  rust-test-server-it:
    name: Rust · server integration (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Enable fast lld linker
        run: |
          if command -v ld.lld >/dev/null 2>&1; then
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/ld
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/x86_64-linux-gnu-ld
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: perf-gates
          cache-all-crates: true
          save-if: false

      - name: Install nextest
        run: |
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          tool_dir="$RUNNER_TEMP/otto-test-tools"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' 'b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f' "$archive" | sha256sum --check
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" cargo-nextest
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Install ClickHouse (k8s monitor ratchets)
        run: |
          archive="$RUNNER_TEMP/clickhouse.tgz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ClickHouse/ClickHouse/releases/download/v$CLICKHOUSE_VERSION-lts/clickhouse-common-static-$CLICKHOUSE_VERSION-amd64.tgz" \
            --output "$archive"
          printf '%s  %s\n' "$CLICKHOUSE_SHA512" "$archive" | sha512sum --check
          mkdir -p "$RUNNER_TEMP/ch"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ch"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$(find "$RUNNER_TEMP/ch" -type f -name clickhouse -path '*/bin/*' | head -n 1)" "$HOME/.local/bin/clickhouse"
          rm -rf "$RUNNER_TEMP/ch" "$archive"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install librdkafka build deps
        run: |
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          sudo python3 scripts/ci-apt-install.py cmake libcurl4-openssl-dev

      - name: cargo nextest (server integration)
        env:
          OTTO_REQUIRE_CLICKHOUSE: "1"
        run: cargo nextest run -p otto-server --test it --profile ci --no-fail-fast --partition hash:${{ matrix.shard }}/3

      - name: nextest override filters match tests (server integration)
        if: matrix.shard == 1
        run: python3 scripts/check-nextest-filters.py --packages otto-server --cargo-arg=--test --cargo-arg=it

  ui:
    name: UI (svelte-check · tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Test deployment verification (mocked OS operations)
        working-directory: .
        run: python3 -B -m unittest discover -s packaging/tests -p 'test_*.py'

      - name: Test Insights collector calendar boundaries
        working-directory: .
        run: python3 -B -m unittest discover -s crates/otto-skills/assets/skills/insights/insights/scripts -p test_collect_window.py

      - name: Test the nextest override-filter guard (parsing)
        working-directory: .
        run: python3 -B -m unittest discover -s scripts -p 'test_check_nextest_filters.py'

      - name: Test the macOS crate-coverage guard
        working-directory: .
        run: python3 -B -m unittest discover -s scripts -p 'test_macos_ci_crates.py'

      - name: Test the Rust LOC ratchet
        working-directory: .
        run: python3 -B -m unittest discover -s scripts -p 'test_loc_ratchet.py'

      - name: Test bounded CI dependency installation
        working-directory: .
        run: python3 -B -m unittest discover -s scripts -p 'test_ci_apt_install.py'

      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run check
        run: npm run check

      - name: npm run test:unit
        run: npm run test:unit

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Chromium for the Team Performance plugin gate
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            sudo python3 ../scripts/ci-apt-install.py --prepare-external
            timeout --kill-after=10s 15m npx playwright install --with-deps chromium
          else
            sudo python3 ../scripts/ci-apt-install.py --prepare-external
            timeout --kill-after=10s 5m npx playwright install-deps chromium
          fi

      - name: Team Performance unit, server and browser regressions
        working-directory: examples/plugins/team-performance
        env:
          OTTO_TP_REQUIRE_BROWSER: '1'
        run: node --test --test-concurrency=1 test/*.test.js

      - name: npm run build
        run: npm run build

      - name: Bundle-size budget
        run: node scripts/bundle-budget.mjs

  build-ottod:
    name: Build test daemon (ottod, debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Enable fast lld linker
        run: |
          if command -v ld.lld >/dev/null 2>&1; then
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/ld
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/x86_64-linux-gnu-ld
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: perf-gates
          cache-all-crates: true
          cache-on-failure: true

      - name: Install librdkafka build deps
        run: |
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          sudo python3 scripts/ci-apt-install.py cmake libcurl4-openssl-dev

      - name: Build the test daemon
        run: cargo build -p ottod

      - name: Upload the test daemon
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ottod-debug
          path: target/debug/ottod
          retention-days: 3
          if-no-files-found: error

  e2e-gate-shard:
    name: E2E smoke (${{ matrix.project }} ${{ matrix.shard }}/2)
    needs: build-ottod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: 1
            project: desktop-browser
            browser: chromium
            shard: 1
          - slot: 2
            project: desktop-browser
            browser: chromium
            shard: 2
          - slot: 3
            project: iphone-portrait
            browser: webkit
            shard: 1
          - slot: 4
            project: iphone-portrait
            browser: webkit
            shard: 2
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download the test daemon
        uses: actions/download-artifact@v8.0.2
        with:
          name: ottod-debug
          path: target/debug

      - name: Make the test daemon executable
        run: chmod +x target/debug/ottod

      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        working-directory: ui
        run: npm ci

      - name: Cache Playwright ${{ matrix.browser }}
        id: pw-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Playwright ${{ matrix.browser }}
        working-directory: ui
        run: |
          sudo python3 ../scripts/ci-apt-install.py --prepare-external
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            timeout --kill-after=10s 10m npx playwright install --with-deps ${{ matrix.browser }}
          else
            timeout --kill-after=10s 5m npx playwright install-deps ${{ matrix.browser }}
          fi

      - name: E2E smoke shard
        working-directory: ui
        env:
          OTTO_E2E_BIN: ${{ github.workspace }}/target/debug/ottod
          OTTO_E2E_SLOT: '${{ matrix.slot }}'
          OTTO_E2E_FUNCTIONAL_ONLY: '1'
          OTTO_E2E_GATE: '1'
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 --retries=0

      - name: Upload shard JSON result
        if: success() || failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-gate-json-${{ matrix.slot }}
          path: ui/e2e/.results-${{ matrix.slot }}.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-gate-report-${{ matrix.slot }}
          path: |
            ui/e2e/.report-${{ matrix.slot }}
            ui/test-results
          include-hidden-files: true
          retention-days: 7

  e2e-gate:
    name: E2E smoke gate (blocking)
    needs: e2e-gate-shard
    if: always() && needs.e2e-gate-shard.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - name: Download shard JSON results
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: e2e-gate-json-*
          path: shard-results

      - name: Fail on flaky / skipped / missing gate tests
        working-directory: ui
        env:
          OTTO_E2E_SUMMARY_LABEL: E2E smoke gate
        run: |
          shopt -s globstar nullglob
          files=(../shard-results/**/.results-*.json)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::expected 4 shard reports, found ${#files[@]}"
            exit 1
          fi
          node scripts/e2e-flaky-check.mjs --gate --summary "${files[@]}"
          test "${{ needs.e2e-gate-shard.result }}" = "success"

  daemon-budget:
    name: Daemon perf budget
    needs: build-ottod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download the test daemon
        uses: actions/download-artifact@v8.0.2
        with:
          name: ottod-debug
          path: target/debug

      - name: Make the test daemon executable
        run: chmod +x target/debug/ottod

      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - name: Daemon perf budget
        env:
          OTTO_PERF_BUDGET_SCALE: '3'
        run: node scripts/perf/daemon-budget.mjs target/debug/ottod

  audit:
    name: cargo audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/otto-tools/cargo-audit/${{ env.CARGO_AUDIT_VERSION }}/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}-v1

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --root "$HOME/.cache/otto-tools/cargo-audit/$CARGO_AUDIT_VERSION"

      - name: Verify cargo-audit version
        run: |
          audit_bin="$HOME/.cache/otto-tools/cargo-audit/$CARGO_AUDIT_VERSION/bin"
          test "$("$audit_bin/cargo-audit" --version)" = "cargo-audit $CARGO_AUDIT_VERSION"
          echo "$audit_bin" >> "$GITHUB_PATH"

      - name: Save cargo-audit cache
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/otto-tools/cargo-audit/${{ env.CARGO_AUDIT_VERSION }}/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}-v1

      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071

  deny:
    name: cargo deny (duplicates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: cargo deny check bans
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check bans
          rust-version: "1.99.1"

  fix-has-test:
    name: UI fix carries a test (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check 🐛 fix( commits touching ui/src
        run: scripts/check-fix-has-test.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
