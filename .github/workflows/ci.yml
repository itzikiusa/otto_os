name: CI

# Lint, type-check, and test the Rust workspace + the Svelte UI on every push
# and pull request. The Tauri desktop app (apps/desktop/src-tauri) is a separate,
# macOS-only workspace (launchd + Keychain + codesigning), so it is NOT built on
# these Linux runners: macos.yml's `desktop` job runs its fmt/clippy/`cargo test`
# (supervisor plist + keep_previous_daemon, browser allow-list, window registry,
# the no-remote-webviews capability pin) on every PR touching apps/desktop/**
# and nightly. The daemon crates' macOS cfg branches run in macos-server.yml.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only reads the checked-out tree (build, lint,
# type-check, test). Pin the GITHUB_TOKEN to read-only contents at the top level
# so no job can mutate the repo, and so the default broad token scope is dropped.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # No debuginfo in CI builds. Each otto-server integration-test binary links
  # the full workspace; with debuginfo the parallel link step exhausts the
  # 14 GB runner disk and ld dies with SIGBUS ("ld terminated with signal 7").
  # CI never reads the debuginfo anyway — a backtrace still has symbol names.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # The ONE ClickHouse pin (SHA-512 of this exact release asset) for every job
  # that installs the single binary: the Rust job's k8s-monitor ratchets and
  # the e2e-functional shards' usage/telemetry engine.
  CLICKHOUSE_VERSION: 26.8.15.10
  CLICKHOUSE_SHA512: d54f83e187b19399260fa9d7f68403a7c3adf48059f211d0620216e6ea49687490898b5aa32f49d9728db58c5912cfb700148b814b8c3314f88ccfa940ffd85a

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    env:
      NEXTEST_VERSION: 0.9.146
    steps:
      - uses: actions/checkout@v7.0.1

      # Older images had only ~14 GiB free and exhausted disk during linking.
      # Keep conservative headroom without paying for a blanket purge on larger
      # images. Only unused, preinstalled tools on this disposable runner go.
      - name: Ensure runner disk headroom
        run: |
          required_kib=$((40 * 1024 * 1024))
          for unused_tool in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            available_kib=$(df -Pk . | awk 'NR == 2 {print $4}')
            if (( available_kib >= required_kib )); then
              break
            fi
            sudo rm -rf "$unused_tool"
          done
          df -h /
          available_kib=$(df -Pk . | awk 'NR == 2 {print $4}')
          if (( available_kib < required_kib )); then
            echo "::error::Less than 40 GiB free before restoring the Rust cache"
            exit 1
          fi

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo registry/git + ./target, keyed on Cargo.lock.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.2

      - name: Report restored cache disk usage
        run: |
          df -h /
          du -sh target || true

      # Upstream prebuilt binary: avoid compiling the test runner on every job.
      # SHA-256 is pinned to the x86_64 Linux asset of this exact release.
      - name: Install nextest
        run: |
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          tool_dir="$RUNNER_TEMP/otto-test-tools"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' '682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428' "$archive" | sha256sum --check
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" cargo-nextest
          "$tool_dir/cargo-nextest" nextest --version
          echo "$tool_dir" >> "$GITHUB_PATH"

      # The k8s-monitor ClickHouse tests (every query builder against a real
      # engine + the rows-read-per-refresh ratchet) skip without a `clickhouse`
      # binary, so they passed vacuously here. Install the pinned single binary
      # (SHA-512 pinned to this exact release asset) and REQUIRE it: the tests
      # fail instead of skipping when OTTO_REQUIRE_CLICKHOUSE is set.
      - name: Install ClickHouse (k8s monitor ratchets)
        run: |
          archive="$RUNNER_TEMP/clickhouse.tgz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ClickHouse/ClickHouse/releases/download/v$CLICKHOUSE_VERSION-lts/clickhouse-common-static-$CLICKHOUSE_VERSION-amd64.tgz" \
            --output "$archive"
          printf '%s  %s\n' "$CLICKHOUSE_SHA512" "$archive" | sha512sum --check
          mkdir -p "$RUNNER_TEMP/ch"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ch"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$(find "$RUNNER_TEMP/ch" -type f -name clickhouse -path '*/bin/*' | head -n 1)" "$HOME/.local/bin/clickhouse"
          rm -rf "$RUNNER_TEMP/ch" "$archive"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/clickhouse" local --version

      # librdkafka (rdkafka-sys, for the Message Brokers viewer) is compiled from
      # source by CMake and links libcurl for OAUTHBEARER/OIDC. Ubuntu runners
      # preinstall cmake and ship the libcurl runtime but NOT its dev headers, so
      # the build aborts on <curl/curl.h>. Install cmake (explicit — don't rely on
      # the runner image) + the headers (macOS already has both in the SDK).
      - name: Install librdkafka build deps
        # The runner image ships third-party apt sources (Google Chrome, …) that
        # intermittently fail `apt-get update` with "Hash Sum mismatch" and sank
        # whole runs before our code built. We only need Ubuntu's own archive
        # for cmake/libcurl, so drop the extras first.
        run: |
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update || echo "::warning::apt-get update failed for some sources; installing from what refreshed"
          sudo apt-get install -y cmake libcurl4-openssl-dev

      # Blocking: the tree was formatted repo-wide once; keep it that way.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Same full binary/test inventory as cargo test; shared external resources
      # are bounded in .config/nextest.toml. Ignored tests remain ignored.
      - name: cargo nextest
        env:
          OTTO_REQUIRE_CLICKHOUSE: "1"
        run: cargo nextest run --workspace --profile ci --no-fail-fast

      # Every `.config/nextest.toml` override disjunct must still match >=1
      # test: a crate split / module move otherwise orphans a `timing` or
      # `processes` entry silently and the wall-clock asserts it protects
      # run under full contention again. Lists the binaries built above.
      - name: nextest override filters match tests
        if: success() || failure()
        run: python3 scripts/check-nextest-filters.py

      # Scale gates kept out of the everyday run (#[ignore], e.g. the 50k-revision
      # vault listing, ~40 s of fixture creation) still gate every PR here. Same
      # build as above (--workspace), so this only lists + runs; no recompile.
      - name: cargo nextest (ignored scale gates)
        run: cargo nextest run --workspace --profile ci --run-ignored only -E 'test(/_at_50k_revisions_/)'

      # Exercise the real pinned collector/exporter and isolated crash fixtures.
      # Keep process recovery serial and separate from the shared test fan-out.
      - name: Telemetry delivery and collector recovery
        run: cargo test -p otto-telemetry --lib -- --ignored --test-threads=1

      # Daemon-side terminal budgets (perf 01 F7/N4): snapshot capture /
      # format / reflow / feed throughput, release profile, ×3 for shared
      # runners, best-of-N rounds. BLOCKING — unlike the advisory perf-gates
      # job, this is pure CPU work with no browser, daemon or network, so a
      # failure is a real regression. (The scrollback memory assertion,
      # `short_lines_at_wide_grid_keep_a_small_scrollback`, runs in nextest.)
      - name: Terminal emulator budgets (otto-pty, release)
        env:
          OTTO_PERF: '1'
          OTTO_PERF_BUDGET_SCALE: '3'
        run: cargo test -p otto-pty --release --lib perf_budgets -- --nocapture

      # Embedded ClickHouse budgets (perf2/09 R6): idle thread count of the
      # usage server with Otto's config (OTTO_PERF), plus the per-summary /
      # per-report statement + rows-read guard and the idle-stop wake test.
      # Uses the pinned clickhouse installed above. Report-only.
      - name: ClickHouse usage budgets (otto-usage)
        continue-on-error: true
        env:
          OTTO_PERF: '1'
        run: |
          cargo test -p otto-usage --test e2e \
            -- budget summary_and_report_query_budget idle_stop --nocapture

      # nextest does not execute doctests, so retain Cargo's separate gate.
      - name: cargo test (doctests)
        run: cargo test --workspace --doc

      - name: Report Rust build disk usage
        if: always()
        run: |
          df -h /
          du -sh target || true

  ui:
    name: UI (svelte-check · tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Test deployment verification (mocked OS operations)
        working-directory: .
        run: python3 -B -m unittest discover -s packaging/tests -p 'test_*.py'

      - name: Test Insights collector calendar boundaries
        working-directory: .
        run: python3 -B -m unittest discover -s crates/otto-skills/assets/skills/insights/insights/scripts -p test_collect_window.py

      - name: Test the nextest override-filter guard (parsing)
        working-directory: .
        run: python3 -B -m unittest discover -s scripts -p 'test_check_nextest_filters.py'

      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm ci

      # `check` = svelte-check (against tsconfig.app.json) + tsc -p tsconfig.node.json.
      - name: npm run check
        run: npm run check

      # Pure-module unit tests (node:test on Node 22's built-in type stripping; no extra dependency).
      - name: npm run test:unit
        run: npm run test:unit

      # Catches build-only breakage that type-checking alone misses.
      - name: npm run build
        run: npm run build

      # Gzip bytes of the entry, the shell chunk and every page chunk (static
      # closure from dist/.vite/manifest.json) vs scripts/bundle-budget.json —
      # >3 % growth fails; ratchet with `node scripts/bundle-budget.mjs --update`.
      - name: Bundle-size budget
        run: node scripts/bundle-budget.mjs

  # Build the debug test daemon ONCE and hand it to every job that drives a
  # real ottod (e2e-functional shards, perf-gates, daemon-budget) as an
  # artifact — each of those used to compile the whole workspace itself.
  build-ottod:
    name: Build test daemon (ottod, debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: perf-gates

      # Same librdkafka prerequisites as the Rust job (ottod links otto-brokers).
      - name: Install librdkafka build deps
        run: |
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update || echo "::warning::apt-get update failed for some sources; installing from what refreshed"
          sudo apt-get install -y cmake libcurl4-openssl-dev

      - name: Build the test daemon
        run: cargo build -p ottod

      - name: Upload the test daemon
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ottod-debug
          path: target/debug/ottod
          retention-days: 3
          if-no-files-found: error

  # BLOCKING e2e smoke gate: the green-history subset listed in
  # ui/e2e/gate-specs.ts (~35 specs: shell, sessions, API client, canvas,
  # proof packs, scheduled tasks, git, assistant, two mobile pages) on the
  # `desktop-gate` (Chromium) + `iphone-gate` (WebKit) projects. Unlike the
  # sharded suite below it has NO continue-on-error: retries 0, any `flaky`
  # count fails, and a red result fails the workflow — make this job a
  # required status check. Gate specs need only the isolated throwaway daemon
  # (no docker stack / redis / ClickHouse / tour film), so setup stays small.
  e2e-gate:
    name: E2E smoke gate (blocking)
    needs: build-ottod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download the test daemon
        uses: actions/download-artifact@v7.0.0
        with:
          name: ottod-debug
          path: target/debug

      - name: Make the test daemon executable
        run: chmod +x target/debug/ottod

      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        working-directory: ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium webkit

      # OTTO_E2E_GATE narrows the REAL desktop-browser / iphone-portrait
      # projects to ui/e2e/gate-specs.ts, so every spec's project guard
      # behaves exactly as in the advisory shards.
      - name: E2E smoke gate (gate specs on desktop-browser + iphone-portrait)
        working-directory: ui
        env:
          OTTO_E2E_BIN: ${{ github.workspace }}/target/debug/ottod
          OTTO_E2E_FUNCTIONAL_ONLY: '1'
          OTTO_E2E_GATE: '1'
        run: npx playwright test --project=desktop-browser --project=iphone-portrait --retries=0

      # Fails on flaky, on ANY skipped test, and on fewer passes than
      # GATE_MIN_EXPECTED — a self-skipping gate spec can't pass vacuously.
      - name: Fail on flaky / skipped / missing gate tests
        if: success() || failure()
        working-directory: ui
        env:
          OTTO_E2E_SUMMARY_LABEL: E2E smoke gate
        run: node scripts/e2e-flaky-check.mjs --gate --summary

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-gate-report
          path: |
            ui/e2e/.report-0
            ui/test-results
          retention-days: 7

  # ADVISORY functional E2E: every desktop-* spec on the desktop-browser
  # project (Chromium, 1280×800 3-pane shell) plus the mobile specs at iPhone
  # portrait (WebKit), sharded across 4 runners. Isolated throwaway daemon per
  # shard (ui/e2e/global-setup.ts: temp data dir, own port, file secret store,
  # fake agent CLIs). Perf specs are skipped here (OTTO_E2E_FUNCTIONAL_ONLY) —
  # they run in perf-gates. Retries are 0 and any `flaky` count fails the
  # shard, so a red shard is an honest result — but the suite is too slow to
  # gate merges, so it never fails the workflow (continue-on-error) and no
  # job `needs:` it. Keep it out of the branch's required status checks; the
  # blocking subset is `e2e-gate` above (promote a spec into it through
  # ui/e2e/gate-specs.ts once it shows a green history here).
  # The other mobile/tablet projects run nightly (e2e-nightly.yml).
  e2e-functional:
    name: E2E functional (shard ${{ matrix.shard }}/4, advisory)
    needs: build-ottod
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1

      # The DB Explorer / Connections / Brokers specs drive the seeded dev
      # stacks (dev/dbviewer: MySQL, Postgres, Mongo, ClickHouse, Redis;
      # dev/brokers: Redpanda) — the same compose files as db-drivers.yml.
      # Started on EVERY shard: Playwright shards by test, so which shard gets
      # a DB spec moves with the suite. Started first and detached, so the
      # images pull and seed while the steps below install; the health wait
      # right before Playwright usually finds them ready.
      - name: Start the seeded DB stack + Redpanda
        run: |
          docker compose -f dev/dbviewer/docker-compose.yml up -d
          docker compose -f dev/brokers/docker-compose.yml up -d

      # redis-server: the Connections/DB/ops specs spawn their own throwaway
      # Redis. ffmpeg: generates the synthetic tour film below.
      - name: Install redis-server + ffmpeg
        run: |
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update || echo "::warning::apt-get update failed for some sources; installing from what refreshed"
          sudo apt-get install -y --no-install-recommends redis-server ffmpeg
          # The specs start their own instances; the distro service would
          # only hold :6379.
          sudo systemctl disable --now redis-server || true
          redis-server --version

      # The usage + telemetry specs need the daemon's embedded ClickHouse
      # (the daemon resolves `clickhouse` on PATH / ~/.local/bin). Same pin
      # as the Rust job (workflow env).
      - name: Install ClickHouse (usage engine)
        run: |
          archive="$RUNNER_TEMP/clickhouse.tgz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ClickHouse/ClickHouse/releases/download/v$CLICKHOUSE_VERSION-lts/clickhouse-common-static-$CLICKHOUSE_VERSION-amd64.tgz" \
            --output "$archive"
          printf '%s  %s\n' "$CLICKHOUSE_SHA512" "$archive" | sha512sum --check
          mkdir -p "$RUNNER_TEMP/ch"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ch"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$(find "$RUNNER_TEMP/ch" -type f -name clickhouse -path '*/bin/*' | head -n 1)" "$HOME/.local/bin/clickhouse"
          rm -rf "$RUNNER_TEMP/ch" "$archive"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/clickhouse" local --version

      # The Help tour playback specs (desktop-ux{,-r2,-r3,-r4}-help) need a
      # real MP4 at OTTO_E2E_TOUR_VIDEO. The published film is not in the
      # repo, so synthesize one as long as the film (film.json `duration`, so
      # every chapter is seekable), with an audio track (the r1 spec asserts
      # decoded audio). VP9 + Opus: Playwright's Chromium has no H.264/AAC.
      - name: Generate the synthetic tour film
        run: |
          duration=$(node -p "Math.ceil(require('./ui/src/lib/walkthroughs/film.json').duration) + 1")
          out="$RUNNER_TEMP/otto-tour.mp4"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc=size=320x180:rate=10:duration=$duration" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=$duration" \
            -c:v libvpx-vp9 -b:v 40k -deadline realtime -cpu-used 8 -g 10 \
            -c:a libopus -b:a 24k -shortest -movflags +faststart "$out"
          ls -l "$out"
          echo "OTTO_E2E_TOUR_VIDEO=$out" >> "$GITHUB_ENV"

      - name: Download the test daemon
        uses: actions/download-artifact@v7.0.0
        with:
          name: ottod-debug
          path: target/debug

      # Artifacts drop the executable bit.
      - name: Make the test daemon executable
        run: chmod +x target/debug/ottod

      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        working-directory: ui
        run: npm ci

      # desktop-browser = Chromium; iphone-portrait = WebKit (device default).
      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium webkit

      # Same wait as db-drivers.yml: every service has a compose healthcheck
      # (seeds run before it reports healthy); redis-seed is a one-shot.
      - name: Wait for healthy servers
        run: |
          for _ in $(seq 1 60); do
            unhealthy=$(docker ps --filter name=otto- --format '{{.Names}} {{.Status}}' \
              | grep -v 'redis-seed' | grep -vc '(healthy)' || true)
            [ "$unhealthy" = "0" ] && break
            sleep 5
          done
          docker ps --format '{{.Names}}  {{.Status}}'
          if [ "$unhealthy" != "0" ]; then
            echo "::error::DB/Kafka stack never became healthy"
            docker compose -f dev/dbviewer/docker-compose.yml logs --tail 80
            docker compose -f dev/brokers/docker-compose.yml logs --tail 80
            exit 1
          fi

      - name: E2E (desktop-browser + iphone-portrait)
        working-directory: ui
        env:
          OTTO_E2E_BIN: ${{ github.workspace }}/target/debug/ottod
          OTTO_E2E_FUNCTIONAL_ONLY: '1'
        run: >-
          npx playwright test
          --project=desktop-browser --project=iphone-portrait
          --shard=${{ matrix.shard }}/4 --retries=0

      # Writes this shard's pass/fail/skip counts (and failed test names) to
      # the step summary — the job itself is continue-on-error, so this is
      # where an advisory red shows up. e2e-advisory-ratchet sums the shards.
      - name: Fail on flaky tests
        if: success() || failure()
        working-directory: ui
        env:
          OTTO_E2E_SUMMARY_LABEL: E2E functional shard ${{ matrix.shard }}/4
        run: node scripts/e2e-flaky-check.mjs --summary

      - name: Upload the shard's JSON results
        if: success() || failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-functional-results-${{ matrix.shard }}
          path: ui/e2e/.results-0.json
          include-hidden-files: true
          retention-days: 7

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-functional-report-${{ matrix.shard }}
          path: |
            ui/e2e/.report-0
            ui/test-results
          retention-days: 7

      - name: Server logs
        if: failure()
        run: |
          docker compose -f dev/dbviewer/docker-compose.yml logs --tail 200
          docker compose -f dev/brokers/docker-compose.yml logs --tail 200

  # The advisory suite's RED COUNT ratchet (S12-304): sums the four shards'
  # failed tests and fails when it rises above ui/e2e/advisory-red-baseline.json
  # (lower the baseline in the PR that fixes failures; never raise it to land a
  # regression). Advisory like the shards (continue-on-error): it makes a
  # rising red count visible on the run page instead of a silent `success`.
  e2e-advisory-ratchet:
    name: E2E advisory red-count ratchet
    needs: e2e-functional
    if: always() && needs.e2e-functional.result != 'skipped'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download the shards' JSON results
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: e2e-functional-results-*
          path: shard-results

      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0

      - name: Red count vs baseline
        working-directory: ui
        run: |
          shopt -s globstar nullglob
          files=(../shard-results/**/.results-*.json)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::expected 4 shard reports, found ${#files[@]} — a shard never produced results"
            exit 1
          fi
          OTTO_E2E_SUMMARY_LABEL='E2E functional (all shards)' \
            node scripts/e2e-flaky-check.mjs --summary --ratchet "${files[@]}"

  # A SMALL, fast subset of the Playwright perf gates on WebKit — the engine
  # closest to the app's WKWebView — against an isolated debug daemon
  # (ui/e2e/global-setup.ts: temp data dir, own port, file secret store).
  # Chosen for stability: bounded-DOM counts (git sidebar, file viewer,
  # insights, Kafka/K8s lists, a 100k-row grid) plus the grid's scroll/paint
  # timings, the terminal flood/^C and park-redraw budgets, and the daemon's
  # terminal emulator budgets (otto-pty, gated by OTTO_PERF), which run with
  # OTTO_PERF_BUDGET_SCALE=3 (budgets were measured on a Mac; counts are never scaled). The full perf set runs locally with
  # `npx playwright test --project=desktop-webkit` (docs/testing/ci-performance.md).
  # Advisory until it has a green history: this is the first job to run the
  # daemon + Playwright WebKit on the Linux runner.
  perf-gates:
    name: Perf gates (WebKit subset, advisory)
    needs: build-ottod
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download the test daemon
        uses: actions/download-artifact@v7.0.0
        with:
          name: ottod-debug
          path: target/debug

      - name: Make the test daemon executable
        run: chmod +x target/debug/ottod

      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        working-directory: ui
        run: npm ci

      - name: Install Playwright WebKit
        working-directory: ui
        run: npx playwright install --with-deps webkit

      - name: Perf gates (desktop-webkit)
        working-directory: ui
        env:
          OTTO_E2E_BIN: ${{ github.workspace }}/target/debug/ottod
          OTTO_PERF_BUDGET_SCALE: '3'
        run: >-
          npx playwright test --project=desktop-webkit --workers=1
          e2e/desktop-git-sidebar-perf.spec.ts
          e2e/desktop-docs-orch-perf.spec.ts
          e2e/desktop-infra-perf.spec.ts
          e2e/desktop-db-results-perf.spec.ts
          e2e/desktop-nav-smooth-perf.spec.ts
          e2e/desktop-boot-perf.spec.ts
          e2e/desktop-terminal-flood-perf.spec.ts
          e2e/desktop-terminal-park-redraw.spec.ts
          e2e/desktop-terminal-compact-queue-perf.spec.ts
          e2e/desktop-agents-scale-perf.spec.ts

      # DB Explorer at scale: the deterministic `@ci` subset of the scale spec
      # (wide 20k × 300 grid, column filter over 100k JSON rows, result memory
      # budget release + Re-run). The other scenarios run locally.
      # Runs even when the subset above failed: the two are independent, and
      # skipping this one left DB-at-scale with no result at all.
      - name: Perf gates — DB at scale (desktop-webkit, @ci)
        if: success() || failure()
        working-directory: ui
        env:
          OTTO_E2E_BIN: ${{ github.workspace }}/target/debug/ottod
          OTTO_PERF_BUDGET_SCALE: '3'
        run: >-
          npx playwright test --project=desktop-webkit --workers=1
          e2e/desktop-db-scale-perf.spec.ts --grep @ci

      - name: Fail on flaky tests
        if: success() || failure()
        working-directory: ui
        run: node scripts/e2e-flaky-check.mjs

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: perf-gates-report
          path: ui/e2e/.report-0
          retention-days: 7

  # Daemon budgets (perf/03 F8, perf2/03 N4): an isolated throwaway daemon on
  # a SEEDED, fragmented otto.db (boot runs the offline compaction), then
  # boot phases, idle CPU/wakeups, threads, WAL size and freelist share.
  # BLOCKING for the deterministic metrics (threads, wal_bytes, free_pct, the
  # compaction outcome); time/CPU on a shared runner are reported in the step
  # summary only. macOS + ClickHouse: .github/workflows/perf-nightly.yml.
  daemon-budget:
    name: Daemon perf budget
    needs: build-ottod
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download the test daemon
        uses: actions/download-artifact@v7.0.0
        with:
          name: ottod-debug
          path: target/debug

      - name: Make the test daemon executable
        run: chmod +x target/debug/ottod

      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0

      - name: Daemon perf budget
        env:
          OTTO_PERF_BUDGET_SCALE: '3'
        run: node scripts/perf/daemon-budget.mjs target/debug/ottod

  audit:
    name: cargo audit (advisory)
    runs-on: ubuntu-latest
    # Advisory-only: a new RustSec advisory in the dependency tree should warn,
    # not block a PR. Promote to blocking once the tree is triaged.
    continue-on-error: true
    env:
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache only the pinned executable, never audit results or the advisory
      # database. Every run still fetches current RustSec advisories below.
      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/otto-tools/cargo-audit/${{ env.CARGO_AUDIT_VERSION }}/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}-v1

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --root "$HOME/.cache/otto-tools/cargo-audit/$CARGO_AUDIT_VERSION"

      - name: Verify cargo-audit version
        run: |
          audit_bin="$HOME/.cache/otto-tools/cargo-audit/$CARGO_AUDIT_VERSION/bin"
          test "$("$audit_bin/cargo-audit" --version)" = "cargo-audit $CARGO_AUDIT_VERSION"
          echo "$audit_bin" >> "$GITHUB_PATH"

      # Save after installation, before scanning: a newly reported advisory
      # must not force the next run to compile the unchanged audit tool again.
      - name: Save cargo-audit cache
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/otto-tools/cargo-audit/${{ env.CARGO_AUDIT_VERSION }}/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}-v1

      - name: cargo audit
        # RUSTSEC-2023-0071 (rsa "Marvin Attack" timing sidechannel) has NO fixed
        # upgrade available and reaches us only transitively via sqlx-mysql's
        # caching_sha2_password auth (the DB Explorer's `mysql-rsa` feature).
        # That path only ENCRYPTS the password to the server's public key; the
        # attack recovers plaintext from a party performing RSA DECRYPTION,
        # which Otto never does. Ignore until sqlx-mysql swaps its RSA backend.
        run: cargo audit --ignore RUSTSEC-2023-0071

  # Duplicate-version gate (deny.toml: multiple-versions = "deny" + a `skip`
  # list of today's known duplicates). BLOCKING: a PR that adds a second
  # semver-incompatible copy of a crate fails here — align the pin or, if an
  # upstream forces it, add a skip with the reason. Licenses/advisories are
  # not gated here (see the audit job).
  deny:
    name: cargo deny (duplicates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: cargo deny check bans
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check bans

  # Bug-fix commits that touch the UI should carry a test (ui/unit or ui/e2e).
  # Non-blocking: prints a ::warning:: per offending commit in the PR range.
  fix-has-test:
    name: UI fix carries a test (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check 🐛 fix( commits touching ui/src
        run: scripts/check-fix-has-test.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
