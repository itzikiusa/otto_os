name: Weekly DMG

# Build the macOS desktop app (Apple Silicon) and publish the .dmg to a ROLLING
# GitHub Release tagged `weekly`, every Sunday morning — so the latest build is
# always at a stable URL:
#
#   https://github.com/<owner>/<repo>/releases/download/weekly/Otto-macos-arm64.dmg
#
# "Updating" = download the same URL again and drag to /Applications (the app
# self-deploys its bundled ottod daemon on launch). The build is ad-hoc signed
# unless Apple Developer ID secrets are configured (see the Sign note below),
# so first launch needs right-click → Open, or:
#   xattr -cr /Applications/Otto.app
#
# Also runnable on demand via workflow_dispatch.

on:
  schedule:
    # Sundays 05:00 UTC (07:00/08:00 Israel time).
    - cron: '0 5 * * 0'
  workflow_dispatch:

# The release job must create/update the `weekly` tag + release assets.
permissions:
  contents: write

concurrency:
  group: release-dmg
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: the DMG is only built from a commit whose CI (lint/type-check/test)
  # workflow SUCCEEDED. A schedule/dispatch can fire while CI for the head
  # commit is still running (or after it failed) — wait for it, and fail this
  # run instead of shipping an unverified build.
  ci-gate:
    name: Wait for CI on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Require a successful CI run for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml \
              --commit "$GITHUB_SHA" --json status,conclusion \
              -q '.[0] | .status + " " + (.conclusion // "")' 2>/dev/null || true)
            echo "CI for $GITHUB_SHA: ${state:-no run found} (poll $i)"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "::error::CI concluded '${state#completed }' — not building the DMG"; exit 1 ;;
              "") if [ "$i" -ge 5 ]; then echo "::error::no CI run found for $GITHUB_SHA"; exit 1; fi ;;
            esac
            sleep 60
          done
          echo "::error::timed out waiting for CI on $GITHUB_SHA"
          exit 1

  dmg:
    name: Build + publish Otto.dmg (arm64)
    needs: ci-gate
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # The desktop shell is a SEPARATE cargo workspace with its own target
          # dir — cache both.
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> apps/desktop/src-tauri/target

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # otto-brokers compiles librdkafka from source via CMake (preinstalled on
      # macOS runners, but don't rely on the image).
      - name: Ensure cmake
        run: command -v cmake || brew install cmake

      # Weekly build version: YYYY.MM.DD-{buildnum} (buildnum = the workflow's
      # monotonically-increasing run number). Tauri validates the bundle version
      # as SEMVER, which forbids leading zeros — so the app itself is stamped
      # with the unpadded equivalent (2026.9.7-3) while the release name and
      # asset filenames carry the padded display form (2026.09.07-3).
      - name: Compute build version
        id: ver
        run: |
          display="$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          semver="$(date -u +%Y.%m.%d | sed -E 's/\.0([0-9])/.\1/g')-${GITHUB_RUN_NUMBER}"
          echo "display=$display" >> "$GITHUB_OUTPUT"
          echo "semver=$semver"   >> "$GITHUB_OUTPUT"
          echo "version: $display (bundle: $semver)"

      - name: Stamp version into the bundle
        run: |
          conf=apps/desktop/src-tauri/tauri.conf.json
          jq --arg v "${{ steps.ver.outputs.semver }}" '.version = $v' "$conf" > "$conf.tmp"
          mv "$conf.tmp" "$conf"
          jq -r .version "$conf"

      # 1. Frontend → ui/dist (must precede the daemon build: `embed-ui` bakes
      #    ui/dist into the binary at compile time via rust-embed).
      - name: Build UI
        run: cd ui && npm ci && npm run build

      # 2. Daemon (release, embed-ui — same as packaging/deploy.sh) → sidecar.
      - name: Build ottod (release, embed-ui)
        run: cargo build --release -p ottod --features embed-ui

      - name: Stage sidecar (target-triple name)
        run: |
          triple=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/ottod "apps/desktop/src-tauri/binaries/ottod-${triple}"

      # 3. Desktop app + DMG (the `app` and `dmg` targets from tauri.conf.json).
      #
      # Sign note: without secrets Tauri ad-hoc signs — installable after
      # right-click → Open (or `xattr -cr`). To ship a Gatekeeper-clean,
      # notarized build later, add repo secrets and the bundle is signed
      # automatically: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY, and for notarization APPLE_ID, APPLE_PASSWORD
      # (app-specific), APPLE_TEAM_ID.
      # Export the Apple signing env vars ONLY when the secrets actually exist:
      # a set-but-EMPTY APPLE_CERTIFICATE makes Tauri attempt `security import`
      # with no data and the bundle step dies ("SecKeychainItemImport: … not
      # valid"). Absent vars = ad-hoc signing, which is what we want until the
      # Developer ID secrets are configured.
      - name: Export Apple signing env (when secrets configured)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            val="${!v}"
            if [ -n "$val" ]; then
              {
                echo "$v<<__OTTO_EOF__"
                echo "$val"
                echo "__OTTO_EOF__"
              } >> "$GITHUB_ENV"
              echo "exported $v"
            fi
          done

      - name: Build desktop app (Tauri)
        working-directory: apps/desktop/src-tauri
        run: npx --yes @tauri-apps/cli@^2 build

      # Two copies: a STABLE-named one (the download URL never changes week to
      # week) and a VERSIONED one (Otto-YYYY.MM.DD-{buildnum}-macos-arm64.dmg).
      - name: Collect artifacts
        id: collect
        run: |
          dmg=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          test -n "$dmg"
          cp "$dmg" Otto-macos-arm64.dmg
          cp "$dmg" "Otto-${{ steps.ver.outputs.display }}-macos-arm64.dmg"
          shasum -a 256 Otto-macos-arm64.dmg "Otto-${{ steps.ver.outputs.display }}-macos-arm64.dmg" | tee Otto-macos-arm64.dmg.sha256

      # The rolling release keeps ONE versioned dmg: drop last week's versioned
      # assets so they don't accumulate (the stable alias is replaced in place).
      - name: Prune previous versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view weekly --json assets -q '.assets[].name' 2>/dev/null \
            | grep -E '^Otto-[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+-macos-arm64\.dmg$' \
            | grep -v "^Otto-${{ steps.ver.outputs.display }}-macos-arm64.dmg$" \
            | while read -r a; do gh release delete-asset weekly "$a" -y; done || true

      # Keep a copy on the run itself too (survives even if the release upload
      # is edited away).
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otto-${{ steps.ver.outputs.display }}-macos-arm64-dmg
          path: |
            Otto-*macos-arm64.dmg
            Otto-macos-arm64.dmg.sha256
          retention-days: 30

      # Rolling release: same `weekly` tag every run, assets replaced in place.
      - name: Publish rolling `weekly` release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weekly
          name: Otto Weekly ${{ steps.ver.outputs.display }}
          prerelease: true
          body: |
            Automated weekly macOS build (Apple Silicon) — version **${{ steps.ver.outputs.display }}**, `${{ github.sha }}`.

            **Install / update:** download `Otto-macos-arm64.dmg` (always the newest build; the
            versioned copy `Otto-${{ steps.ver.outputs.display }}-macos-arm64.dmg` is identical),
            open it, drag **Otto** to `/Applications` (replace the existing app to update). The
            app deploys its bundled daemon on launch.

            This build is not notarized: on first launch use **right-click → Open**, or run
            `xattr -cr /Applications/Otto.app`.
          files: |
            Otto-macos-arm64.dmg
            Otto-${{ steps.ver.outputs.display }}-macos-arm64.dmg
            Otto-macos-arm64.dmg.sha256
