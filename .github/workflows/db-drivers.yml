name: DB & Kafka driver suites

# The live-server suites of the DB Explorer drivers (crates/otto-dbviewer/
# tests/{mysql,postgres,mongodb,clickhouse,redis}_e2e.rs) and the Message
# Brokers REST surface (crates/otto-brokers/tests/kafka_e2e.rs). They are
# #[ignore]d + env-gated in the everyday run because they need real servers;
# here the seeded dev stacks (dev/dbviewer, dev/brokers — the same compose
# files the suites document) provide them. Compose rather than `services:`
# because the seeds are mounted from the checkout, which `services:` start
# before.
#
# resource_access.rs's native-credential cases run against their own
# disposable MySQL + PostgreSQL fixture, seeded below (root/postgres and an
# `otto_reader` login, all with the fixture-only password; a readable `shop`
# with `orders(1, 42)` and an unreadable `hidden.secrets`). It is separate from
# dev/dbviewer so those seeds never grow fixture-only users or schemas.
#
# On PRs only when the drivers (or their seeds) change; nightly + on demand
# otherwise.

on:
  pull_request:
    paths:
      - 'crates/otto-dbviewer/**'
      - 'crates/otto-brokers/**'
      # Drivers reach their servers through these: SSH tunnels (otto-ssh),
      # the governed-query / connection rows (otto-state) and the shared
      # domain types (otto-core). A break there must not wait for nightly.
      - 'crates/otto-ssh/**'
      - 'crates/otto-state/**'
      - 'crates/otto-core/**'
      - 'crates/otto-netguard/**'
      - 'vendor/klickhouse/**'
      - 'dev/dbviewer/**'
      - 'dev/brokers/**'
      - 'Cargo.lock'
      - '.github/workflows/db-drivers.yml'
  push:
    branches: [main]
    paths:
      - 'crates/otto-dbviewer/**'
      - 'crates/otto-brokers/**'
      - 'crates/otto-ssh/**'
      - 'crates/otto-state/**'
      - 'crates/otto-core/**'
      - 'crates/otto-netguard/**'
      - 'vendor/klickhouse/**'
      - 'Cargo.lock'
      - 'dev/dbviewer/**'
      - 'dev/brokers/**'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-drivers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  drivers:
    name: DB + Kafka drivers (live servers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXTEST_VERSION: 0.9.150
    steps:
      - uses: actions/checkout@v7.0.1

      # Start the servers first: they seed while the workspace compiles.
      - name: Start the seeded DB stack + Redpanda
        run: |
          docker compose -f dev/dbviewer/docker-compose.yml up -d
          docker compose -f dev/brokers/docker-compose.yml up -d

      # The resource_access.rs fixture (see the header). Loopback-only ports,
      # fixture-only password; the init scripts run before the TCP listener
      # opens, so a reader query over TCP succeeding means the seed is done.
      - name: Start the resource-access fixture (MySQL + PostgreSQL)
        run: |
          fixture="$RUNNER_TEMP/resource-fixture"
          mkdir -p "$fixture/mysql" "$fixture/pg"
          cat > "$fixture/mysql/seed.sql" <<'SQL'
          CREATE DATABASE shop;
          CREATE TABLE shop.orders (id INT PRIMARY KEY, total INT NOT NULL);
          INSERT INTO shop.orders VALUES (1, 42);
          CREATE DATABASE hidden;
          CREATE TABLE hidden.secrets (id INT PRIMARY KEY, secret VARCHAR(64));
          INSERT INTO hidden.secrets VALUES (1, 'fixture-only');
          CREATE USER 'otto_reader'@'%' IDENTIFIED BY 'otto_fixture_only';
          -- SHOW VIEW: native_access refuses a query credential that can't
          -- inspect definer-view privileges.
          GRANT SELECT, SHOW VIEW ON shop.* TO 'otto_reader'@'%';
          SQL
          cat > "$fixture/pg/seed.sql" <<'SQL'
          CREATE SCHEMA shop;
          CREATE TABLE shop.orders (id INT PRIMARY KEY, total INT NOT NULL);
          INSERT INTO shop.orders VALUES (1, 42);
          CREATE SCHEMA hidden;
          CREATE TABLE hidden.secrets (id INT PRIMARY KEY, secret TEXT);
          INSERT INTO hidden.secrets VALUES (1, 'fixture-only');
          CREATE ROLE otto_reader LOGIN PASSWORD 'otto_fixture_only';
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          -- PUBLIC holds TEMP on every new database by default, and the
          -- postgres driver refuses a native role with TEMP or CREATE authority.
          REVOKE CREATE, TEMPORARY ON DATABASE resourcefixture FROM PUBLIC;
          GRANT USAGE ON SCHEMA shop TO otto_reader;
          GRANT SELECT ON shop.orders TO otto_reader;
          SQL
          docker run -d --name rafix-mysql -p 127.0.0.1:23306:3306 \
            -e MYSQL_ROOT_PASSWORD=otto_fixture_only \
            -v "$fixture/mysql:/docker-entrypoint-initdb.d:ro" mysql:9.7
          docker run -d --name rafix-pg -p 127.0.0.1:25432:5432 \
            -e POSTGRES_PASSWORD=otto_fixture_only -e POSTGRES_DB=resourcefixture \
            -v "$fixture/pg:/docker-entrypoint-initdb.d:ro" postgres:17

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Enable fast lld linker
        run: |
          if command -v ld.lld >/dev/null 2>&1; then
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/ld
            sudo ln -sf "$(command -v ld.lld)" /usr/bin/x86_64-linux-gnu-ld
          fi

      - name: Cache cargo + driver targets
        id: cargo-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/.ci-source-hashes.json
          key: cargo-full-${{ runner.os }}-db-drivers-v1-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', '.cargo/config.toml') }}-${{ hashFiles('crates/otto-dbviewer/**', 'crates/otto-brokers/**', 'crates/otto-ssh/**', 'crates/otto-state/**', 'crates/otto-core/**', 'crates/otto-netguard/**', 'vendor/**') }}
          restore-keys: |
            cargo-full-${{ runner.os }}-db-drivers-v1-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', '.cargo/config.toml') }}-
            cargo-full-${{ runner.os }}-db-drivers-v1-

      - name: Restore cached source mtimes
        run: python3 scripts/ci-cargo-cache.py restore

      - name: Install librdkafka build deps
        run: |
          if ! compgen -G "target/debug/build/rdkafka-sys-*/out/lib/librdkafka.a" >/dev/null && ! dpkg -s cmake libcurl4-openssl-dev pkg-config libssl-dev >/dev/null 2>&1; then
            sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
            sudo python3 scripts/ci-apt-install.py cmake libcurl4-openssl-dev pkg-config libssl-dev
          fi

      - name: Install nextest
        run: |
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          tool_dir="$RUNNER_TEMP/otto-test-tools"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' 'b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f' "$archive" | sha256sum --check
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" cargo-nextest
          echo "$tool_dir" >> "$GITHUB_PATH"

      # Mongo shell fallback spawns a host binary; the server container's
      # mongosh is not on the test runner PATH. Pin the locally verified shell.
      - name: Install mongosh
        run: |
          archive="$RUNNER_TEMP/mongosh-2.5.9-linux-x64.tgz"
          tool_dir="$RUNNER_TEMP/otto-test-tools"
          curl --fail --location --silent --show-error --retry 3 \
            'https://downloads.mongodb.com/compass/mongosh-2.5.9-linux-x64.tgz' \
            --output "$archive"
          printf '%s  %s\n' '0644b6ac0b99dd52f46bdc4085aae19bb6d51226ef346c51418321769e76363e' "$archive" | sha256sum --check
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir"
          shell_dir="$tool_dir/mongosh-2.5.9-linux-x64/bin"
          echo "$shell_dir" >> "$GITHUB_PATH"
          "$shell_dir/mongosh" --version

      - name: Build the driver test binaries
        run: cargo nextest run -p otto-dbviewer -p otto-brokers --profile ci --no-run

      - name: Prepare cargo cache manifest
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: python3 scripts/ci-cargo-cache.py prepare-save

      # Every service has a compose healthcheck; the seed scripts run before
      # the server reports healthy. redis-seed is a one-shot that exits.
      - name: Wait for healthy servers
        run: |
          for _ in $(seq 1 60); do
            unhealthy=$(docker ps --filter name=otto- --format '{{.Names}} {{.Status}}' \
              | grep -v 'redis-seed' | grep -vc '(healthy)' || true)
            [ "$unhealthy" = "0" ] && break
            sleep 5
          done
          docker ps --format '{{.Names}}  {{.Status}}'
          for _ in $(seq 1 60); do
            docker exec rafix-mysql mysql -h127.0.0.1 -uotto_reader -potto_fixture_only \
              -e 'SELECT total FROM shop.orders' >/dev/null 2>&1 \
            && docker exec -e PGPASSWORD=otto_fixture_only rafix-pg psql -h 127.0.0.1 \
              -U otto_reader -d resourcefixture -c 'SELECT total FROM shop.orders' >/dev/null 2>&1 \
            && { fixture_ready=1; break; }
            sleep 5
          done
          if [ "${fixture_ready:-0}" != "1" ]; then
            echo "::error::resource-access fixture never became ready"
            docker logs --tail 80 rafix-mysql
            docker logs --tail 80 rafix-pg
            exit 1
          fi
          if [ "$unhealthy" != "0" ]; then
            echo "::error::DB/Kafka stack never became healthy"
            docker compose -f dev/dbviewer/docker-compose.yml logs --tail 80
            docker compose -f dev/brokers/docker-compose.yml logs --tail 80
            exit 1
          fi

      - name: Driver suites (ignored live-server tests)
        env:
          OTTO_DBV_E2E: '1'
          OTTO_DBV_PARITY: '1'
          OTTO_CLICKHOUSE_PARITY_HTTP_PORT: '18123'
          OTTO_CLICKHOUSE_PARITY_NATIVE_PORT: '19000'
          OTTO_REDIS_PARITY_PORT: '16379'
          OTTO_REDIS_PARITY_PASSWORD: 'ottoredis'
          OTTO_BROKERS_E2E: '1'
          OTTO_RESOURCE_MYSQL_PORT: '23306'
          OTTO_RESOURCE_PG_PORT: '25432'
        run: >-
          cargo nextest run -p otto-dbviewer -p otto-brokers --profile ci
          --run-ignored only --no-fail-fast

      - name: Server logs
        if: failure()
        run: |
          docker compose -f dev/dbviewer/docker-compose.yml logs --tail 200
          docker compose -f dev/brokers/docker-compose.yml logs --tail 200
          docker logs --tail 200 rafix-mysql || true
          docker logs --tail 200 rafix-pg || true
