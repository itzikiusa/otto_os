# cargo-deny policy (CI: `deny` job in .github/workflows/ci.yml, advisory).
#
# Scope today is DUPLICATE-VERSION visibility: two semver-incompatible copies
# of one crate (e.g. tokio-tungstenite via axum + our own pin) cost compile
# time and binary size. `warn` keeps the report non-blocking while the tree is
# triaged; RustSec advisories stay with the `audit` job (cargo-audit).

[graph]
all-features = false

[advisories]
# Owned by the cargo-audit job; don't double-report here.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
# Not gated yet — only the duplicate-version report is enforced.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "0BSD",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "warn"
unknown-git = "warn"
