# cargo-deny policy (CI: `deny` job in .github/workflows/ci.yml, blocking).
#
# Scope today is DUPLICATE-VERSION control: two semver-incompatible copies of
# one crate (e.g. tokio-tungstenite via axum + our own pin) cost compile time
# and binary size. New duplicates fail CI; known ones are listed in
# `bans.skip`. RustSec advisories stay with the `audit` job (cargo-audit).

[graph]
all-features = false
# Only the platforms Otto ships on / CI builds (S12-309): without this the
# graph included every cfg(windows)/UEFI dependency and 14 skips below were
# for windows-* crates that never compile for this product. `cargo tree
# --target <each>` shows no windows-* / r-efi crate in these graphs.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]

[advisories]
# Owned by the cargo-audit job; don't double-report here.
ignore = []

[bans]
# BLOCKING: a NEW duplicate (a second semver-incompatible copy of a crate)
# fails CI. The duplicates that exist today are listed in `skip` below (every
# older copy; the newest version is the one not listed), each waiting on an
# upstream crate to move. When an upstream catches up, delete its entry — an
# entry that no longer matches only warns. Prefer aligning a workspace pin to
# the ecosystem's version (as dirs 6 / tokio-tungstenite 0.29
# were) over adding a skip; syn 1/2 is an ecosystem transition and stays skipped.
#
# AHEAD-OF-ECOSYSTEM workspace pins (we pick the NEWER copy, the dep tree
# keeps the older): each costs a duplicate family until it is realigned —
#   sha2 0.11  vs sqlx-core's 0.10   (+ digest, block-buffer, crypto-common, cpufeatures)
#   rand 0.10  vs bson/mongodb/tungstenite's 0.9  (+ rand_core, getrandom)
#   tower-http 0.7 vs reqwest's 0.6
# Realigning (sha2 = "0.10", rand = "0.9", tower-http = "0.6") touches 18 / 2 / 1
# crates' code and needs a workspace build; it is tracked as S12-309 follow-up.
# base64 is a genuine split (reqwest/hyper-util/lettre/pem on 0.23, eight
# others on 0.22) — one copy stays either way.
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
skip = [
  { crate = "base64@0.22.1", reason = "reqwest/hyper-util/lettre/pem moved to 0.23 while 8 others stay on 0.22; a second copy either way" },
  { crate = "bitflags@1.3.2", reason = "ecosystem lag; newest is 2.13.2" },
  { crate = "block-buffer@0.10.4", reason = "ecosystem lag; newest is 0.12.1" },
  { crate = "cfg_aliases@0.1.1", reason = "ecosystem lag; newest is 0.2.2" },
  { crate = "core-foundation@0.9.4", reason = "ecosystem lag; newest is 0.10.1" },
  { crate = "cpufeatures@0.2.17", reason = "ecosystem lag; newest is 0.3.1" },
  { crate = "crypto-common@0.1.6", reason = "ecosystem lag; newest is 0.2.2" },
  { crate = "digest@0.10.7", reason = "ecosystem lag; newest is 0.11.3" },
  { crate = "getrandom@0.2.17", reason = "ecosystem lag; newest is 0.4.3" },
  { crate = "getrandom@0.3.4", reason = "ecosystem lag; newest is 0.4.3" },
  { crate = "hashbrown@0.14.5", reason = "ecosystem lag; newest is 0.17.1" },
  { crate = "hashbrown@0.16.1", reason = "ecosystem lag; newest is 0.17.1" },
  { crate = "heck@0.4.1", reason = "ecosystem lag; newest is 0.5.0" },
  { crate = "itertools@0.14.0", reason = "ecosystem lag; newest is 0.15.0" },
  { crate = "logos@0.15.1", reason = "ecosystem lag; newest is 0.16.1" },
  { crate = "logos-codegen@0.15.1", reason = "ecosystem lag; newest is 0.16.1" },
  { crate = "logos-derive@0.15.1", reason = "ecosystem lag; newest is 0.16.1" },
  { crate = "nix@0.28.0", reason = "ecosystem lag; newest is 0.30.1" },
  { crate = "nom@7.1.3", reason = "ecosystem lag; newest is 8.0.0" },
  { crate = "num-bigint@0.4.8", reason = "ecosystem lag; newest is 0.5.1" },
  { crate = "phf@0.12.1", reason = "ecosystem lag; newest is 0.14.0" },
  { crate = "phf@0.13.1", reason = "ecosystem lag; newest is 0.14.0" },
  { crate = "phf_generator@0.13.1", reason = "ecosystem lag; newest is 0.14.0" },
  { crate = "phf_macros@0.13.1", reason = "ecosystem lag; newest is 0.14.0" },
  { crate = "phf_shared@0.12.1", reason = "ecosystem lag; newest is 0.14.0" },
  { crate = "phf_shared@0.13.1", reason = "ecosystem lag; newest is 0.14.0" },
  { crate = "rand@0.9.5", reason = "ecosystem lag; newest is 0.10.3" },
  { crate = "rand_core@0.9.5", reason = "ecosystem lag; newest is 0.10.1" },
  { crate = "sha1@0.10.7", reason = "ecosystem lag; newest is 0.11.0" },
  { crate = "sha2@0.10.9", reason = "ecosystem lag; newest is 0.11.0" },
  { crate = "syn@2.0.119", reason = "ecosystem lag; newest is 3.0.6" },
  { crate = "synstructure@0.13.2", reason = "ecosystem lag; newest is 0.14.0" },
  { crate = "thiserror@1.0.69", reason = "ecosystem lag; newest is 2.0.21" },
  { crate = "thiserror-impl@1.0.69", reason = "ecosystem lag; newest is 2.0.21" },
  { crate = "tower-http@0.6.11", reason = "ecosystem lag; newest is 0.7.1" },
  { crate = "unicode-width@0.1.14", reason = "ecosystem lag; newest is 0.2.2" },
  { crate = "webpki-roots@0.26.11", reason = "ecosystem lag; newest is 1.0.9" },
]

[licenses]
# Not gated yet — only the duplicate-version report is enforced.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "0BSD",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "warn"
unknown-git = "warn"
