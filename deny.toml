  { crate = "getrandom@0.2.17", reason = "ecosystem lag; newest is 0.4.3" },
  { crate = "getrandom@0.3.4", reason = "ecosystem lag; newest is 0.4.3" },
  { crate = "hashbrown@0.14.5", reason = "ecosystem lag; newest is 0.17.1" },
  { crate = "hashbrown@0.16.1", reason = "ecosystem lag; newest is 0.17.1" },
