[workspace]
resolver = "2"
members = [
    "crates/otto-core",
    "crates/otto-state",
    "crates/otto-rbac",
    "crates/otto-keychain",
    "crates/otto-pty",
    "crates/otto-sessions",
    "crates/otto-connections",
    "crates/otto-aws",
    "crates/otto-k8s",
    "crates/otto-dbviewer",
    "crates/otto-orchestrator",
    "crates/otto-git",
    "crates/otto-issues",
    "crates/otto-channels",
    "crates/otto-improve",
    "crates/otto-context",
    "crates/otto-usage",
    "crates/otto-server",
    "crates/ottod",
    "crates/otto-product",
    "crates/otto-skills",
    "crates/otto-swarm",
    "crates/otto-memory",
    "crates/otto-vault",
    "crates/otto-brokers",
    "crates/otto-netguard",
    "crates/otto-ssh",
    "crates/otto-canvas",
    "crates/otto-design",
    "crates/otto-workgraph",
    "crates/otto-mcp",
    "crates/otto-sandbox",
    "crates/otto-browser",
    "crates/otto-transcript",
]
# Custom plugins are out-of-process sidecars installed at RUNTIME under
# ~/otto-plugins (not workspace members, not compiled into the app). See
# docs/superpowers/specs/2026-06-21-runtime-plugins-design.md.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
otto-core = { path = "crates/otto-core" }
otto-state = { path = "crates/otto-state" }
otto-rbac = { path = "crates/otto-rbac" }
otto-keychain = { path = "crates/otto-keychain" }
otto-pty = { path = "crates/otto-pty" }
otto-sessions = { path = "crates/otto-sessions" }
otto-connections = { path = "crates/otto-connections" }
otto-aws = { path = "crates/otto-aws" }
otto-k8s = { path = "crates/otto-k8s" }
otto-dbviewer = { path = "crates/otto-dbviewer" }
otto-orchestrator = { path = "crates/otto-orchestrator" }
otto-git = { path = "crates/otto-git" }
otto-issues = { path = "crates/otto-issues" }
otto-channels = { path = "crates/otto-channels" }
otto-improve = { path = "crates/otto-improve" }
otto-context = { path = "crates/otto-context" }
otto-skills = { path = "crates/otto-skills" }
otto-usage = { path = "crates/otto-usage" }
otto-server = { path = "crates/otto-server" }
otto-product = { path = "crates/otto-product" }
otto-swarm = { path = "crates/otto-swarm" }
otto-memory = { path = "crates/otto-memory" }
otto-vault = { path = "crates/otto-vault" }
otto-brokers = { path = "crates/otto-brokers" }
otto-netguard = { path = "crates/otto-netguard" }
otto-ssh = { path = "crates/otto-ssh" }
otto-canvas = { path = "crates/otto-canvas" }
otto-design = { path = "crates/otto-design" }
otto-workgraph = { path = "crates/otto-workgraph" }
otto-mcp = { path = "crates/otto-mcp" }
otto-sandbox = { path = "crates/otto-sandbox" }
otto-browser = { path = "crates/otto-browser" }
otto-transcript = { path = "crates/otto-transcript" }

# Tree-sitter repo map (otto-context). A coherent grammar set pinned to one
# tree-sitter ABI; `ignore` walks the repo honoring .gitignore.
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
ignore = "0.4.33"

tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
ulid = "3.0.0"
uuid = { version = "1.27.0", features = ["v4"] }
argon2 = "0.6.0"
sha2 = "0.11.0"
# YAML frontmatter (Vault v3 / OKF). Already in the lockfile via otto-swarm.
serde_yaml = "0.9.34"
rand = "0.10.3"
hex = "0.4.3"
base64 = "0.23.1"
keyring = "4.2.0"
portable-pty = "0.9.0"
bytes = "1.12.1"
dashmap = "6.2.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "multipart", "stream", "cookies", "socks", "query", "form"] }
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
mime_guess = "2.0.5"
rustix = { version = "1.1.5", features = ["fs"] }
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tempfile = "3.27.0"
shell-words = "1.1.1"
vt100 = "0.16.2"
dirs = "7.0.0"
protox = "0.9.1"
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14.4"
tonic = { version = "0.14.6", features = ["tls-ring", "tls-webpki-roots"] }
reqwest_cookie_store = "0.10.0"
# Message Brokers (Kafka) — librdkafka statically built (cmake) with vendored
# OpenSSL so SASL_SSL works on machines without a system librdkafka/OpenSSL.
rdkafka = { version = "0.39.0", default-features = false, features = ["cmake-build", "ssl-vendored", "libz", "zstd", "tokio"] }
apache-avro = "0.22.0"

# Build speed over the last few % of runtime/binary size: this app is built +
# deployed locally many times a day, and thin-LTO's cross-module phase capped
# the final ottod compile at ~2-3 cores (observed 5+ min alone). No LTO keeps
# all 16 codegen units compiling in parallel. NOTE: changing this profile
# invalidates the whole release cache — the FIRST deploy after this commit
# rebuilds everything (slower once), subsequent ones are faster.
[profile.release]
lto = false
strip = true

# Vendored vt100 fork: top-anchored scroll regions feed scrollback so codex
# (ratatui insert_before) transcript history survives reattach snapshots.
# See vendor/vt100/README-OTTO.md for the single patched conditional.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
