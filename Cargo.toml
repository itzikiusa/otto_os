[workspace]
resolver = "2"
members = [
    "crates/otto-core",
    "crates/otto-assistant",
    "crates/otto-state",
    "crates/otto-rbac",
    "crates/otto-keychain",
    "crates/otto-pty",
    "crates/otto-sessions",
    "crates/otto-connections",
    "crates/otto-automation",
    "crates/otto-aws",
    "crates/otto-k8s",
    "crates/otto-dbviewer",
    "crates/otto-apiclient",
    "crates/otto-orchestrator",
    "crates/otto-git",
    "crates/otto-git-cmd",
    "crates/otto-issues",
    "crates/otto-channels",
    "crates/otto-improve",
    "crates/otto-insights",
    "crates/otto-context",
    "crates/otto-usage",
    "crates/otto-telemetry",
    "crates/otto-telemetry-collector",
    "crates/otto-server",
    "crates/ottod",
    "crates/otto-product",
    "crates/otto-skills",
    "crates/otto-memory",
    "crates/otto-vault",
    "crates/otto-brokers",
    "crates/otto-netguard",
    "crates/otto-ssh",
    "crates/otto-canvas",
    "crates/otto-design",
    "crates/otto-design-assist",
    "crates/otto-mcp",
    "crates/otto-sandbox",
    "crates/otto-browser",
    "crates/otto-transcript",
    "crates/otto-workflows",
    "crates/otto-agent-run",
    "crates/otto-review",
    "crates/otto-rooms",
]
# Custom plugins are out-of-process sidecars installed at RUNTIME under
# ~/otto-plugins (not workspace members, not compiled into the app). See
# docs/superpowers/specs/2026-06-21-runtime-plugins-design.md.

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
otto-core = { path = "crates/otto-core" }
otto-state = { path = "crates/otto-state" }
otto-rbac = { path = "crates/otto-rbac" }
otto-automation = { path = "crates/otto-automation" }
otto-keychain = { path = "crates/otto-keychain" }
otto-pty = { path = "crates/otto-pty" }
otto-sessions = { path = "crates/otto-sessions" }
otto-connections = { path = "crates/otto-connections" }
otto-aws = { path = "crates/otto-aws" }
otto-k8s = { path = "crates/otto-k8s" }
otto-dbviewer = { path = "crates/otto-dbviewer" }
otto-apiclient = { path = "crates/otto-apiclient" }
otto-orchestrator = { path = "crates/otto-orchestrator" }
otto-git = { path = "crates/otto-git" }
otto-git-cmd = { path = "crates/otto-git-cmd" }
otto-issues = { path = "crates/otto-issues" }
otto-channels = { path = "crates/otto-channels" }
otto-improve = { path = "crates/otto-improve" }
otto-insights = { path = "crates/otto-insights" }
otto-context = { path = "crates/otto-context" }
otto-skills = { path = "crates/otto-skills" }
otto-usage = { path = "crates/otto-usage" }
otto-telemetry = { path = "crates/otto-telemetry" }
otto-telemetry-collector = { path = "crates/otto-telemetry-collector" }
otto-agent-run = { path = "crates/otto-agent-run" }
otto-review = { path = "crates/otto-review" }
otto-server = { path = "crates/otto-server" }
otto-product = { path = "crates/otto-product" }
otto-memory = { path = "crates/otto-memory" }
otto-assistant = { path = "crates/otto-assistant" }
otto-vault = { path = "crates/otto-vault" }
otto-brokers = { path = "crates/otto-brokers" }
otto-netguard = { path = "crates/otto-netguard" }
otto-ssh = { path = "crates/otto-ssh" }
otto-canvas = { path = "crates/otto-canvas" }
otto-design = { path = "crates/otto-design" }
otto-design-assist = { path = "crates/otto-design-assist" }
otto-mcp = { path = "crates/otto-mcp" }
otto-sandbox = { path = "crates/otto-sandbox" }
otto-browser = { path = "crates/otto-browser" }
otto-transcript = { path = "crates/otto-transcript" }
otto-workflows = { path = "crates/otto-workflows" }
otto-rooms = { path = "crates/otto-rooms" }

# Tree-sitter repo map (otto-context). A coherent grammar set pinned to one
# tree-sitter ABI; `ignore` walks the repo honoring .gitignore.
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
ignore = "0.4.34"

tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
ulid = "3.0.0"
uuid = { version = "1.29.0", features = ["v4"] }
argon2 = "0.6.0"
sha2 = "0.11.1"
# YAML frontmatter (Vault v3 / OKF). Already in the lockfile via otto-swarm.
serde_yaml = "0.9.34"
rand = "0.10.3"
hex = "0.4.3"
base64 = "0.23.1"
keyring = "4.2.0"
# AES-256-GCM for the encrypted secrets file (otto-keychain). Already in the
# lockfile via rustls; reused instead of adding a second AEAD crate.
ring = "0.17.14"
portable-pty = "0.9.0"
bytes = "1.12.1"
dashmap = "6.2.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "multipart", "stream", "cookies", "socks", "query", "form"] }
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
mime_guess = "2.0.5"
rustix = { version = "1.1.6", features = ["fs"] }
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tempfile = "3.27.0"
shell-words = "1.1.1"
vt100 = "0.18.1"
dirs = "6.0.0"
protox = "0.10.0"
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14.4"
# `tls-native-roots`: gRPC trusts the OS store (corporate / internal CAs) like
# reqwest's platform verifier does for REST, with the bundled Mozilla roots on top.
tonic = { version = "0.14.9", features = ["tls-ring", "tls-native-roots", "tls-webpki-roots"] }
reqwest_cookie_store = "0.10.0"
# Message Brokers (Kafka) — librdkafka statically built (cmake); macOS enables
# `ssl-vendored` in crates/otto-brokers/Cargo.toml so the standalone .dmg needs
# no system OpenSSL, while Linux links the runner's libssl-dev instead of
# compiling OpenSSL 3.x from source.
rdkafka = { version = "0.39.0", default-features = false, features = ["cmake-build", "ssl", "libz", "zstd", "tokio"] }
apache-avro = "0.22.0"

# No debug info anywhere in dev/test builds: nobody here runs a debugger, and
# on macOS debuginfo is kept in each crate's object files next to the binary
# (split-debuginfo "unpacked"), re-linked into every test binary — the bulk
# of a 30-40 GB workspace test build (it filled the disk, 2026-10-12). Panics
# and backtraces still name every function via the symbol table; only
# file:line is lost. `CARGO_PROFILE_DEV_DEBUG=true cargo …` brings it back
# for a one-off debugging session.
#
# Most external crates (~720: boa_engine, tonic, protox, mongodb, klickhouse,
# reqwest, icu_*, …) stay at opt-level 0 so uncached builds skip LLVM
# optimization passes; only the hot C/crypto/DB/async crates hammered by tests
# are optimized explicitly below.
[profile.dev.package."*"]
debug = false

[profile.dev.package.libsqlite3-sys]
opt-level = 2
[profile.dev.package.argon2]
opt-level = 2
[profile.dev.package.password-hash]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.sha1]
opt-level = 2
[profile.dev.package.ring]
opt-level = 2
[profile.dev.package.aws-lc-sys]
opt-level = 2
[profile.dev.package.aws-lc-rs]
opt-level = 2
[profile.dev.package.zstd-sys]
opt-level = 2
[profile.dev.package.libz-sys]
opt-level = 2
[profile.dev.package.sqlx-core]
opt-level = 1
[profile.dev.package.sqlx-sqlite]
opt-level = 1
[profile.dev.package.serde]
opt-level = 1
[profile.dev.package.serde_json]
opt-level = 1
[profile.dev.package.tokio]
opt-level = 1

[profile.dev]
debug = false

# Build speed over the last few % of runtime/binary size: this app is built +
# deployed locally many times a day, and thin-LTO's cross-module phase capped
# the final ottod compile at ~2-3 cores (observed 5+ min alone). No LTO keeps
# all 16 codegen units compiling in parallel. NOTE: changing this profile
# invalidates the whole release cache — the FIRST deploy after this commit
# rebuilds everything (slower once), subsequent ones are faster.
[profile.release]
lto = false
# Keep the symbol table (a few MB): ottod's panic hook force-captures a
# backtrace, and a fully stripped binary symbolizes every frame to a bare
# address — useless without the ASLR slide. DWARF debuginfo still goes.
strip = "debuginfo"

# Vendored vt100 fork (upstream 0.18.1): reflow-on-resize, full-width
# reflowable scrollback replay, compact shared scrollback rows + runtime cap.
# See vendor/vt100/README-OTTO.md for the patch list.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
# Preserve MySQL result metadata and authorize explicit LOCAL INFILE transfers.
sqlx-mysql = { path = "vendor/sqlx-mysql" }

# Permit native ClickHouse startup under server-enforced readonly=1 profiles.
klickhouse = { path = "vendor/klickhouse" }

# zstd 0.14: the zstd/zstd-safe 0.13/7.x RUSTSEC-2026-0391/0398/0403 fixes
# (and the unsound-API notices) exist only in zstd 0.14 / zstd-safe 8.2, and
# mongodb 3.9.1 (latest) still pins zstd 0.13. See vendor/mongodb/README-OTTO.md.
mongodb = { path = "vendor/mongodb" }
