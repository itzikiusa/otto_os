<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DORA Metrics</title>
    <style>
      /* Chart chrome follows the Otto theme (vars injected via otto:init);
         series + tier colors are a validated dataviz palette with separate
         light/dark steps, picked by the host theme's --bg luminance. */
      :root {
        --bg: #14161a; --text: #e6e6e6; --text-dim: #9aa0a6;
        --accent: #3e63dd; --border: #2a2d33;
        --s1: #3987e5; --s2: #199e70; --s3: #c98500;
        --tier-elite: #0ca30c; --tier-high: #fab219;
        --tier-medium: #ec835a; --tier-low: #d03b3b;
        --good: #0ca30c; --bad: #d03b3b;
      }
      :root[data-mode='light'] {
        --s1: #2a78d6; --s2: #1baf7a; --s3: #eda100;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font: 13px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
        color: var(--text); background: var(--bg); padding: 16px 20px 40px;
      }
      h1 { font-size: 18px; margin: 0 0 12px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      select, button, input {
        padding: 6px 10px; font-size: 13px; color: var(--text);
        background: transparent; border: 1px solid var(--border); border-radius: 6px;
      }
      button { cursor: pointer; }
      button.primary { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
      button:disabled { opacity: .5; cursor: default; }
      .err { color: var(--bad); padding: 4px 0; min-height: 1em; }
      .dim { color: var(--text-dim); }
      .loading { opacity: .5; pointer-events: none; }

      .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 12px 0; }
      .kpi-tile { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
      .kpi-tile .l { font-size: 12px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      .kpi-tile .v { font-size: 24px; font-weight: 650; margin: 2px 0; }
      .kpi-tile .v small { font-size: 13px; font-weight: 500; color: var(--text-dim); }
      .kpi-tile .delta { font-size: 11px; }
      .delta.up-good, .delta.down-good { color: var(--good); }
      .delta.up-bad, .delta.down-bad { color: var(--bad); }
      .tier-badge { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; border: 1px solid; }
      .tier-badge.elite  { color: var(--tier-elite);  border-color: color-mix(in srgb, var(--tier-elite) 55%, transparent);  background: color-mix(in srgb, var(--tier-elite) 14%, transparent); }
      .tier-badge.high   { color: var(--tier-high);   border-color: color-mix(in srgb, var(--tier-high) 55%, transparent);   background: color-mix(in srgb, var(--tier-high) 14%, transparent); }
      .tier-badge.medium { color: var(--tier-medium); border-color: color-mix(in srgb, var(--tier-medium) 55%, transparent); background: color-mix(in srgb, var(--tier-medium) 14%, transparent); }
      .tier-badge.low    { color: var(--tier-low);    border-color: color-mix(in srgb, var(--tier-low) 55%, transparent);    background: color-mix(in srgb, var(--tier-low) 14%, transparent); }
      .tier-badge.none   { color: var(--text-dim); border-color: var(--border); }

      .card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
      .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); margin: 0 0 8px; display: flex; align-items: center; justify-content: space-between; }
      .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
      .trend-chart svg { display: block; width: 100%; }
      .toggle-table { font-size: 10px; padding: 2px 8px; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
      th { color: var(--text-dim); font-weight: 600; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { padding: 3px 0; display: flex; gap: 6px; align-items: baseline; }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
      .k-feature { background: var(--s1); } .k-release { background: var(--s2); } .k-hotfix { background: var(--s3); }
      .suggestion { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
      .suggestion:last-child { border-bottom: 0; }
      .sev { flex: none; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; align-self: flex-start; margin-top: 2px; }
      .sev.critical { color: var(--tier-low); background: color-mix(in srgb, var(--tier-low) 14%, transparent); }
      .sev.warn { color: var(--tier-medium); background: color-mix(in srgb, var(--tier-medium) 14%, transparent); }
      .sev.info { color: var(--text-dim); background: color-mix(in srgb, var(--text-dim) 14%, transparent); }
      .suggestion b { display: block; font-size: 13px; }
      .suggestion .d { color: var(--text-dim); font-size: 12px; }
      #config-card { display: none; }
      #config-card.open { display: block; }
      #config-card label { display: inline-flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--text-dim); margin: 0 10px 8px 0; }
      #methodology { font-size: 11px; color: var(--text-dim); }
      #methodology table { max-width: 640px; }
      #tip { position: fixed; pointer-events: none; display: none; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 11px; z-index: 10; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
      .legend { display: flex; gap: 12px; font-size: 11px; color: var(--text-dim); margin-top: 4px; flex-wrap: wrap; }
      .legend span { display: inline-flex; align-items: center; gap: 5px; }
      .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
      pre { white-space: pre-wrap; margin: 0; font-size: 12px; }
      .spark { display: block; margin-top: 4px; }
    </style>
  </head>
  <body>
    <h1>DORA Metrics</h1>
    <div class="row">
      <select id="repo" aria-label="Repository"></select>
      <select id="days" aria-label="Window">
        <option value="14">14 days</option><option value="30" selected>30 days</option>
        <option value="90">90 days</option><option value="180">180 days</option>
      </select>
      <button class="primary" id="run">Refresh</button>
      <button id="analyze">AI analysis</button>
      <button id="gear" title="Signal settings" aria-label="Signal settings">⚙</button>
    </div>
    <div id="config-card" class="card">
      <h2>Signal settings</h2>
      <label>Deploy tag contains <input id="tag-pattern" size="12" /></label>
      <label>Feature prefixes <input id="pfx-feature" size="16" /></label>
      <label>Release prefixes <input id="pfx-release" size="16" /></label>
      <label>Hotfix prefixes <input id="pfx-hotfix" size="16" /></label>
      <label>Scan depth <input id="scan-depth" type="number" min="100" max="50000" step="100" style="width:90px" /></label>
      <div class="row" style="margin:4px 0 0">
        <button class="primary" id="save-config">Save</button>
        <span class="dim">A deploy = a git tag whose name contains the pattern (case-insensitive). Prefixes are comma-separated.</span>
      </div>
      <div id="cfg-err" class="err"></div>
    </div>
    <div id="err" class="err" role="alert"></div>
    <div id="out"></div>
    <div id="tip"></div>

    <script>
      'use strict';
      let API = '', TOKEN = '';
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const err = (m) => ($('err').textContent = m || '');

      // ---- theme ----------------------------------------------------------
      function applyTheme(t) {
        if (t) for (const [k, v] of Object.entries(t)) if (v) document.documentElement.style.setProperty(k, v);
        // Pick the light/dark series palette from the host bg luminance.
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
        const rgb = parseColor(bg);
        let dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (rgb) dark = 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2] < 128;
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
      }
      function parseColor(c) {
        if (/^#([0-9a-f]{6})$/i.test(c)) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
        const m = c.match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)/); return m ? [+m[1], +m[2], +m[3]] : null;
      }
      const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

      // ---- api ------------------------------------------------------------
      async function api(p, opts) {
        const r = await fetch(API + p, { ...opts, headers: { Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json', ...(opts && opts.headers) } });
        if (!r.ok) { let msg = ''; try { msg = (await r.json()).error; } catch { /* ignore */ } throw new Error(msg || 'request failed (' + r.status + ')'); }
        return r.json();
      }

      // ---- formatting -----------------------------------------------------
      const fmtH = (h) => (h == null ? '—' : h < 48 ? h.toFixed(1) + 'h' : (h / 24).toFixed(1) + 'd');
      const fmtDate = (ts) => new Date(ts * 1000).toISOString().slice(0, 10);
      const fmtMD = (ts) => new Date(ts * 1000).toISOString().slice(5, 10);
      const fmtPct = (r) => (r == null ? '—' : (r * 100).toFixed(0) + '%');
      const TIER_WORD = { elite: 'Elite', high: 'High', medium: 'Medium', low: 'Low' };

      // ---- svg chart helpers (dataviz method: thin marks, hairline solid
      //      grid, 2px lines, rounded data-ends, hover tooltip, table twin) --
      const NS = 'http://www.w3.org/2000/svg';
      function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
      function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return v; }

      // One chart: columns or line over weekly points [{x:ts, y:number|null}].
      function weeklyChart(container, pts, opts) {
        const W = Math.max(260, container.clientWidth || 300), H = 150;
        const M = { t: 10, r: 10, b: 20, l: 38 };
        const iw = W - M.l - M.r, ih = H - M.t - M.b;
        const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': opts.label });
        const vmax = niceMax(Math.max(opts.band ? opts.band.hi : 0, ...pts.map((p) => p.y ?? 0)) || 1);
        const x = (i) => M.l + (pts.length === 1 ? iw / 2 : (i * iw) / (pts.length - 1));
        const xb = (i) => M.l + (i + 0.5) * (iw / pts.length);
        const y = (v) => M.t + ih - (v / vmax) * ih;
        // Hairline grid (solid, recessive) + clean tick labels.
        for (let g = 0; g <= 2; g++) {
          const v = (vmax * g) / 2, gy = y(v);
          svg.appendChild(el('line', { x1: M.l, x2: W - M.r, y1: gy, y2: gy, stroke: cssVar('--border'), 'stroke-width': 1 }));
          const t = el('text', { x: M.l - 5, y: gy + 3, 'text-anchor': 'end', 'font-size': 9, fill: cssVar('--text-dim') });
          t.textContent = opts.pct ? (v * 100).toFixed(0) + '%' : v >= 1000 ? (v / 1000) + 'k' : String(Math.round(v * 100) / 100);
          svg.appendChild(t);
        }
        // Window-level band (e.g. median→p90) as a 10% wash.
        if (opts.band && opts.band.hi > opts.band.lo) {
          svg.appendChild(el('rect', { x: M.l, y: y(Math.min(opts.band.hi, vmax)), width: iw, height: Math.max(1, y(opts.band.lo) - y(Math.min(opts.band.hi, vmax))), fill: opts.color, opacity: 0.1 }));
        }
        if (opts.kind === 'cols') {
          const bw = Math.min(24, Math.max(3, (iw / pts.length) - 2)); // ≤24px, 2px gap
          pts.forEach((p, i) => {
            if (p.y == null || p.y === 0) return;
            const cy = y(p.y), bh = M.t + ih - cy, r = Math.min(4, bw / 2, bh);
            const bx = xb(i) - bw / 2;
            // Rounded data-end, square at the baseline.
            const d = `M${bx},${M.t + ih} L${bx},${cy + r} Q${bx},${cy} ${bx + r},${cy} L${bx + bw - r},${cy} Q${bx + bw},${cy} ${bx + bw},${cy + r} L${bx + bw},${M.t + ih} Z`;
            svg.appendChild(el('path', { d, fill: opts.color }));
          });
        } else {
          // Line with gaps on nulls; 2px, round joins; end dot with surface ring.
          let d = '', started = false, lastIdx = -1;
          pts.forEach((p, i) => {
            if (p.y == null) { started = false; return; }
            d += (started ? 'L' : 'M') + x(i) + ',' + y(p.y) + ' ';
            started = true; lastIdx = i;
          });
          if (d) svg.appendChild(el('path', { d, fill: 'none', stroke: opts.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
          if (lastIdx >= 0) {
            svg.appendChild(el('circle', { cx: x(lastIdx), cy: y(pts[lastIdx].y), r: 4, fill: opts.color, stroke: cssVar('--bg'), 'stroke-width': 2 }));
          }
        }
        // Baseline + sparse x labels (first / middle / last — no collisions).
        svg.appendChild(el('line', { x1: M.l, x2: W - M.r, y1: M.t + ih, y2: M.t + ih, stroke: cssVar('--border'), 'stroke-width': 1 }));
        const ticks = pts.length <= 3 ? pts.map((_, i) => i) : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
        for (const i of ticks) {
          const t = el('text', { x: opts.kind === 'cols' ? xb(i) : x(i), y: H - 6, 'text-anchor': 'middle', 'font-size': 9, fill: cssVar('--text-dim') });
          t.textContent = fmtMD(pts[i].x);
          svg.appendChild(t);
        }
        // Hover: nearest-x crosshair + tooltip (hit area = whole plot).
        const cross = el('line', { y1: M.t, y2: M.t + ih, stroke: cssVar('--text-dim'), 'stroke-width': 1, opacity: 0 });
        svg.appendChild(cross);
        const overlay = el('rect', { x: M.l, y: M.t, width: iw, height: ih, fill: 'transparent' });
        overlay.addEventListener('mousemove', (ev) => {
          const rect = svg.getBoundingClientRect();
          const px = ((ev.clientX - rect.left) / rect.width) * W;
          const i = Math.max(0, Math.min(pts.length - 1, opts.kind === 'cols'
            ? Math.floor((px - M.l) / (iw / pts.length))
            : Math.round(((px - M.l) / iw) * (pts.length - 1))));
          const cx2 = opts.kind === 'cols' ? xb(i) : x(i);
          cross.setAttribute('x1', cx2); cross.setAttribute('x2', cx2); cross.setAttribute('opacity', 0.5);
          const tip = $('tip');
          tip.style.display = 'block';
          tip.style.left = Math.min(window.innerWidth - 140, ev.clientX + 12) + 'px';
          tip.style.top = (ev.clientY + 12) + 'px';
          tip.innerHTML = '<b>wk ' + esc(fmtDate(pts[i].x)) + '</b><br>' + esc(opts.label) + ': ' + esc(opts.fmt(pts[i].y));
        });
        overlay.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); $('tip').style.display = 'none'; });
        svg.appendChild(overlay);
        container.appendChild(svg);
      }

      // Table twin — same data, WCAG-clean equivalent, toggled per chart.
      function weeklyTable(pts, label, fmt) {
        return '<table><thead><tr><th>Week</th><th>' + esc(label) + '</th></tr></thead><tbody>' +
          pts.map((p) => '<tr><td>' + esc(fmtDate(p.x)) + '</td><td>' + esc(fmt(p.y)) + '</td></tr>').join('') +
          '</tbody></table>';
      }

      function sparkline(vals, w = 90, h = 22) {
        const clean = vals.map((v) => (v == null ? 0 : v));
        const max = Math.max(...clean, 1e-9);
        const pts = clean.map((v, i) => `${(i / Math.max(1, clean.length - 1)) * w},${h - 3 - (v / max) * (h - 6)}`);
        const last = pts[pts.length - 1].split(',');
        return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true">` +
          `<polyline points="${pts.join(' ')}" fill="none" stroke="${cssVar('--text-dim')}" stroke-width="1.5" stroke-linejoin="round"/>` +
          `<circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${cssVar('--accent')}" stroke="${cssVar('--bg')}" stroke-width="2"/></svg>`;
      }

      // Stacked horizontal bar with 2px surface gaps + direct labels.
      function stackedHBar(container, parts) {
        const total = parts.reduce((a, p) => a + p.v, 0);
        if (!total) { container.innerHTML = '<p class="dim">No classified merges in window.</p>'; return; }
        const W = Math.max(260, container.clientWidth || 300), H = 26, gap = 2;
        const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': 'merge mix' });
        let xpos = 0;
        const nz = parts.filter((p) => p.v > 0);
        const avail = W - gap * (nz.length - 1);
        nz.forEach((p) => {
          const w = (p.v / total) * avail;
          svg.appendChild(el('rect', { x: xpos, y: 4, width: Math.max(1, w), height: 18, rx: 4, fill: p.color }));
          if (w > 34) {
            const t = el('text', { x: xpos + w / 2, y: 17, 'text-anchor': 'middle', 'font-size': 10, fill: '#fff' });
            t.textContent = p.v;
            svg.appendChild(t);
          }
          xpos += w + gap;
        });
        container.appendChild(svg);
        container.insertAdjacentHTML('beforeend',
          '<div class="legend">' + parts.map((p) => `<span><i class="sw" style="background:${p.color}"></i>${esc(p.name)} ${p.v}</span>`).join('') + '</div>');
      }

      // ---- rendering ------------------------------------------------------
      let LAST = null; // last metrics payload (for resize re-render)

      function tierBadge(t) {
        return t ? `<span class="tier-badge ${esc(t)}">${TIER_WORD[t] || esc(t)}</span>` : '<span class="tier-badge none">no data</span>';
      }
      function deltaHtml(d, upIsGood, fmt) {
        if (d == null) return '<span class="delta dim">vs prev: —</span>';
        const up = d > 1e-9, down = d < -1e-9;
        const cls = up ? (upIsGood ? 'up-good' : 'up-bad') : down ? (upIsGood ? 'down-bad' : 'down-good') : 'dim';
        const arrow = up ? '▲' : down ? '▼' : '·';
        return `<span class="delta ${cls}">${arrow} ${esc(fmt(Math.abs(d)))} vs prev</span>`;
      }

      function render(m) {
        LAST = m;
        const weekly = m.weekly || [];
        const wk = (key) => weekly.map((w) => ({ x: w.week_start, y: w[key] }));
        const out = $('out');
        out.classList.remove('loading');
        out.innerHTML = `
          <div class="kpis">
            <div class="kpi-tile"><div class="l">Deployment frequency ${tierBadge(m.tiers.df)}</div>
              <div class="v">${m.df_per_week.toFixed(2)}<small>/week</small></div>
              ${deltaHtml(m.deltas.df_per_week, true, (v) => v.toFixed(2) + '/wk')}
              ${sparkline(weekly.map((w) => w.deploys))}</div>
            <div class="kpi-tile"><div class="l">Lead time for changes ${tierBadge(m.tiers.lead)}</div>
              <div class="v">${fmtH(m.lead_median_h)}</div>
              ${deltaHtml(m.deltas.lead_median_h, false, fmtH)}
              ${sparkline(weekly.map((w) => w.lead_median_h))}</div>
            <div class="kpi-tile"><div class="l">Change-failure rate ${tierBadge(m.tiers.cfr)}</div>
              <div class="v">${fmtPct(m.cfr)}</div>
              ${deltaHtml(m.deltas.cfr, false, (v) => (v * 100).toFixed(0) + 'pp')}
              ${sparkline(weekly.map((w) => w.cfr))}</div>
            <div class="kpi-tile"><div class="l">Failed-deploy recovery ${tierBadge(m.tiers.mttr)}</div>
              <div class="v">${fmtH(m.mttr_h)}</div>
              ${deltaHtml(m.deltas.mttr_h, false, fmtH)}
              ${sparkline(weekly.map((w) => w.mttr_h))}</div>
          </div>
          <div class="row" style="margin:0 0 8px"><span class="dim">Overall tier: </span>${tierBadge(m.tiers.overall)}
            ${m.unrecovered ? `<span class="dim">· ${m.unrecovered} unrecovered failure(s)</span>` : ''}
            ${m.unshipped_merges ? `<span class="dim">· ${m.unshipped_merges} merged, not yet deployed</span>` : ''}</div>
          <div class="grid2" id="trends"></div>
          <div class="card" id="sugg-card"><h2>Suggestions</h2><div id="suggestions"></div></div>
          <div class="grid2">
            <div class="card"><h2>Merge mix (${m.window_days}d)</h2><div id="mix"></div></div>
            <div class="card"><h2>Process timing</h2><ul>
              <li>Feature → release&nbsp;<b>${fmtH(m.avg_feature_to_release_hours)}</b></li>
              <li>Release → deploy&nbsp;<b>${fmtH(m.avg_release_to_deploy_hours)}</b></li>
              <li>Median batch size&nbsp;<b>${m.batch_median != null ? m.batch_median.toFixed(0) + ' merges/deploy' : '—'}</b></li></ul></div>
          </div>
          <div class="grid2">
            <div class="card"><h2>Deployments</h2><ul id="deploys"></ul></div>
            <div class="card"><h2>Recent merges</h2><ul id="merges"></ul></div>
          </div>
          <div class="card" id="methodology"></div>`;

        // Trend small-multiples (2×2).
        const trends = [
          { key: 'deploys', label: 'Deploys per week', kind: 'cols', color: cssVar('--s1'), fmt: (v) => v == null ? '—' : String(v) },
          { key: 'lead_median_h', label: 'Lead time median (h)', kind: 'line', color: cssVar('--s1'), fmt: fmtH, band: m.lead_median_h != null && m.lead_p90_h != null ? { lo: m.lead_median_h, hi: m.lead_p90_h } : null },
          { key: 'cfr', label: 'Change-failure rate', kind: 'line', color: cssVar('--s3'), fmt: fmtPct, pct: true },
          { key: 'mttr_h', label: 'Recovery time (h)', kind: 'line', color: cssVar('--s2'), fmt: fmtH },
        ];
        for (const t of trends) {
          const div = document.createElement('div');
          div.className = 'card trend-chart';
          div.innerHTML = `<h2>${esc(t.label)} <button class="toggle-table">table</button></h2><div class="plot"></div><div class="twin" style="display:none"></div>` +
            (t.band ? '<div class="legend"><span><i class="sw" style="background:' + t.color + '"></i>weekly median</span><span><i class="sw" style="background:' + t.color + ';opacity:.25"></i>median→p90 (window)</span></div>' : '');
          $('trends').appendChild(div);
          weeklyChart(div.querySelector('.plot'), wk(t.key), t);
          div.querySelector('.twin').innerHTML = weeklyTable(wk(t.key), t.label, t.fmt);
          const btn = div.querySelector('.toggle-table');
          btn.onclick = () => {
            const plot = div.querySelector('.plot'), twin = div.querySelector('.twin');
            const showTable = twin.style.display === 'none';
            twin.style.display = showTable ? '' : 'none';
            plot.style.display = showTable ? 'none' : '';
            btn.textContent = showTable ? 'chart' : 'table';
          };
        }

        // Suggestions (critical first — engine pre-sorts).
        const sugg = m.suggestions || [];
        $('suggestions').innerHTML = sugg.length
          ? sugg.map((s) => `<div class="suggestion"><span class="sev ${esc(s.severity)}">${esc(s.severity)}</span><div><b>${esc(s.title)}</b><span class="d">${esc(s.detail)}</span></div></div>`).join('')
          : '<p class="dim">No findings — delivery signals look healthy in this window.</p>';

        stackedHBar($('mix'), [
          { name: 'feature', v: m.counts.feature, color: cssVar('--s1') },
          { name: 'release', v: m.counts.release, color: cssVar('--s2') },
          { name: 'hotfix', v: m.counts.hotfix, color: cssVar('--s3') },
        ]);

        $('deploys').innerHTML = (m.deployments || []).slice().reverse().map((d) =>
          `<li>${d.failed ? '⚠ ' : ''}${fmtDate(d.ts)} · <code>${esc(d.tag)}</code>${d.repo && m.repo_name === 'All repos' ? ' <span class="dim">' + esc(d.repo) + '</span>' : ''}${d.failed ? ' <span class="dim">(failed — hotfix followed)</span>' : ''}</li>`).join('')
          || '<li class="dim">No matching deploy tags in window.</li>';
        $('merges').innerHTML = (m.recent_merges || []).map((x) =>
          `<li><span class="dot k-${esc(x.kind)}"></span>${fmtDate(x.ts)} · ${esc(x.subject)}</li>`).join('')
          || '<li class="dim">No classified merges in window.</li>';

        $('methodology').innerHTML = `
          <h2>Methodology</h2>
          <p><b>Signals (git-only heuristics):</b> a <i>deploy</i> is a tag containing “${esc(cfgCache.deploy_tag_pattern)}”; a <i>merge</i> is a ≥2-parent commit whose subject carries a feature/release/hotfix branch prefix. A deploy is <i>failed</i> when a hotfix merge lands before the next deploy; <i>recovery</i> = time from the failed deploy to the next deploy. Lead time pairs each merge with the first subsequent deploy (median, not mean).</p>
          <p><b>Known censoring:</b> merges with no later deploy in the window are excluded from lead time (recent merges bias the median low near the window edge); merges before the window that deployed inside it are cut off. Weekly buckets are UTC Monday-aligned; edge buckets are partial weeks, so trend charts show <i>counts per bucket</i>, not rates.</p>
          <table><thead><tr><th>Tier</th><th>Deploy freq</th><th>Lead time</th><th>CFR</th><th>Recovery</th></tr></thead><tbody>
            <tr><td>Elite</td><td>≥ daily</td><td>&lt; 1 day</td><td>≤ 5%</td><td>&lt; 1 hour</td></tr>
            <tr><td>High</td><td>≥ weekly</td><td>&lt; 1 week</td><td>≤ 10%</td><td>&lt; 1 day</td></tr>
            <tr><td>Medium</td><td>≥ monthly</td><td>&lt; 1 month</td><td>≤ 15%</td><td>&lt; 1 week</td></tr>
            <tr><td>Low</td><td>&lt; monthly</td><td>≥ 1 month</td><td>&gt; 15%</td><td>≥ 1 week</td></tr>
          </tbody></table>
          <p>Thresholds follow the DORA research program's published performance levels.</p>`;
      }

      // ---- config ---------------------------------------------------------
      let cfgCache = { deploy_tag_pattern: 'deploy', branch_prefixes: { feature: [], release: [], hotfix: [] } };
      async function loadConfig() {
        cfgCache = await api('/config');
        $('tag-pattern').value = cfgCache.deploy_tag_pattern;
        $('scan-depth').value = cfgCache.scan_depth;
        $('pfx-feature').value = (cfgCache.branch_prefixes.feature || []).join(', ');
        $('pfx-release').value = (cfgCache.branch_prefixes.release || []).join(', ');
        $('pfx-hotfix').value = (cfgCache.branch_prefixes.hotfix || []).join(', ');
      }
      $('gear').onclick = () => $('config-card').classList.toggle('open');
      $('save-config').onclick = async () => {
        $('cfg-err').textContent = '';
        const list = (id) => $(id).value.split(',').map((s) => s.trim()).filter(Boolean);
        try {
          cfgCache = await api('/config', { method: 'PUT', body: JSON.stringify({
            deploy_tag_pattern: $('tag-pattern').value.trim(),
            scan_depth: parseInt($('scan-depth').value, 10) || 5000,
            branch_prefixes: { feature: list('pfx-feature'), release: list('pfx-release'), hotfix: list('pfx-hotfix') },
          }) });
          $('config-card').classList.remove('open');
          run();
        } catch (e) { $('cfg-err').textContent = e.message; }
      };

      // ---- actions --------------------------------------------------------
      async function run() {
        err('');
        const repo = $('repo').value, days = $('days').value;
        if (!repo) return;
        $('out').classList.add('loading'); // hold previous render, no skeleton flash
        try {
          render(await api(`/metrics?repo=${encodeURIComponent(repo)}&days=${days}`));
        } catch (e) { $('out').classList.remove('loading'); err(e.message); }
      }
      async function analyze() {
        err('');
        const repo = $('repo').value, days = $('days').value;
        if (!repo) return;
        $('analyze').disabled = true;
        try {
          const r = await api('/analyze', { method: 'POST', body: JSON.stringify({ repo, days: parseInt(days, 10) }) });
          $('out').insertAdjacentHTML('afterbegin', `<div class="card"><h2>AI analysis</h2><pre>${esc(r.summary)}</pre></div>`);
        } catch (e) { err(e.message); }
        $('analyze').disabled = false;
      }
      $('run').onclick = run;
      $('analyze').onclick = analyze;
      $('days').onchange = run;
      $('repo').onchange = run;
      let resizeT = null;
      window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => LAST && render(LAST), 200); });

      // ---- boot -----------------------------------------------------------
      window.addEventListener('message', async (ev) => {
        if (ev.source !== window.parent) return; // only the hosting shell may init us
        const msg = ev.data;
        if (!msg || msg.type !== 'otto:init') return;
        API = msg.apiBase; TOKEN = msg.token || '';
        applyTheme(msg.theme);
        try {
          const repos = await api('/repos');
          $('repo').innerHTML = repos.map((r) => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('') +
            (repos.length > 1 ? '<option value="all">All repos</option>' : '');
          await loadConfig();
          if (repos.length) run();
          else $('out').innerHTML = '<p class="dim">No git repos registered. Add one in Git first.</p>';
        } catch (e) { err(e.message); }
      });
    </script>
  </body>
</html>
