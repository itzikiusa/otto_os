<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team Performance</title>
    <style>
      /* Chart chrome comes from Otto theme vars (otto:init); series colors are
         the validated dataviz palette with light/dark steps picked by surface
         luminance. Text never wears series colors. */
      :root {
        --bg: #14161a; --text: #e6e6e6; --text-dim: #9aa0a6; --accent: #3e63dd; --border: #2a2d33;
        --s1: #3987e5; --s2: #199e70; --s3: #c98500; --s4: #8e6fd8;
        --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
        --band: rgba(57, 135, 229, 0.14);
      }
      :root.light {
        --s1: #2a78d6; --s2: #1baf7a; --s3: #eda100; --s4: #7c5fc9;
        --band: rgba(42, 120, 214, 0.12);
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 13px/1.5 -apple-system, system-ui, sans-serif; color: var(--text); background: var(--bg); padding: 16px 20px; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin: 0 0 8px; }
      h3 { font-size: 12px; margin: 10px 0 4px; color: var(--text-dim); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      select, input, button { padding: 6px 10px; font-size: 13px; color: var(--text); background: transparent; border: 1px solid var(--border); border-radius: 6px; }
      input[type="checkbox"] { padding: 0; }
      button { cursor: pointer; }
      button.primary { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
      button.small { padding: 2px 8px; font-size: 11px; }
      button:disabled { opacity: 0.5; cursor: default; }
      .card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 0 0 12px; }
      .kpi-tile { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
      .kpi-tile .l { font-size: 11px; color: var(--text-dim); }
      .kpi-tile .v { font-size: 22px; font-weight: 700; }
      .kpi-tile .v small { font-size: 12px; font-weight: 500; color: var(--text-dim); }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      th { color: var(--text-dim); font-weight: 600; font-size: 12px; }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
      tr.clickable { cursor: pointer; }
      tr.clickable:hover td { background: color-mix(in srgb, var(--text) 4%, transparent); }
      tr.suspect td { background: color-mix(in srgb, var(--warn) 7%, transparent); }
      tr.excluded td { opacity: 0.45; }
      .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--text-dim) 18%, transparent); white-space: nowrap; }
      .badge.fast { background: color-mix(in srgb, var(--good) 22%, transparent); }
      .badge.on_track { background: color-mix(in srgb, var(--good) 12%, transparent); }
      .badge.slow { background: color-mix(in srgb, var(--critical) 22%, transparent); }
      .badge.met { background: color-mix(in srgb, var(--good) 22%, transparent); }
      .badge.missed { background: color-mix(in srgb, var(--critical) 22%, transparent); }
      .badge.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); }
      .badge.git { background: color-mix(in srgb, var(--s2) 20%, transparent); }
      .badge.jira { background: color-mix(in srgb, var(--text-dim) 14%, transparent); }
      .banner { border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
      .err { color: var(--critical); padding: 4px 0; }
      .dim { color: var(--text-dim); }
      a { color: var(--accent); cursor: pointer; text-decoration: none; }
      pre { white-space: pre-wrap; margin: 0; }
      .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-dim); margin: 4px 0 8px; flex-wrap: wrap; }
      .legend .key { display: inline-flex; align-items: center; gap: 5px; }
      .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
      .evidence { display: none; }
      .evidence.open { display: table-row; }
      .evidence td { background: color-mix(in srgb, var(--text) 3%, transparent); }
      .goal { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
      .goal:last-child { border-bottom: 0; }
      .goal input { width: 74px; padding: 3px 6px; }
      .meter { width: 120px; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--text-dim) 15%, transparent); overflow: hidden; display: inline-block; vertical-align: middle; }
      .meter > div { height: 100%; border-radius: 4px; }
      #scan-progress { font-size: 12px; color: var(--text-dim); }
      svg text { fill: var(--text-dim); font-size: 10px; }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
      details.method { color: var(--text-dim); font-size: 12px; margin-top: 8px; }
      details.method summary { cursor: pointer; }
      .chart-wrap { max-width: 900px; }
      .chart-wrap svg { display: block; width: 100%; height: auto; }
      /* project multi-select dropdown */
      .msel { position: relative; }
      .msel-list { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; min-width: 260px; max-height: 320px; overflow: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.35); display: none; }
      .msel-list.open { display: block; }
      .msel-list label { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
      .msel-list label:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
      .people-row { display: grid; grid-template-columns: auto 1fr 150px 1fr 170px; gap: 8px; align-items: center; padding: 3px 0; }
      .people-row.merged { opacity: 0.55; }
      .people-row input[type="text"] { width: 100%; }
      .worker-row { display: flex; gap: 8px; align-items: center; margin: 3px 0; }
      .inline-input { width: 64px; padding: 2px 6px; font-size: 12px; }
      td .inline-input { margin-left: 4px; }
      .role-head td { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; background: color-mix(in srgb, var(--text) 3%, transparent); }
      .cfg-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
      .cfg-grid .lbl { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <h1>Team Performance <span id="tp-version" class="dim" style="font-size:11px;font-weight:400"></span></h1>
    <div class="row">
      <select id="account" aria-label="Jira account"></select>
      <span class="msel">
        <button id="proj-btn">Projects ▾</button>
        <div id="proj-list" class="msel-list"></div>
      </span>
      <select id="scan-scope" title="Which people to fetch from Jira">
        <option value="all">Scan: everyone</option>
        <option value="included">Scan: included people only</option>
      </select>
      <button class="primary" id="scan">Scan</button>
      <button id="rescan" title="Full rescan — rebuilds the corpus from scratch">⟳ Full rescan</button>
      <span id="scan-progress"></span>
      <span id="last-scan" class="dim"></span>
      <button id="coach">AI coach</button>
      <button id="settings-toggle" title="Settings">⚙</button>
    </div>
    <div class="row" style="margin-top:-6px">
      <select id="period" title="Completed-task window — everything (medians, weighted, pace, goals) is computed on this period">
        <option value="">All time</option>
        <option value="1">Last month</option>
        <option value="3">Last 3 months</option>
        <option value="6">Last 6 months</option>
        <option value="12" selected>Last 12 months</option>
        <option value="ytd">Year to date</option>
        <option value="custom">Since date…</option>
      </select>
      <input id="period-date" type="date" style="display:none">
      <select id="role-filter"><option value="">All roles</option></select>
      <select id="group-by"><option value="">No grouping</option><option value="role">Group by role</option></select>
      <select id="chart-mode" title="what the bars show">
        <option value="all">Charts: all</option>
        <option value="pipeline">Chart: pipeline</option>
        <option value="velocity">Chart: velocity (est-d delivered)</option>
        <option value="est_actual">Chart: estimation vs actual</option>
        <option value="dev_est_actual">Chart: dev estimation vs actual</option>
        <option value="monthly">Chart: monthly — delivered vs actual</option>
      </select>
      <input id="task-search" type="search" placeholder="search tasks…" style="min-width:170px">
      <span id="scope-chips" class="dim"></span>
    </div>
    <div id="err" class="err"></div>
    <div id="capped-banner" class="banner" style="display:none"></div>
    <div id="settings-card" class="card" style="display:none"></div>
    <div id="coach-out"></div>
    <div id="team-view"></div>
    <div id="dev-view" style="display:none"></div>

    <script>
      'use strict';
      let API = '', TOKEN = '';
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const err = (m) => ($('err').textContent = m || '');
      let HPD = 8; // working hours per business day (from config)
      // Agent providers offered in worker rows — replaced by Otto's live
      // registry (built-ins + custom) via the otto:init message. Fallback list
      // keeps the UI usable if a host predates provider injection.
      let PROVIDERS = ['claude', 'codex'];
      const fmtD = (v) => {
        if (v == null) return '—';
        if (v > 0 && v < 1) return (Math.round(v * HPD * 10) / 10) + 'h';
        return (Math.round(v * 10) / 10) + 'd';
      };
      const fmtRange = (st) => (st && st.p50 != null ? `${fmtD(st.p50)} <span class="dim">[${fmtD(st.p25)}–${fmtD(st.p75)}]</span>` : '—');
      const fmtDate = (ms) => (ms ? new Date(ms).toISOString().slice(0, 10) : '—');
      const fmtPct = (v) => (v == null ? '—' : Math.round(v * 100) + '%');

      // ---- theming ----------------------------------------------------------
      function applyTheme(theme) {
        if (theme) for (const [k, v] of Object.entries(theme)) if (v) document.documentElement.style.setProperty(k, v);
        const bg = (theme && theme['--bg']) || getComputedStyle(document.documentElement).getPropertyValue('--bg');
        const m = /^#([0-9a-f]{6})$/i.exec(bg.trim());
        let light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        if (m) {
          const n = parseInt(m[1], 16);
          const lum = 0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255);
          light = lum > 128;
        }
        document.documentElement.classList.toggle('light', light);
      }

      async function api(path, opts) {
        const r = await fetch(API + path, { ...opts, headers: { Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json', ...(opts && opts.headers) } });
        if (!r.ok) {
          let msg = '';
          try { msg = (await r.json()).error || ''; } catch { /* not json */ }
          const e = new Error(msg || `HTTP ${r.status}`);
          e.status = r.status;
          throw e;
        }
        return r.json();
      }

      // ---- tiny SVG helpers (inline, per the dataviz method) -----------------
      const S = (tag, attrs, kids) => {
        const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
        for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
        for (const k of kids || []) el.appendChild(k);
        return el;
      };
      const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

      /** Robust axis max: p95 of totals (clipped bars get a ▸ marker). */
      function robustMax(totals) {
        const vs = totals.filter((v) => v > 0).sort((a, b) => a - b);
        if (!vs.length) return 1;
        const p95 = vs[Math.max(0, Math.ceil(0.95 * vs.length) - 1)];
        const max = vs[vs.length - 1];
        return max <= p95 * 1.5 ? max : p95;
      }

      /** Horizontal stacked bars at natural size (no viewBox upscaling):
          rows [{label, parts:[{v, varName}], end, clipped}] */
      function stackedHBar(rows, maxV) {
        const rowH = 24, labelW = 150, endW = 90, barH = 13;
        const w = Math.min(880, Math.max(560, (document.body.clientWidth || 900) - 80));
        const plotW = w - labelW - endW;
        const svg = S('svg', { width: w, height: rows.length * rowH, viewBox: `0 0 ${w} ${rows.length * rowH}`, role: 'img', style: 'max-width:100%' });
        rows.forEach((r, i) => {
          const y = i * rowH + (rowH - barH) / 2;
          const t = S('text', { x: labelW - 8, y: i * rowH + rowH / 2 + 3.5, 'text-anchor': 'end', style: 'font-size:11px' });
          t.textContent = r.label.length > 22 ? r.label.slice(0, 21) + '…' : r.label;
          svg.appendChild(t);
          let x = labelW;
          const total = r.parts.reduce((a, p) => a + (p.v || 0), 0);
          const scaleTo = Math.min(total, maxV);
          const k = total > 0 ? scaleTo / total : 0;
          r.parts.forEach((p, pi) => {
            const bw = maxV > 0 ? Math.max(0, ((p.v || 0) * k / maxV) * plotW) : 0;
            if (bw > 0.5) {
              const isLast = pi === r.parts.length - 1 && !r.clipped;
              svg.appendChild(S('rect', { x, y, width: Math.max(1, bw - 2), height: barH, rx: isLast ? 4 : 0, fill: cssVar(p.varName) }));
              x += bw;
            }
          });
          const end = S('text', { x: x + 6, y: i * rowH + rowH / 2 + 3.5, style: 'font-size:11px' });
          end.textContent = (r.clipped ? '▸' : '') + r.end;
          if (r.clipped) end.setAttribute('font-weight', '600');
          svg.appendChild(end);
        });
        return svg;
      }

      /** Bullet bar: baseline band p25–p75 + p50 tick + 8px actual bar. */
      function bulletBar(actual, band, maxV, varName) {
        const w = 170, h = 18;
        const svg = S('svg', { width: w, height: h, viewBox: `0 0 ${w} ${h}`, style: 'width:170px' });
        const X = (v) => (maxV > 0 ? Math.min(w - 1, (v / maxV) * (w - 8)) : 0);
        if (band && band.p25 != null && band.p75 != null) {
          svg.appendChild(S('rect', { x: X(band.p25), y: 2, width: Math.max(1, X(band.p75) - X(band.p25)), height: h - 4, rx: 3, fill: 'var(--band)' }));
        }
        if (band && band.p50 != null) {
          svg.appendChild(S('rect', { x: X(band.p50), y: 1, width: 2, height: h - 2, fill: cssVar('--text-dim') }));
        }
        if (actual != null) {
          svg.appendChild(S('rect', { x: 0, y: (h - 8) / 2, width: Math.max(2, X(actual)), height: 8, rx: 4, fill: cssVar(varName) }));
        }
        return svg;
      }

      /** 12-point sparkline (2px line). */
      function sparkline(values) {
        const w = 90, h = 22, vs = values.filter((v) => v != null);
        const svg = S('svg', { width: w, height: h, viewBox: `0 0 ${w} ${h}`, style: 'width:90px' });
        if (vs.length < 2) return svg;
        const lo = Math.min(...vs), hi = Math.max(...vs);
        const pts = values.slice(-12).map((v, i, arr) => {
          if (v == null) return null;
          const x = (i / Math.max(1, arr.length - 1)) * (w - 6) + 3;
          const y = hi === lo ? h / 2 : h - 3 - ((v - lo) / (hi - lo)) * (h - 6);
          return `${x},${y}`;
        }).filter(Boolean);
        svg.appendChild(S('polyline', { points: pts.join(' '), fill: 'none', stroke: cssVar('--s1'), 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
        return svg;
      }

      /** Paired horizontal bars: rows [{label, a, b, end}] (a/b: {v, varName}). */
      function pairedHBar(rows, maxV) {
        const rowH = 30, labelW = 150, endW = 110, barH = 8;
        const w = Math.min(880, Math.max(560, (document.body.clientWidth || 900) - 80));
        const plotW = w - labelW - endW;
        const svg = S('svg', { width: w, height: rows.length * rowH, viewBox: `0 0 ${w} ${rows.length * rowH}`, role: 'img', style: 'max-width:100%' });
        rows.forEach((r, i) => {
          const t = S('text', { x: labelW - 8, y: i * rowH + rowH / 2 + 3.5, 'text-anchor': 'end', style: 'font-size:11px' });
          t.textContent = r.label.length > 22 ? r.label.slice(0, 21) + '…' : r.label;
          svg.appendChild(t);
          const X = (v) => (maxV > 0 ? Math.min(plotW, ((v || 0) / maxV) * plotW) : 0);
          svg.appendChild(S('rect', { x: labelW, y: i * rowH + 5, width: Math.max(1, X(r.a.v)), height: barH, rx: 3, fill: cssVar(r.a.varName) }));
          svg.appendChild(S('rect', { x: labelW, y: i * rowH + 5 + barH + 3, width: Math.max(1, X(r.b.v)), height: barH, rx: 3, fill: cssVar(r.b.varName) }));
          const end = S('text', { x: labelW + Math.max(X(r.a.v), X(r.b.v)) + 6, y: i * rowH + rowH / 2 + 3.5, style: 'font-size:11px' });
          end.textContent = r.end;
          svg.appendChild(end);
        });
        return svg;
      }

      /** 12-month mini column chart (weighted est-days per month). */
      function monthlyBars(values, w = 62, h = 20) {
        const svg = S('svg', { width: w, height: h, viewBox: `0 0 ${w} ${h}`, style: `width:${w}px` });
        const max = Math.max(1, ...values);
        const bw = Math.floor(w / values.length) - 1;
        const now = new Date();
        values.forEach((v, i) => {
          const bh = Math.max(v > 0 ? 1.5 : 0, (v / max) * (h - 2));
          const rect = S('rect', { x: i * (bw + 1), y: h - bh, width: bw, height: Math.max(0.1, bh), rx: 1, fill: v > 0 ? cssVar('--s2') : 'transparent' });
          const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - (values.length - 1 - i), 1));
          const t = S('title', {});
          t.textContent = `${d.toISOString().slice(0, 7)}: ${Math.round(v * 10) / 10} est-d`;
          rect.appendChild(t);
          svg.appendChild(rect);
        });
        return svg;
      }

      function meter(ratio, over) {
        const div = document.createElement('div');
        div.className = 'meter';
        const fill = document.createElement('div');
        const pct = Math.min(1, Math.max(0, ratio ?? 0));
        fill.style.width = pct * 100 + '%';
        fill.style.background = over ? 'var(--critical)' : 'var(--accent)';
        div.appendChild(fill);
        div.title = fmtPct(ratio);
        return div;
      }

      // ---- state + boot ------------------------------------------------------
      const state = {
        account: null, projects: [], allProjects: [], selected: [],
        overview: null, features: null, dev: null, config: null, people: {},
        roleFilter: '', groupBy: '', chartMode: 'all', search: '', period: '12', periodDate: '', polling: null,
      };

      function sinceMs() {
        const now = new Date();
        if (state.period === '') return 0;
        if (state.period === 'ytd') return Date.UTC(now.getUTCFullYear(), 0, 1);
        if (state.period === 'custom') return state.periodDate ? Date.parse(state.periodDate) || 0 : 0;
        const months = parseInt(state.period, 10);
        return Number.isFinite(months) ? Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - months, now.getUTCDate()) : 0;
      }
      const LS = (k) => `tp:${state.account}:${k}`;
      const saveSel = () => { try { localStorage.setItem(LS('projects'), JSON.stringify(state.selected)); } catch { /* private mode */ } };
      const loadSel = () => { try { return JSON.parse(localStorage.getItem(LS('projects')) || '[]'); } catch { return []; } };

      let PARENT_ORIGIN = '*';
      window.addEventListener('message', async (ev) => {
        if (ev.source !== window.parent) return; // only the hosting shell may init us
        const m = ev.data;
        if (!m || m.type !== 'otto:init') return;
        API = m.apiBase; TOKEN = m.token || '';
        PARENT_ORIGIN = ev.origin || '*';
        // Otto's live agent-provider registry (built-ins + custom, e.g. grok);
        // the worker rows pick from this instead of a hardcoded list.
        if (Array.isArray(m.providers) && m.providers.length) PROVIDERS = m.providers;
        applyTheme(m.theme);
        try { const c = await api('/config'); if (c && c.hours_per_day) HPD = c.hours_per_day; if (c && c._version) $('tp-version').textContent = 'v' + c._version; } catch { /* default 8 */ }
        await boot();
      });

      // A focused iframe swallows keydown, so global app shortcuts (⌘⇧←/→
      // back/forward, ⌘K, …) die on plugin pages. Forward every modifier chord
      // to the shell, which re-dispatches it so the plugin inherits ALL app
      // shortcuts. Capture phase = we see it even if an inner control would
      // consume it; target '*' so no parent-origin mismatch can drop it (the
      // payload is only key metadata). We never preventDefault, so the plugin's
      // own text editing (⌘A/⌘C in the search box) still works.
      window.addEventListener(
        'keydown',
        (e) => {
          if (!(e.metaKey || e.ctrlKey || e.altKey)) return;
          window.parent.postMessage(
            { type: 'otto:keydown', key: e.key, code: e.code, keyCode: e.keyCode, metaKey: e.metaKey, ctrlKey: e.ctrlKey, altKey: e.altKey, shiftKey: e.shiftKey },
            '*',
          );
        },
        true,
      );

      // ---- task search (filters every task table row by text) -----------------
      function applySearch() {
        const q = state.search.trim().toLowerCase();
        document.querySelectorAll('table tr[data-search]').forEach((tr) => {
          const hit = !q || tr.dataset.search.includes(q);
          tr.style.display = hit ? '' : 'none';
          // keep evidence rows glued to their task row
          if (tr.nextElementSibling && tr.nextElementSibling.classList.contains('evidence') && !hit) {
            tr.nextElementSibling.classList.remove('open');
          }
        });
      }

      async function boot() {
        try {
          const accts = await api('/accounts');
          $('account').innerHTML = accts.map((a) => `<option value="${esc(a.id)}">${esc(a.label)}</option>`).join('');
          if (!accts.length) { $('team-view').innerHTML = '<p class="dim">No Jira accounts configured in Otto. Add one first, then come back.</p>'; return; }
          state.account = accts[0].id;
          try {
            const p = localStorage.getItem(LS('period'));
            if (p !== null) { state.period = p; $('period').value = p; $('period-date').style.display = p === 'custom' ? '' : 'none'; }
            const cm = localStorage.getItem(LS('chart'));
            if (cm) { state.chartMode = cm; $('chart-mode').value = cm; }
          } catch { /* private mode */ }
          await loadProjects();
          pollScan(true); // resume progress display if a scan is already running
        } catch (e) { err('Load failed: ' + e.message); }
      }

      async function loadProjects() {
        try {
          const projects = await api(`/projects?account=${encodeURIComponent(state.account)}`);
          state.projects = projects;
          const saved = loadSel().filter((k) => projects.some((p) => p.key === k));
          state.selected = saved.length ? saved : projects.filter((p) => p.scanned).map((p) => p.key);
          if (!state.selected.length && projects.length) state.selected = [projects[0].key];
          renderProjectPicker();
          await refreshPeople();
          await refresh();
        } catch (e) { err('Projects failed: ' + e.message); }
      }

      function renderProjectPicker() {
        $('proj-btn').textContent = state.selected.length === 1
          ? state.selected[0] + ' ▾'
          : `${state.selected.length} projects (Total) ▾`;
        $('proj-list').innerHTML = state.projects.map((p) => `
          <label><input type="checkbox" class="proj-cb" value="${esc(p.key)}" ${state.selected.includes(p.key) ? 'checked' : ''}>
            <span>${esc(p.key)} — ${esc(p.name)}${p.scanned ? '' : ' <span class="dim">(not scanned)</span>'}</span></label>`).join('');
        $('proj-list').querySelectorAll('.proj-cb').forEach((cb) => {
          cb.onchange = async () => {
            const set = new Set(state.selected);
            if (cb.checked) set.add(cb.value); else set.delete(cb.value);
            state.selected = [...set];
            if (!state.selected.length) { state.selected = [cb.value]; cb.checked = true; return; }
            saveSel();
            renderProjectPicker();
            state.dev = null;
            await refresh();
          };
        });
      }
      $('proj-btn').onclick = () => $('proj-list').classList.toggle('open');
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.msel')) $('proj-list').classList.remove('open');
      });

      async function refreshPeople() {
        try {
          const p = await api(`/people?account=${encodeURIComponent(state.account)}`);
          state.people = p.people || {};
        } catch { state.people = {}; }
      }

      $('account').onchange = async (e) => { state.account = e.target.value; state.dev = null; await loadProjects(); };
      $('role-filter').onchange = (e) => { state.roleFilter = e.target.value; renderTeam(); };
      $('group-by').onchange = (e) => { state.groupBy = e.target.value; renderTeam(); };
      $('chart-mode').onchange = (e) => {
        state.chartMode = e.target.value;
        try { localStorage.setItem(LS('chart'), state.chartMode); } catch { /* private mode */ }
        if (!state.dev) renderTeam();
      };
      $('task-search').oninput = (e) => { state.search = e.target.value; applySearch(); };
      $('period').onchange = async (e) => {
        state.period = e.target.value;
        $('period-date').style.display = state.period === 'custom' ? '' : 'none';
        try { localStorage.setItem(LS('period'), state.period); } catch { /* private mode */ }
        if (state.period !== 'custom' || state.periodDate) await refresh();
      };
      $('period-date').onchange = async (e) => { state.periodDate = e.target.value; await refresh(); };

      // ---- scan --------------------------------------------------------------
      function includedAssignees() {
        return Object.entries(state.people).filter(([, p]) => p.included !== false).map(([id]) => id);
      }

      async function startScan(full) {
        err('');
        const body = { account: state.account, projects: state.selected, full };
        if ($('scan-scope').value === 'included') body.assignees = includedAssignees();
        try {
          await api('/scan', { method: 'POST', body: JSON.stringify(body) });
          pollScan();
        } catch (e) { err(e.status === 409 ? 'A scan is already running.' : e.message); }
      }
      $('scan').onclick = () => startScan(false);
      $('rescan').onclick = () => {
        if (confirm('Full rescan rebuilds the corpus of the selected projects from scratch (slow on big projects, paced to respect Jira limits). Continue?')) startScan(true);
      };

      function pollScan(passive) {
        clearInterval(state.polling);
        if (!passive) { $('scan').disabled = true; $('rescan').disabled = true; }
        state.polling = setInterval(async () => {
          try {
            const s = await api(`/scan/status?account=${encodeURIComponent(state.account)}`);
            if (s.state === 'running') {
              $('scan').disabled = true; $('rescan').disabled = true;
              const total = s.total != null ? `/${s.total}` : '';
              const proj = s.project_n > 1 ? `[${s.project_i}/${s.project_n} ${s.project}] ` : '';
              const pace = s.pace_ms ? ` · pace ${s.pace_ms}ms` : '';
              $('scan-progress').textContent = `${s.auto ? '⟳ auto · ' : ''}${proj}${s.step} ${s.fetched ?? 0}${total}${s.retries ? ` · ${s.retries} retries` : ''}${pace}`;
            } else {
              clearInterval(state.polling);
              $('scan').disabled = false; $('rescan').disabled = false;
              if (s.state === 'error') { err(s.error || 'scan failed'); $('scan-progress').textContent = ''; }
              else if (!passive || s.state === 'done') {
                $('scan-progress').textContent = s.state === 'done' ? 'scan complete' : '';
                setTimeout(() => ($('scan-progress').textContent = ''), 4000);
              }
              if (s.state === 'done') { await refreshPeople(); await refresh(); }
            }
          } catch { /* transient poll error — keep polling */ }
        }, 900);
      }

      // ---- views -------------------------------------------------------------
      const projQ = () => {
        const s = sinceMs();
        return `account=${encodeURIComponent(state.account)}&projects=${encodeURIComponent(state.selected.join(','))}${s ? `&since=${s}` : ''}`;
      };

      async function refresh() {
        err('');
        $('coach-out').innerHTML = '';
        try {
          state.overview = await api(`/overview?${projQ()}`);
        } catch (e) {
          state.overview = null;
          if (e.status !== 404) err(e.message);
        }
        try { state.features = await api(`/features?account=${encodeURIComponent(state.account)}`); } catch { state.features = null; }
        const o = state.overview;
        $('last-scan').textContent = o && o.scanned_at ? `scanned ${fmtDate(o.scanned_at)}` : 'not scanned yet';
        $('capped-banner').style.display = o && o.capped ? '' : 'none';
        if (o && o.capped) $('capped-banner').textContent = 'A previous scan was capped by max_issues — run a Full rescan (cap is now unlimited by default) to load the complete history.';
        // role filter options
        const roles = (o && o.roles) || [];
        const cur = state.roleFilter;
        $('role-filter').innerHTML = '<option value="">All roles</option>' + roles.map((r) => `<option value="${esc(r)}" ${r === cur ? 'selected' : ''}>${esc(r)}</option>`).join('');
        if (state.dev) renderDev(); else renderTeam();
      }

      function verdictBadge(v) {
        if (!v) return '<span class="badge">n/a</span>';
        const label = { fast: 'fast', on_track: 'on track', slow: 'slow' }[v];
        return `<span class="badge ${v}">${label}</span>`;
      }

      const roleOf = (id) => (state.people[id] && state.people[id].role) || '';
      const visibleAssignees = (o) => o.assignees.filter((a) => !state.roleFilter || a.role === state.roleFilter);

      const SCOPE_LABEL = {
        median_cycle_days: 'Median cycle (d)',
        median_impl_days: 'Median implementation (d)',
        median_deploy_lead_days: 'Median deploy lead (d)',
        fix_rate: 'Fix rate',
        on_track_pct: 'On track',
        weighted_throughput_wk: 'Weighted throughput (est-d/wk)',
      };
      const scopeVal = (metric, v) => (metric === 'fix_rate' || metric === 'on_track_pct' ? fmtPct(v) : v == null ? '—' : v);

      function goalsCardHtml(o) {
        const sg = o.scope_goals || { team: [], roles: {} };
        const row = (g, scopeName) => `
          <tr data-scope="${esc(scopeName)}" data-metric="${esc(g.metric)}">
            <td>${scopeName === 'team' ? '' : `<span class="badge">${esc(scopeName)}</span> `}${esc(SCOPE_LABEL[g.metric] || g.metric)}</td>
            <td class="num">${scopeVal(g.metric, g.current)}</td>
            <td class="num"><input class="inline-input sg-target" type="number" step="0.1" min="0" value="${g.target}"></td>
            <td>${g.met ? '<span class="badge met">met</span>' : '<span class="badge missed">missed</span>'}</td>
            <td><button class="small sg-del">✕</button></td>
          </tr>`;
        const teamRows = (sg.team || []).map((g) => row(g, 'team')).join('');
        const roleRows = Object.entries(sg.roles || {}).flatMap(([r, gs]) => gs.map((g) => row(g, r))).join('');
        const metricOpts = Object.entries(SCOPE_LABEL).map(([m, l]) => `<option value="${m}">${esc(l)}</option>`).join('');
        const roleOpts = ['team', ...(o.roles || [])].map((r) => `<option value="${esc(r)}">${esc(r)}</option>`).join('');
        return `<div class="card" id="goals-card"><h2>Goals — team &amp; roles <span class="dim">(evaluated on the current scope: ${esc(o.projects.join(', '))})</span></h2>
          ${teamRows || roleRows ? `<table><thead><tr><th>Goal</th><th class="num">Current</th><th class="num">Target</th><th>Status</th><th></th></tr></thead><tbody>${teamRows}${roleRows}</tbody></table>` : '<p class="dim">No team/role goals yet — add one below. Developer goals live in each developer\'s page.</p>'}
          <div class="row" style="margin:10px 0 0">
            <select id="sg-scope">${roleOpts}</select>
            <select id="sg-metric">${metricOpts}</select>
            <input id="sg-new-target" type="number" step="0.1" min="0" placeholder="target" style="width:90px">
            <button class="small" id="sg-add">Add goal</button>
            <button class="primary small" id="sg-save">Save goals</button>
            <span id="sg-msg" class="dim"></span>
          </div></div>`;
      }

      function wireGoalsCard() {
        const card = $('goals-card');
        if (!card) return;
        const collect = () => {
          const team = [];
          const roles = {};
          card.querySelectorAll('tbody tr').forEach((tr) => {
            const g = { metric: tr.dataset.metric, target: parseFloat(tr.querySelector('.sg-target').value) };
            if (!Number.isFinite(g.target)) return;
            if (tr.dataset.scope === 'team') team.push(g);
            else (roles[tr.dataset.scope] ||= []).push(g);
          });
          return { team, roles };
        };
        card.querySelectorAll('.sg-del').forEach((b) => (b.onclick = async () => { b.closest('tr').remove(); }));
        $('sg-add').onclick = () => {
          const scope = $('sg-scope').value;
          const metric = $('sg-metric').value;
          const target = parseFloat($('sg-new-target').value);
          if (!Number.isFinite(target)) { $('sg-msg').textContent = 'enter a target'; return; }
          const tb = card.querySelector('tbody');
          const tr = document.createElement('tr');
          tr.dataset.scope = scope; tr.dataset.metric = metric;
          tr.innerHTML = `<td>${scope === 'team' ? '' : `<span class="badge">${esc(scope)}</span> `}${esc(SCOPE_LABEL[metric] || metric)}</td>
            <td class="num">—</td><td class="num"><input class="inline-input sg-target" type="number" step="0.1" min="0" value="${target}"></td>
            <td><span class="badge">new</span></td><td><button class="small sg-del">✕</button></td>`;
          if (tb) tb.appendChild(tr); else { renderTeamGoalsFresh(scope, metric, target); return; }
          tr.querySelector('.sg-del').onclick = () => tr.remove();
        };
        function renderTeamGoalsFresh(scope, metric, target) {
          const goals = { team: [], roles: {} };
          if (scope === 'team') goals.team.push({ metric, target });
          else goals.roles[scope] = [{ metric, target }];
          api('/goals/scope', { method: 'PUT', body: JSON.stringify({ account: state.account, ...goals }) }).then(refresh);
        }
        $('sg-save').onclick = async () => {
          try {
            await api('/goals/scope', { method: 'PUT', body: JSON.stringify({ account: state.account, ...collect() }) });
            $('sg-msg').textContent = 'saved';
            await refresh();
          } catch (e) { err(e.message); }
        };
      }

      const CHART_DEFS = {
        pipeline: {
          title: 'Median task pipeline per developer (design → implementation → fixes → deployment)',
          legend: [['--s1', 'design'], ['--s2', 'implementation'], ['--s3', 'fixes'], ['--s4', 'deployment']],
        },
        velocity: {
          title: 'Velocity — estimated days of work delivered (commit-share credited)',
          legend: [['--s2', 'weighted est-days delivered']],
        },
        est_actual: {
          title: 'Estimation vs actual — Σ dev-agnostic estimate vs Σ actual days',
          legend: [['--s1', 'estimated (agnostic)'], ['--s2', 'actual']],
        },
        dev_est_actual: {
          title: 'Dev estimation vs actual — Σ estimate × velocity factor vs Σ actual days',
          legend: [['--s4', 'dev-adjusted estimate'], ['--s2', 'actual']],
        },
        monthly: {
          title: 'Monthly — delivered scope (est-d) vs actual days spent (visible people, last 12 months)',
          legend: [['--s1', 'delivered (est-d)'], ['--s2', 'actual days']],
        },
      };

      function assigneeChart(o, modeArg) {
        const mode = modeArg || state.chartMode || 'pipeline';
        const devs = visibleAssignees(o).filter((a) => a.completed > 0 || (a.weighted_done || 0) > 0);
        const def = CHART_DEFS[mode] || CHART_DEFS.pipeline;
        const groups = state.groupBy === 'role'
          ? [...new Set(devs.map((a) => a.role || '(no role)'))].map((r) => ({ label: r, devs: devs.filter((a) => (a.role || '(no role)') === r) }))
          : [{ label: '', devs }];
        const card = document.createElement('div');
        card.className = 'card';
        card.id = 'assignee-bars';
        card.innerHTML = `<h2>${esc(def.title)}</h2>
          <div class="legend">
            ${def.legend.map(([v, l]) => `<span class="key"><span class="swatch" style="background:var(${v})"></span>${esc(l)}</span>`).join('')}
            ${mode === 'pipeline' ? '<span class="key dim">▸ = beyond the axis (clamped at team p95)</span>' : ''}
          </div>`;
        if (mode === 'monthly') {
          const est = new Array(12).fill(0);
          const act = new Array(12).fill(0);
          for (const a of devs) {
            (a.monthly_est || []).forEach((v, i) => (est[i] += v));
            (a.monthly_actual || []).forEach((v, i) => (act[i] += v));
          }
          const now = new Date();
          const rows = est.map((v, i) => {
            const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - (11 - i), 1));
            return {
              label: d.toISOString().slice(0, 7),
              a: { v, varName: '--s1' },
              b: { v: act[i], varName: '--s2' },
              end: `${Math.round(v)}d vs ${Math.round(act[i])}d`,
            };
          });
          const wrap = document.createElement('div');
          wrap.className = 'chart-wrap';
          wrap.appendChild(pairedHBar(rows, Math.max(1, ...est, ...act)));
          card.appendChild(wrap);
          return card;
        }
        const pipelineTotal = (a) => (a.median_design || 0) + (a.median_impl || 0) + (a.median_fix || 0) + (a.median_deploy || 0);
        const maxBar = mode === 'pipeline'
          ? robustMax(devs.map(pipelineTotal))
          : mode === 'velocity'
            ? Math.max(1, ...devs.map((a) => a.weighted_done || 0))
            : Math.max(1, ...devs.map((a) => Math.max(a.sum_actual || 0, (mode === 'est_actual' ? a.sum_est : a.sum_est_dev) || 0)));
        for (const g of groups) {
          if (g.label) {
            const h = document.createElement('h3');
            h.textContent = g.label;
            card.appendChild(h);
          }
          const wrap = document.createElement('div');
          wrap.className = 'chart-wrap';
          if (mode === 'pipeline') {
            const rows = g.devs.map((a) => ({
              label: a.assignee_name || a.assignee_id,
              parts: [
                { v: a.median_design || 0, varName: '--s1' },
                { v: a.median_impl || 0, varName: '--s2' },
                { v: a.median_fix || 0, varName: '--s3' },
                { v: a.median_deploy || 0, varName: '--s4' },
              ],
              end: fmtD(pipelineTotal(a)),
              clipped: pipelineTotal(a) > maxBar * 1.001,
            }));
            if (rows.length) wrap.appendChild(stackedHBar(rows, maxBar));
          } else if (mode === 'velocity') {
            const rows = g.devs
              .slice()
              .sort((a, b) => (b.weighted_done || 0) - (a.weighted_done || 0))
              .map((a) => ({
                label: a.assignee_name || a.assignee_id,
                parts: [{ v: a.weighted_done || 0, varName: '--s2' }],
                end: `${a.weighted_done ?? 0}d`,
                clipped: false,
              }));
            if (rows.length) wrap.appendChild(stackedHBar(rows, maxBar));
          } else {
            const estOf = (a) => (mode === 'est_actual' ? a.sum_est : a.sum_est_dev) || 0;
            const varA = mode === 'est_actual' ? '--s1' : '--s4';
            const rows = g.devs
              .slice()
              .sort((a, b) => estOf(b) - estOf(a))
              .map((a) => ({
                label: a.assignee_name || a.assignee_id,
                a: { v: estOf(a), varName: varA },
                b: { v: a.sum_actual || 0, varName: '--s2' },
                end: `${Math.round(estOf(a))}d vs ${Math.round(a.sum_actual || 0)}d${a.pace_factor ? ` (×${a.pace_factor.toFixed(2)})` : ''}`,
              }));
            if (rows.length) wrap.appendChild(pairedHBar(rows, maxBar));
          }
          card.appendChild(wrap);
        }
        return card;
      }

      function renderTeam() {
        $('dev-view').style.display = 'none';
        $('team-view').style.display = '';
        const o = state.overview;
        if (!o) { $('team-view').innerHTML = '<p class="dim">No scan yet — pick projects and hit <b>Scan</b>. The first scan builds the corpus (git-primary timing + AI estimates); later scans are incremental.</p>'; return; }

        const chips = [];
        const excluded = Object.values(state.people).filter((p) => p.included === false).length;
        if (excluded) chips.push(`${excluded} people excluded`);
        if (o.excluded) chips.push(`${o.excluded} tasks excluded (outlier/stale)`);
        if (o.suspects) chips.push(`⚠ ${o.suspects} outlier suspects`);
        if ((o.unmatched_authors || []).length) chips.push(`${o.unmatched_authors.length} unmatched git authors (⚙ people)`);
        $('scope-chips').textContent = chips.join(' · ');

        const team = o.team || {};
        const sc = o.scope || {};
        const tiles = `
          <div class="tiles">
            <div class="kpi-tile"><div class="l">Completed tasks</div><div class="v">${o.completed}${o.excluded ? `<small> −${o.excluded} excl.</small>` : ''}</div></div>
            <div class="kpi-tile"><div class="l">Open tasks</div><div class="v">${o.open}</div></div>
            <div class="kpi-tile"><div class="l">Team median cycle</div><div class="v">${fmtD(sc.median_cycle_days)}</div></div>
            <div class="kpi-tile"><div class="l">On track or faster</div><div class="v">${o.measurable ? Math.round((o.on_track / o.measurable) * 100) + '<small>%</small>' : '—'}</div></div>
            <div class="kpi-tile"><div class="l">Deploy lead (merge→prod)</div><div class="v">${fmtD(sc.median_deploy_lead_days)}</div></div>
            <div class="kpi-tile"><div class="l">Fix rate</div><div class="v">${sc.fix_rate != null ? fmtPct(sc.fix_rate) : '—'}</div></div>
            <div class="kpi-tile"><div class="l">Throughput (est-d/wk)</div><div class="v">${sc.weighted_throughput_wk ?? '—'}</div></div>
          </div>`;

        const trendArrow = (t) => (t === 'improving' ? '▲' : t === 'worsening' ? '▼' : t === 'flat' ? '▶' : '—');
        const devs = visibleAssignees(o);
        const rowsHtml = (list) => list.map((a) => `
          <tr class="clickable" data-dev="${esc(a.assignee_id)}">
            <td>${esc(a.assignee_name || a.assignee_id)}${a.shared ? ` <span class="badge" title="tasks with significant multi-dev collaboration">${a.shared}⇄</span>` : ''}</td>
            <td>${esc(a.role || '')}</td>
            <td class="num" title="${a.rolled_up ? `${a.rolled_up} dev sub-tasks rolled into their parent stories · ` : ''}${a.routine_done ? `${a.routine_done} routine-weighted` : ''}">${a.completed}${a.routine_done ? ` <span class="dim">(${Math.round(a.routine_done)}r)</span>` : ''}</td>
            <td class="num">${a.wip}</td>
            <td class="num" title="estimated days of work delivered (multi-dev credit split by commit share)">${a.weighted_done ?? '—'}</td>
            <td class="num" title="commits under catch-all keys (ABC-0000 …) — unscoped fixes / prod work with no story">${a.unscoped_commits || '—'}</td>
            <td class="monthly" data-dev="${esc(a.assignee_id)}"></td>
            <td class="num" title="Σactual ÷ Σ(AI estimate) — how many elapsed days per estimated ideal day (AI-estimated tasks only)">${a.pace_vs_est != null ? '×' + a.pace_vs_est.toFixed(2) : '—'}</td>
            <td class="num">${fmtD(a.median_impl)}</td>
            <td class="num">${fmtD(a.median_cycle)}</td>
            <td class="num" title="delivered est-days per week vs team median (higher = more output; overlap-safe — the calendar is the denominator)${a.pace_factor != null ? ` · latency vs team ×${a.pace_factor.toFixed(2)}` : ''}">${a.output_factor != null ? '×' + a.output_factor.toFixed(2) : '—'}</td>
            <td class="num">${a.mape != null ? fmtPct(a.mape) : '—'}</td>
            <td class="num">${a.avg_wip ?? '—'}</td>
            <td>${a.goals_total ? `<span class="badge ${a.goals_met === a.goals_total ? 'met' : a.goals_met ? 'warn' : 'missed'}">${a.goals_met}/${a.goals_total}</span>` : '—'}</td>
            <td title="${esc(a.trend || '')}">${trendArrow(a.trend)}</td>
          </tr>`).join('');
        const head = '<thead><tr><th>Developer</th><th>Role</th><th class="num" title="task counts are inflated by routine work — weighted est-days is the fair column">Done</th><th class="num">WIP</th><th class="num">Weighted (est-d)</th><th class="num" title="unscoped fix commits (ABC-0000-style catch-all keys)">Fixes⚡</th><th title="weighted est-days per month, last 12 months">Monthly</th><th class="num" title="Σactual ÷ Σestimate, absolute (AI-estimated tasks only)">vs est</th><th class="num">Impl</th><th class="num">Cycle</th><th class="num" title="output per week vs team median (higher = better)">vs team</th><th class="num">Est err</th><th class="num">Avg WIP</th><th>Goals</th><th>Trend</th></tr></thead>';
        let tableBody;
        if (state.groupBy === 'role') {
          const groups = [...new Set(devs.map((a) => a.role || '(no role)'))];
          tableBody = groups.map((g) => `<tr class="role-head"><td colspan="15">${esc(g)}</td></tr>` + rowsHtml(devs.filter((a) => (a.role || '(no role)') === g))).join('');
        } else tableBody = rowsHtml(devs);

        const openCard = `<div class="card" id="open-tasks"><h2>Open tasks — predicted timelines <span class="dim">(estimate levels: AI → per-dev → prediction)</span></h2>
          ${openRows ? `<table><thead><tr><th>Key</th><th>Assignee</th><th>Type</th><th>Status</th><th class="num">Elapsed</th><th class="num">Est AI</th><th class="num">Est dev</th><th class="num">Expected total</th><th>Consumed</th><th class="num">Projected</th></tr></thead><tbody>${openRows}</tbody></table>` : '<p class="dim">No open tasks in the scope.</p>'}</div>`;

        // Git-only features (repos without Jira stories).

        if (feats && feats.length) {

              <td class="num">${f.commit_count}</td>
              <td class="num">${fmtD(f.est_days_ai)}</td>

              <td class="num">${fmtDate(f.merged_at)}</td>

          featCard = `<div class="card" id="git-features"><h2>Repo features without Jira stories <span class="dim">(from ⚙ feature-scan repos; estimate → dev estimate → actual)</span></h2>
            <table><thead><tr><th>Repo</th><th>Feature</th><th>People</th><th class="num">Commits</th><th class="num">Est AI</th><th class="num">Est dev</th><th class="num">Actual</th><th class="num">Deploy wait</th><th class="num">Merged</th></tr></thead><tbody>${frows}</tbody></table></div>`;

        const guideRows = (o.baseline || []).map((b) => `
          <tr><td>${esc(b.type)}</td><td class="num">${b.points ?? 'unestimated'}</td><td class="num">${b.n}</td>

        const guide = `<div class="card" id="estimation-guide"><h2>Estimation guide — how long tasks actually take here</h2>
          ${guideRows ? `<table><thead><tr><th>Type</th><th class="num">Points</th><th class="num">n</th><th class="num">Design p50 [p25–p75]</th><th class="num">Implementation</th><th class="num">Total</th></tr></thead><tbody>${guideRows}</tbody></table>` : '<p class="dim">Not enough completed tasks yet — the guide appears once buckets reach n≥2.</p>'}
          <details class="method" id="methodology"><summary>Methodology</summary>
            Git is the primary timing signal: implementation = first commit → merge to ${esc(Object.values(o.target_used || {})[0] || 'develop')}/release (done); fixes = commits landing after done (incl. release/hotfix branches); deployment = *-DEPLOYED* tag. The Jira changelog is the secondary indication (design phase, and tasks with no code). Business days, configurable workweek. Stale-status tasks and lead-marked outliers are excluded from all medians; a manual per-task time re-includes it. Weighted throughput = dev-agnostic AI scope estimates (batched agent calls, cached) credited by commit share across all contributors — the fair alternative to task counts. Predictions anchor on the AI estimate × the developer's velocity factor (clamped ×0.5–×2).</details></div>`;

        const flags = Object.entries(o.flags || {});
        const flagsCard = flags.length ? `<div class="card"><h2>Hygiene flags (completed tasks)</h2><div class="row" style="margin:0">${flags.map(([k, v]) => `<span class="badge">${esc(k)} × ${v}</span>`).join(' ')}</div></div>` : '';

          const a = byId.get(td.dataset.dev);
          if (a && a.monthly && a.monthly.some((v) => v > 0)) td.appendChild(monthlyBars(a.monthly));

      // ---- reports hub (agent-written per-dev summaries, saved history) -------

        try {
          const r = await api(`/reports?account=${encodeURIComponent(state.account)}${assignee ? `&assignee=${encodeURIComponent(assignee)}` : ''}`);

              <option value="combined">Team + every developer (full)</option>

            <select id="trep-month">${MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('')}</select>
            <select id="trep-q" style="display:none"><option value="1">Q1</option><option value="2">Q2</option><option value="3">Q3</option><option value="4">Q4</option></select>

          <div id="reports-active"></div>
          <div id="reports-list" class="dim">Loading…</div></div>`;
      }

      // Show EVERY report currently being generated (survives reloads — the
      // jobs live on the server), each with a live elapsed timer, auto-opening
      // when it finishes. This is the "see all running" view.
      let activeReportTimer = null;
      async function renderActiveReports() {
        const box = $('reports-active');
        if (!box) return;
        clearInterval(activeReportTimer);
        const paint = async () => {
          let active = [];
          try { active = (await api(`/reports/active?account=${encodeURIComponent(state.account)}`)).active || []; } catch { return; }
          if (!active.length) { box.innerHTML = ''; return; }
          const now = Date.now();
          box.innerHTML = `<div class="card" style="margin:6px 0;border-color:color-mix(in srgb,var(--accent) 40%,transparent)">
            <b class="dim" style="font-size:11px">⏳ GENERATING NOW (${active.length})</b>
            ${active.map((a) => {
              const s = Math.floor((now - a.started_at) / 1000);
              const el = s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
              return `<div class="row" style="margin:3px 0"><span class="badge warn">writing</span> <b>${esc(a.label)}</b> <span class="dim">${esc(a.step)} · ${el}</span></div>`;
            }).join('')}</div>`;
          // when a running job disappears (finished), refresh the hub to show it saved
          const doneKeys = renderActiveReports._seen && renderActiveReports._seen.filter((k) => !active.some((a) => a.job === k));
          renderActiveReports._seen = active.map((a) => a.job);
          if (doneKeys && doneKeys.length) { await wireReportsHub(); }
        };
        await paint();
        activeReportTimer = setInterval(paint, 3000);
      }

      async function wireReportsHub() {
        const list = $('reports-list');
        if (!list) return;
        // Team report generator.
        const setPeriodInputs = () => {
          const k = $('trep-kind').value;
          $('trep-month').style.display = k === 'month' ? '' : 'none';
          $('trep-q').style.display = k === 'quarter' ? '' : 'none';
        };
        $('trep-kind').onchange = setPeriodInputs;
        setPeriodInputs();
        // default month = previous month
        const pm = new Date(); pm.setUTCMonth(pm.getUTCMonth() - 1);
        $('trep-month').value = String(pm.getUTCMonth() + 1);
        $('trep-year').value = String(pm.getUTCFullYear());
        $('trep-gen').onclick = async () => {
          const kind = $('trep-kind').value;
          const scope = $('trep-scope').value;
          const body = {
            account: state.account, scope, kind,
            year: parseInt($('trep-year').value, 10),
            month: kind === 'month' ? parseInt($('trep-month').value, 10) : undefined,
            quarter: kind === 'quarter' ? parseInt($('trep-q').value, 10) : undefined,
            mask: $('trep-mask').checked,
            mask_tasks: $('trep-mask-tasks').checked,
          };
          $('trep-gen').disabled = true;
          $('trep-status').textContent = 'starting…';
          try {
            const start = await api('/report', { method: 'POST', body: JSON.stringify(body) });
            if (start.already) $('trep-status').textContent = 'already generating — showing progress…';
            await renderActiveReports(); // reflect it in the "generating now" list
            pollReportJob({
              job: start.job,
              statusEl: $('trep-status'),
              button: $('trep-gen'),
              onDone: async (report) => { await wireReportsHub(); if (report) openReport(report.id); },
            });
          } catch (e) { $('trep-gen').disabled = false; $('trep-status').textContent = ''; err(e.message); }
        };
        await renderActiveReports();

        const reports = await loadReports(null);
        if (!reports.length) { list.innerHTML = '<span class="dim">No reports yet — generate a team report above, or open a developer for a personal one (month/quarter/year, any past period).</span>'; return; }
        const groups = new Map();
        for (const r of reports) {
          const g = ['team', 'combined'].includes(r.report_scope || 'dev') ? '▣ Team reports' : r.assignee_name;
          if (!groups.has(g)) groups.set(g, []);
          groups.get(g).push(r);
        }
        list.classList.remove('dim');
        list.innerHTML = [...groups.entries()].map(([name, rs]) => `
          <div class="row" style="margin:4px 0"><b style="min-width:180px">${esc(name)}</b>
            ${rs.map((r) => `<button class="small rep-open" data-id="${esc(r.id)}">${esc(r.label)} <span class="dim">${fmtDate(r.created_at)}</span></button>`).join(' ')}
          </div>`).join('');
        list.querySelectorAll('.rep-open').forEach((b) => (b.onclick = () => openReport(b.dataset.id)));
      }

      /**
       * Poll a report job with a live elapsed timer and robust end states.
       * opts: {job, statusEl, button, onDone}. Handles done / error / a
       * vanished job (state 'idle' after start — e.g. the daemon restarted).
       */
      function pollReportJob({ job, statusEl, button, onDone }) {
        const started = Date.now();
        let sawRunning = false;
        const fmtElapsed = () => {
          const s = Math.floor((Date.now() - started) / 1000);
          return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
        };
        const stop = () => { clearInterval(timer); if (button) button.disabled = false; };
        const timer = setInterval(async () => {
          let s;
          try {
            s = await api(`/report/status?job=${encodeURIComponent(job)}`);
          } catch {
            statusEl.textContent = `writing report… ${fmtElapsed()} (waiting for daemon)`;
            return;
          }
          if (s.state === 'running') {
            sawRunning = true;
            statusEl.textContent = `${s.step || 'writing report'} · ${fmtElapsed()}`;
          } else if (s.state === 'done') {
            stop();
            statusEl.textContent = `done in ${fmtElapsed()}`;
            setTimeout(() => (statusEl.textContent = ''), 4000);
            await onDone(s.report);
          } else if (s.state === 'error') {
            stop();
            statusEl.textContent = '';
            err(s.error || 'report failed');
          } else if (s.state === 'idle') {
            // Job not found. If we'd already seen it running (or waited a bit),
            // the sidecar was restarted mid-report — tell the user plainly.
            if (sawRunning || Date.now() - started > 8000) {
              stop();
              statusEl.textContent = '';
              err('report generation was interrupted (the app or daemon restarted) — please generate it again');
            }
          }
        }, 2000);
      }

      async function openReport(id) {
        try {
          const r = await api(`/report/html?account=${encodeURIComponent(state.account)}&id=${encodeURIComponent(id)}`);
          const overlay = document.createElement('div');
          overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;flex-direction:column;padding:24px';
          const bar = document.createElement('div');
          bar.className = 'row';
          bar.innerHTML = `<b style="color:#fff">${esc(r.assignee_name)} — ${esc(r.label)}</b>
            <button class="small" id="rep-dl">Download</button><button class="small" id="rep-close">✕ close</button>`;
          const frame = document.createElement('iframe');
          frame.style.cssText = 'flex:1;border:1px solid var(--border);border-radius:10px;background:#fff';
          frame.srcdoc = r.html;
          overlay.append(bar, frame);
          document.body.appendChild(overlay);
          bar.querySelector('#rep-close').onclick = () => overlay.remove();
          bar.querySelector('#rep-dl').onclick = () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([r.html], { type: 'text/html' }));
            a.download = `${r.assignee_name}-${r.label}.html`.replace(/\s+/g, '-');
            a.click();
          };
        } catch (e) { err(e.message); }
      }

      function hydrateMeters(root) {
        root.querySelectorAll('td.pct').forEach((td) => {
          const p = td.dataset.pct === '' ? null : parseFloat(td.dataset.pct);
          if (p == null) { td.textContent = '—'; return; }
          td.appendChild(meter(p, p > 1));
          td.append(' ' + fmtPct(p));
        });
      }

        const goalLabel = {

          median_design_days: 'Median design (days)',

        const goalRows = v.goals.map((g) => {

            <td class="bullet" data-i="${i}"></td>
            <td>${verdictBadge(t.verdicts.total)}</td>

            <span class="dim">git: ${gitLine}${authors ? ` · authors: ${authors}` : ''}</span><br>
