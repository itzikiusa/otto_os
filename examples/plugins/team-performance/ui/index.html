            ${kids ? `<details style="margin:4px 0"><summary class="dim">${(t.children || []).length} sub-tasks</summary><table style="margin-top:4px"><thead><tr><th>Key</th><th>Type</th><th>Summary</th><th>Assignee</th><th class="num">Days</th></tr></thead><tbody>${kids}</tbody></table></details>` : ''}
            <div class="est-edit" data-key="${esc(t.key)}" data-project="${esc(t.project || t.key.split('-')[0])}" style="margin:6px 0;padding:6px 8px;border:1px solid var(--border);border-radius:6px">
              <div class="row" style="margin:0 0 4px;align-items:baseline">
                <b class="dim" style="font-size:11px">CORRECT ESTIMATE</b>
                <span>AI (agnostic) <input class="inline-input est-ai" type="number" step="0.25" min="0.25" value="${t.est_days_ai ?? ''}" placeholder="—"> d</span>
                ${t.est_ai_original != null ? `<span class="dim">was ${t.est_ai_original}d (AI)</span>` : ''}
                <span>dev <input class="inline-input est-dev" type="number" step="0.25" min="0.25" value="${t.est_days_dev ?? ''}" placeholder="—"> d</span>
                ${t.est_dev_auto != null && t.est_dev_override != null ? `<span class="dim">auto ${t.est_dev_auto}d</span>` : ''}
              </div>
              <div class="row" style="margin:0">
                <input class="est-reason" type="text" style="flex:1;min-width:220px" placeholder="why? (fed to future AI estimates so they learn)" value="${esc(t.est_reason || '')}">
                <button class="small primary est-save">Save estimate</button>
                <button class="small est-restore">Restore AI</button>
                ${t.est_overridden ? '<span class="badge warn">overridden</span>' : ''}
              </div>
            </div>
            <div class="row" style="margin:6px 0" data-key="${esc(t.key)}" data-project="${esc(t.project || t.key.split('-')[0])}">
              <b class="dim" style="font-size:11px">ACTUAL TIME</b>
              <span>override actual (days): <input class="inline-input ov-manual" type="number" step="0.1" min="0.1" value="${t.manual_days ?? ''}" placeholder="${fmtD(t.actual_days)}"></span>
              <button class="small ov-manual-save">Set</button>
              <button class="small ov-manual-clear">Clear</button>
              ${t.fix_count ? `<span title="fold this task's fix time into its actual">fixes (${t.fix_count} commits, ${fmtD(t.fix_days)}):
                <select class="ov-incfix">
                  <option value="auto" ${t.include_fixes_override == null && t.fix_days_override == null ? 'selected' : ''}>auto${t.include_fixes ? ' (included)' : ' (separate)'}</option>
                  <option value="yes" ${t.include_fixes_override === true && t.fix_days_override == null ? 'selected' : ''}>include full</option>
                  <option value="no" ${t.include_fixes_override === false && t.fix_days_override == null ? 'selected' : ''}>exclude</option>
                </select>
                <span class="dim">or add</span> <input class="inline-input ov-fixdays" type="number" step="0.5" min="0" value="${t.fix_days_override ?? ''}" placeholder="${Math.round((t.fix_days || 0) * 10) / 10}" title="fold in only THIS many fix-days instead of all of them"> <span class="dim">fix-days</span>
                <button class="small ov-fixdays-save">Set</button></span>` : ''}
              ${t.late_touches ? `<span class="dim" title="commits after the fix window — not counted">+${t.late_touches} late touches</span>` : ''}
            </div>
            <span class="row" style="margin:6px 0">
              <button class="small ov-exclude" data-key="${esc(t.key)}" data-project="${esc(t.project || t.key.split('-')[0])}" data-cur="${t.excluded_override ? '1' : ''}">${t.excluded_override ? 'Include story' : 'Exclude story'}</button>
              <button class="small ov-outlier" data-key="${esc(t.key)}" data-project="${esc(t.project || t.key.split('-')[0])}" data-cur="${t.outlier ? '1' : ''}">${t.outlier ? 'Unmark outlier' : 'Mark as outlier'}</button>
              <span class="dim">outliers leave all stats; the actual override wins over git/Jira timing; fixes fold in only when substantial (auto) or you force it</span>
            </span>
            <table style="margin-top:6px"><thead><tr><th>Status</th><th>Phase</th><th class="num">Span</th><th class="num">Calendar</th></tr></thead><tbody>${evid}</tbody></table></td></tr>`;
        }).join('');

        const openRows = v.open.map((t) => `
          <tr data-search="${esc(`${t.key} ${t.summary || ''} ${t.status}`.toLowerCase())}">
            <td>${esc(t.key)}</td><td>${esc(t.status)}</td>
            <td class="num">${fmtD((t.design_days || 0) + (t.impl_days || 0))}</td>
            <td class="num">${fmtD(t.est_days_ai)}</td>
            <td class="num">${fmtD(t.est_days_dev)}</td>
            <td class="num">${t.prediction ? fmtRange(t.prediction.total) : '—'}</td>
            <td class="pct" data-pct="${t.pct_consumed ?? ''}"></td>
            <td class="num">${fmtDate(t.projected_done_at)}</td>
          </tr>`).join('');

        const contribRows = (v.contributions || []).map((c) => `
          <tr><td>${esc(c.key)}</td><td title="${esc(c.summary)}">${esc(c.summary.slice(0, 70))}</td><td>${esc(c.assignee_name || '—')}</td>
          <td class="num">${Math.round(c.share * 100)}% · ${c.commits}c</td><td class="num">${fmtD(c.actual_days)}</td></tr>`).join('');

        $('dev-view').innerHTML = `
          <div class="row"><a id="back">← team</a><h2 style="margin:0">${esc(s.assignee_name || s.assignee_id)}${s.role ? ` <span class="badge">${esc(s.role)}</span>` : ''}</h2></div>
          <div class="tiles">
            <div class="kpi-tile"><div class="l">Weighted done (est-days)</div><div class="v">${s.weighted_done ?? '—'}</div></div>
            <div class="kpi-tile"><div class="l">vs estimate (actual ÷ est)</div><div class="v">${s.pace_vs_est != null ? '×' + s.pace_vs_est.toFixed(2) : '—'}</div></div>
            <div class="kpi-tile"><div class="l">Median cycle</div><div class="v">${fmtD(s.median_cycle)}</div></div>
            <div class="kpi-tile"><div class="l">Output (est-d / week)</div><div class="v">${s.output_wk ?? '—'}${s.output_factor != null ? `<small> ×${s.output_factor.toFixed(2)} vs team</small>` : ''}</div></div>
            <div class="kpi-tile"><div class="l">Estimate error</div><div class="v">${s.mape != null ? fmtPct(s.mape) : '—'}</div></div>
            <div class="kpi-tile"><div class="l">Avg parallel tasks</div><div class="v">${s.avg_wip ?? '—'}</div></div>
            ${(s.repo_commits || s.unscoped_commits) ? `<div class="kpi-tile"><div class="l">Fix / automation commits</div><div class="v">${(s.unscoped_commits || 0) + (s.repo_commits || 0)}<small>${s.repo_commits ? ` in ${(s.repo_names || []).join(', ')}` : ' prod fixes'}</small></div></div>` : ''}
          </div>
          <div class="card" id="dev-charts"><h2>Trends <span class="dim">(this developer, last 12 months)</span></h2>
            <div class="legend">
              <span class="key"><span class="swatch" style="background:var(--s1)"></span>delivered scope (est-d)</span>
              <span class="key"><span class="swatch" style="background:var(--s2)"></span>actual days spent</span>
            </div>
            <div id="dev-chart-wrap" class="chart-wrap"></div></div>
          <div class="card" id="goals"><h2>Goals <span class="dim">(targets are editable; progress updates every scan)</span></h2><div id="goal-rows"></div>
            <div class="row" style="margin:10px 0 0"><button class="primary" id="save-goals">Save goals</button><span id="goals-msg" class="dim"></span></div></div>
          <div class="card" id="dev-reports"><h2>Summary reports <span class="dim">(agent-written; compares vs the previous period + prior saved reports; kept in the hub)</span></h2>
            <div class="row">
              <select id="rep-kind"><option value="month">Month</option><option value="quarter">Quarter</option><option value="year">Full year</option></select>
              <select id="rep-month">${MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('')}</select>
              <select id="rep-year">${Array.from({ length: 7 }, (_, k) => new Date().getUTCFullYear() - k).map((y) => `<option>${y}</option>`).join('')}</select>
              <select id="rep-q" style="display:none"><option value="1">Q1</option><option value="2">Q2</option><option value="3">Q3</option><option value="4">Q4</option></select>
              <label style="display:inline-flex;gap:5px;align-items:center"><input type="checkbox" id="rep-mask"> mask name</label>
              <button class="primary small" id="rep-gen">Generate report</button>
              <span id="rep-status" class="dim"></span>
            </div>
            <div id="rep-list" style="margin-top:8px"></div></div>
          <div class="card"><h2>Completed tasks — estimate → dev estimate → actual <span class="dim">(click a row for evidence + outlier/manual-time controls)</span></h2>
            ${v.completed.length ? `<table id="completed-table"><thead><tr><th>Key</th><th>Type</th><th class="num">Est AI</th><th class="num">Est dev</th><th class="num">Actual</th><th class="num">Design</th><th class="num">Impl</th><th class="num">Fixes</th><th class="num">Deploy</th><th>vs baseline</th><th>Verdict</th></tr></thead><tbody>${taskRows}</tbody></table>` : '<p class="dim">No completed tasks for this developer yet.</p>'}
          </div>
          ${contribRows ? `<div class="card"><h2>Contributions to other people's tasks <span class="dim">(credit via commit share)</span></h2>
            <table><thead><tr><th>Key</th><th>Summary</th><th>Assignee</th><th class="num">Share</th><th class="num">Actual</th></tr></thead><tbody>${contribRows}</tbody></table></div>` : ''}
          <div class="card" id="dev-open"><h2>Open tasks — predicted timeline</h2>
            ${v.open.length ? `<table><thead><tr><th>Key</th><th>Status</th><th class="num">Elapsed</th><th class="num">Est AI</th><th class="num">Est dev</th><th class="num">Expected</th><th>Consumed</th><th class="num">Projected</th></tr></thead><tbody>${openRows}</tbody></table>` : '<p class="dim">Nothing in flight.</p>'}
          </div>`;

        // Per-dev monthly chart: delivered scope (est-d) vs actual days.
        const est = s.monthly_est || s.monthly || [];
        const act = s.monthly_actual || [];
        if (est.some((v) => v > 0) || act.some((v) => v > 0)) {
          const now = new Date();
          const rows = est.map((v, i) => {
            const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - (est.length - 1 - i), 1));
            return { label: d.toISOString().slice(0, 7), a: { v, varName: '--s1' }, b: { v: act[i] || 0, varName: '--s2' }, end: `${Math.round(v)}d vs ${Math.round(act[i] || 0)}d` };
          });
          $('dev-chart-wrap').appendChild(pairedHBar(rows, Math.max(1, ...est, ...act)));
        } else {
          $('dev-chart-wrap').innerHTML = '<p class="dim">No estimated tasks in the window yet.</p>';
        }

        const goalWrap = $('goal-rows');
        goalRows.forEach((r) => goalWrap.appendChild(r));
        if (!goalRows.length) goalWrap.innerHTML = '<p class="dim">Goals appear once this developer has enough completed tasks to compute stats.</p>';
        $('back').onclick = () => { state.dev = null; renderTeam(); };

        // -- summary reports (generate + history) --
        const repRefresh = async () => {
          const reps = await loadReports(state.dev);
          $('rep-list').innerHTML = reps.length
            ? reps.map((r) => `<button class="small rep-open" data-id="${esc(r.id)}">${esc(r.label)} <span class="dim">${fmtDate(r.created_at)}</span></button>`).join(' ')
            : '<span class="dim">No saved reports for this developer yet.</span>';
          $('rep-list').querySelectorAll('.rep-open').forEach((b) => (b.onclick = () => openReport(b.dataset.id)));
        };
        repRefresh();
        const setDevPeriod = () => {
          const k = $('rep-kind').value;
          $('rep-month').style.display = k === 'month' ? '' : 'none';
          $('rep-q').style.display = k === 'quarter' ? '' : 'none';
        };
        $('rep-kind').onchange = setDevPeriod; setDevPeriod();
        { const pm = new Date(); pm.setUTCMonth(pm.getUTCMonth() - 1); $('rep-month').value = String(pm.getUTCMonth() + 1); }
        $('rep-gen').onclick = async () => {
          const kind = $('rep-kind').value;
          const body = {
            account: state.account,
            assignee: state.dev,
            kind,
            year: parseInt($('rep-year').value, 10),
            month: kind === 'month' ? parseInt($('rep-month').value, 10) : undefined,
            quarter: kind === 'quarter' ? parseInt($('rep-q').value, 10) : undefined,
            mask: $('rep-mask').checked,
          };
          $('rep-gen').disabled = true;
          $('rep-status').textContent = 'starting…';
          try {
            const start = await api('/report', { method: 'POST', body: JSON.stringify(body) });
            if (start.already) $('rep-status').textContent = 'already generating — showing progress…';
            pollReportJob({
              job: start.job,
              statusEl: $('rep-status'),
              button: $('rep-gen'),
              onDone: async (report) => { await repRefresh(); if (report) openReport(report.id); },
            });
          } catch (e) {
            $('rep-gen').disabled = false;
            $('rep-status').textContent = '';
            err(e.message);
          }
        };
        $('dev-view').querySelectorAll('td.bullet').forEach((td) => {
          const t = v.completed[parseInt(td.dataset.i, 10)];
          td.appendChild(bulletBar(t.actual_days, t.baseline ? t.baseline.total : null, maxTask, '--s1'));
        });
        $('dev-view').querySelectorAll('tr.task-row').forEach((tr) => {
          tr.onclick = (e) => {
            if (e.target.closest('button, input')) return;
            tr.nextElementSibling.classList.toggle('open');
          };
        });
        hydrateMeters($('dev-view'));
        applySearch();
        // Outlier / manual-time / exclude controls.
        $('dev-view').querySelectorAll('.ov-exclude').forEach((b) => {
          b.onclick = async () => {
            try {
              await saveOverride(b.dataset.key, b.dataset.project, { excluded: !b.dataset.cur });
              await refresh();
            } catch (e) { err(e.message); }
          };
        });
        $('dev-view').querySelectorAll('.ov-outlier').forEach((b) => {
          b.onclick = async () => {
            try {
              await saveOverride(b.dataset.key, b.dataset.project, { outlier: !b.dataset.cur });
              await refresh();
            } catch (e) { err(e.message); }
          };
        });
        // Actual-time controls (data-key/project live on the wrapping row).
        $('dev-view').querySelectorAll('.ov-manual-save').forEach((b) => {
          b.onclick = async () => {
            const row = b.closest('[data-key]');
            const val = parseFloat(row.querySelector('.ov-manual').value);
            if (!Number.isFinite(val) || val <= 0) { err('enter a positive number of days'); return; }
            try {
              await saveOverride(row.dataset.key, row.dataset.project, { manual_days: val });
              await refresh();
            } catch (e) { err(e.message); }
          };
        });
        $('dev-view').querySelectorAll('.ov-manual-clear').forEach((b) => {
          b.onclick = async () => {
            const row = b.closest('[data-key]');
            try {
              await saveOverride(row.dataset.key, row.dataset.project, { manual_days: null });
              await refresh();
            } catch (e) { err(e.message); }
          };
        });
        // Fold this task's fix time into the actual: auto / include full / exclude.
        // Selecting a mode clears any partial fix-days override.
        $('dev-view').querySelectorAll('.ov-incfix').forEach((sel) => {
          sel.onchange = async () => {
            const row = sel.closest('[data-key]');
            const v = sel.value === 'yes' ? true : sel.value === 'no' ? false : null;
            try {
              await saveOverride(row.dataset.key, row.dataset.project, { include_fixes: v, fix_days_override: null });
              await refresh();
            } catch (e) { err(e.message); }
          };
        });
        // Partial fix time: fold in only N fix-days (wins over the include mode).
        $('dev-view').querySelectorAll('.ov-fixdays-save').forEach((b) => {
          b.onclick = async () => {
            const row = b.closest('[data-key]');
            const raw = row.querySelector('.ov-fixdays').value.trim();
            const val = raw === '' ? null : parseFloat(raw);
            if (val !== null && (!Number.isFinite(val) || val < 0)) { err('enter a non-negative number of fix-days'); return; }
            try {
              await saveOverride(row.dataset.key, row.dataset.project, { fix_days_override: val });
              await refresh();
            } catch (e) { err(e.message); }
          };
        });
        // Estimate correction: override the agnostic and/or dev estimate + reason.
        $('dev-view').querySelectorAll('.est-edit').forEach((box) => {
          const key = box.dataset.key, project = box.dataset.project;
          box.querySelector('.est-save').onclick = async () => {
            const ai = parseFloat(box.querySelector('.est-ai').value);
            const dev = parseFloat(box.querySelector('.est-dev').value);
            const reason = box.querySelector('.est-reason').value.trim();
            const patch = { est_reason: reason || null };
            patch.est_days = Number.isFinite(ai) && ai > 0 ? ai : null;
            patch.est_dev_days = Number.isFinite(dev) && dev > 0 ? dev : null;
            try {
              await saveOverride(key, project, patch);
              await refresh();
            } catch (e) { err(e.message); }
          };
          box.querySelector('.est-restore').onclick = async () => {
            try {
              await saveOverride(key, project, { est_days: null, est_dev_days: null, est_reason: null });
              await refresh();
            } catch (e) { err(e.message); }
          };
        });
        $('save-goals').onclick = async () => {
          const goals = [...goalWrap.querySelectorAll('.goal')].map((row) => ({
            metric: row.dataset.metric,
            target: parseFloat(row.querySelector('.goal-target').value),
          })).filter((g) => Number.isFinite(g.target) && g.target > 0);
          try {
            await api('/goals', { method: 'PUT', body: JSON.stringify({ account: state.account, assignee: state.dev, goals }) });
            $('goals-msg').textContent = 'saved';
            setTimeout(() => renderDev(), 400);
          } catch (e) { err(e.message); }
        };
      }

      // ---- AI coach ----------------------------------------------------------
      $('coach').onclick = async () => {
        err('');
        $('coach').disabled = true;
        $('coach-out').innerHTML = '<div class="card"><h2>AI coach</h2><p class="dim">Thinking…</p></div>';
        try {
          const r = await api('/analyze', { method: 'POST', body: JSON.stringify({ account: state.account, projects: state.selected.join(','), assignee: state.dev || undefined }) });
          $('coach-out').innerHTML = `<div class="card"><h2>AI coach${state.dev ? '' : ' — whole team'}</h2><pre>${esc(r.summary)}</pre></div>`;
        } catch (e) { $('coach-out').innerHTML = ''; err(e.message); }
        $('coach').disabled = false;
      };

      // ---- settings ----------------------------------------------------------
      $('settings-toggle').onclick = async () => {
        const card = $('settings-card');
        if (card.style.display !== 'none') { card.style.display = 'none'; return; }
        card.style.display = '';
        card.innerHTML = '<p class="dim">Loading…</p>';
        const firstProject = state.selected[0] || '';
        try {
          const [config, peopleResp, repos, statuses] = await Promise.all([
            api('/config'),
            api(`/people?account=${encodeURIComponent(state.account)}`),
            api('/repos').catch(() => []),
            api(`/statuses?account=${encodeURIComponent(state.account)}&project=${encodeURIComponent(firstProject)}`).catch(() => []),
          ]);
          state.config = config;
          state.people = peopleResp.people || {};

          const roleOpts = (sel) => ['', ...config.roles].map((r) => `<option value="${esc(r)}" ${r === sel ? 'selected' : ''}>${r ? esc(r) : '(no role)'}</option>`).join('');
          const sortedPeople = Object.entries(state.people).sort((a, b) => a[1].name.localeCompare(b[1].name));
          const mergeOpts = (selfId, sel) =>
            ['<option value="">(separate person)</option>']
              .concat(sortedPeople.filter(([oid]) => oid !== selfId).map(([oid, op]) => `<option value="${esc(oid)}" ${oid === sel ? 'selected' : ''}>→ ${esc(op.name)}</option>`))
              .join('');
          const peopleRows = sortedPeople
            .map(([id, p]) => `
              <div class="people-row ${p.merged_into ? 'merged' : ''}" data-id="${esc(id)}">
                <input type="checkbox" class="pp-inc" ${p.included !== false ? 'checked' : ''} title="include in analysis">
                <span>${esc(p.name)} <span class="dim" style="font-size:10px">${esc(id.slice(0, 10))}…</span></span>
                <select class="pp-role">${roleOpts(p.role || '')}</select>
                <input type="text" class="pp-alias" placeholder="git aliases (comma: name or email)" value="${esc((p.aliases || []).join(', '))}">
                <select class="pp-merge" title="same human, different Jira account — fold this account's history into another person">${mergeOpts(id, p.merged_into || '')}</select>
              </div>`).join('');
          const unmatched = (peopleResp.unmatched_authors || []).slice(0, 15)
            .map((uA) => `<span class="badge" title="add as an alias to the right person">${esc(uA.who)} ×${uA.commits}</span>`).join(' ');

          const workerRow = (w, i) => `
            <div class="worker-row" data-i="${i}">
              <select class="wk-provider">${PROVIDERS.map((p) => `<option ${w.provider === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
              <input type="text" class="wk-model" placeholder="model (optional, e.g. haiku)" value="${esc(w.model || '')}">
              <button class="small wk-del">✕</button>
            </div>`;
          const workersHtml = (config.estimate_workers || []).map(workerRow).join('');

          const featSet = new Set(config.feature_repos || []);
          const repoBoxes = (repos || []).map((r) => `
            <label style="display:inline-flex;gap:6px;align-items:center;margin-right:12px"><input type="checkbox" class="fr-cb" value="${esc(r.name)}" ${featSet.has(r.name) ? 'checked' : ''}>${esc(r.name)}</label>`).join('');

          const map = config.status_map[firstProject] || {};
          const stRows = statuses.map((st) => `
            <div class="row" style="margin:2px 0">
              <span style="min-width:160px">${esc(st.name)} <span class="dim">${esc(st.category || '')}</span></span>
              <select class="st-map" data-status="${esc(st.name)}">
                ${['design', 'implementation', 'waiting', 'excluded'].map((p) => `<option value="${p}" ${(map[st.name] || st.mapped) === p ? 'selected' : ''}>${p}</option>`).join('')}
              </select>
            </div>`).join('');

          card.innerHTML = `<h2>Settings</h2>
            <div class="card"><h2>People &amp; roles <span class="dim">(unchecked people leave every chart and median; aliases match git commit authors)</span></h2>
              ${peopleRows || '<p class="dim">No people yet — scan a project or load them from Jira.</p>'}
              ${unmatched ? `<h3>Unmatched git authors</h3><div class="row" style="margin:4px 0">${unmatched}</div>` : ''}
              <div class="row" style="margin-top:8px">
                <button class="small" id="pp-seed">Load people from Jira (${esc(firstProject)})</button>
                <span class="dim">roles list:</span><input id="cfg-roles" style="min-width:320px" value="${esc((config.roles || []).join(', '))}">
              </div>
            </div>
            <div class="grid-2">
              <div class="card"><h2>Scan</h2>
                <div class="cfg-grid">
                  <span class="lbl">Issue types</span><input id="cfg-types" placeholder="blank = ALL types" value="${esc(config.issue_types.join(', '))}">
                  <span class="lbl">Workweek</span><select id="cfg-week">
                    <option value="1,2,3,4,5" ${config.workweek.join(',') === '1,2,3,4,5' ? 'selected' : ''}>Mon–Fri</option>
                    <option value="0,1,2,3,4" ${config.workweek.join(',') === '0,1,2,3,4' ? 'selected' : ''}>Sun–Thu</option>
                  </select>
                  <span class="lbl">Max issues (0 = all)</span><input id="cfg-max" type="number" min="0" max="1000000" value="${config.max_issues}">
                  <span class="lbl">Git depth (0 = full)</span><input id="cfg-depth" type="number" min="0" max="1000000" value="${config.git_depth}">
                  <span class="lbl">Jira pacing (ms/call)</span><input id="cfg-pace" type="number" min="0" max="5000" value="${config.pace_ms}" title="delay between Jira calls; auto-doubles when Jira throttles">
                  <span class="lbl">git fetch before scan</span><input id="cfg-fetch" type="checkbox" ${config.git_fetch ? 'checked' : ''} style="justify-self:start">
                  <span class="lbl">Deploy tag contains</span><input id="cfg-deploytag" value="${esc(config.deploy_tag_pattern)}" title="case-insensitive substring, e.g. deployed">
                  <span class="lbl">Stale after (days)</span><input id="cfg-stale" type="number" min="5" max="365" value="${config.stale_days}" title="done tasks with no git signal and a Jira cycle beyond this are excluded from medians">
                  <span class="lbl">Fix window (days)</span><input id="cfg-fixwin" type="number" min="1" max="365" value="${config.fix_window_days ?? 30}" title="commits mentioning a key more than this many days after delivery are NOT counted as fixes (stray later touches)">
                  <span class="lbl">Fold fixes ≥ (commits)</span><input id="cfg-fixmin" type="number" min="1" max="100" value="${config.fix_include_min_commits ?? 3}" title="fixes with at least this many commits automatically fold into the task's actual time; fewer stay separate (override per task)">
                  <span class="lbl">Working hours / day</span><input id="cfg-hpd" type="number" min="1" max="24" value="${config.hours_per_day ?? 8}" title="sub-day durations are shown in these working hours">
                  <span class="lbl">Auto-scan (min, 0=off)</span><input id="cfg-autoscan" type="number" min="0" max="1440" value="${config.auto_scan_minutes ?? 15}" title="silently repeats your last scan every N minutes: new tickets fetched + estimated, timelines refreshed">
                </div>
              </div>
              <div class="card"><h2>AI estimation</h2>
                <div class="cfg-grid">
                  <span class="lbl">Enabled</span><input id="cfg-est-on" type="checkbox" ${config.estimate_enabled ? 'checked' : ''} style="justify-self:start">
                  <span class="lbl">Estimate since</span><input id="cfg-est-since" type="date" value="${esc(config.estimate_since || '')}" title="estimate every task completed after this date (wins over the month window)">
                  <span class="lbl">Window (months, 0 = all)</span><input id="cfg-est-window" type="number" min="0" max="60" value="${config.estimate_window_months}" title="used only when no since-date is set">
                  <span class="lbl">Max batches / scan</span><input id="cfg-est-batches" type="number" min="1" max="200" value="${config.estimate_max_batches}" title="15 issues per batch; the rest continues next scan">
                  <span class="lbl">Evidence window (months)</span><input id="cfg-ev-months" type="number" min="1" max="120" value="${config.evidence_months ?? 18}" title="how far back to collect git diff evidence (files/lines/commits) fed to the estimator">
                </div>
                <h3>Calibration rubric <span class="dim">(one rule per line; blank = built-in defaults)</span> <a class="rub-default" style="font-size:11px">use defaults</a></h3>
                <textarea id="cfg-rubric" rows="6" style="width:100%;font:12px/1.4 ui-monospace,monospace" placeholder="One scoping rule per line, e.g.&#10;Small change to an existing component: 1-3 days&#10;New module built from scratch: ~15 days">${esc((config.estimate_rubric || []).join('\n'))}</textarea>
                <h3>Extra estimator instructions <span class="dim">(appended to the estimation prompt; blank = none)</span></h3>
                <textarea id="cfg-est-instr" rows="3" style="width:100%;font:12px/1.4 ui-monospace,monospace" placeholder="e.g. Be stricter on bug tickets without a linked commit.">${esc(config.estimate_instructions || '')}</textarea>
                <h3>Estimation mode</h3>
                <select id="cfg-est-mode" title="How the worker agents are used">
                  <option value="split" ${(config.estimate_mode || 'split') === 'split' ? 'selected' : ''}>Split — batches shared across workers (faster)</option>
                  <option value="consensus" ${config.estimate_mode === 'consensus' ? 'selected' : ''}>Consensus — every worker sizes each task, a summarizer reconciles</option>
                </select>
                <h3>Workers <span class="dim">(split mode: batches shared in parallel · consensus mode: each worker sizes every task)</span></h3>
                <div id="workers">${workersHtml}</div>
                <button class="small" id="wk-add">+ add worker</button>
                <div id="summarizer-wrap" style="margin-top:8px;${config.estimate_mode === 'consensus' ? '' : 'display:none'}">
                  <h3>Summarizer <span class="dim">(reconciles the workers' estimates in consensus mode)</span></h3>
                  <div class="worker-row">
                    <select id="cfg-sum-provider">${PROVIDERS.map((p) => `<option ${(config.estimate_summarizer && config.estimate_summarizer.provider) === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
                    <input id="cfg-sum-model" placeholder="model (optional, e.g. haiku)" value="${esc((config.estimate_summarizer && config.estimate_summarizer.model) || '')}">
                  </div>
                </div>
              </div>
            </div>
            <div class="card"><h2>Report instructions <span class="dim">(what the agent-written HTML reports should contain / tone — edit without a rebuild)</span></h2>
              <textarea id="cfg-report-instr" rows="5" style="width:100%;font:12px/1.4 ui-monospace,monospace" placeholder="Blank = built-in defaults (dev + team).">${esc(config.report_instructions || '')}</textarea>
              <div class="row" style="margin-top:4px"><a class="rep-default-dev" style="font-size:11px">insert dev default</a> · <a class="rep-default-team" style="font-size:11px">insert team default</a></div>
            </div>
            <div class="card"><h2>Feature-scan repos <span class="dim">(git-only features for work without Jira stories)</span></h2>
              ${repoBoxes || '<p class="dim">No repos registered in Otto.</p>'}
            </div>
            <div class="card"><h2>Status → phase map (${esc(firstProject)})</h2>
              ${stRows || '<p class="dim">Could not load project statuses.</p>'}
            </div>
            <div class="row" style="margin-top:10px"><button class="primary" id="save-config">Save settings</button><span class="dim">status-map/workweek/stale edits recompute instantly from the stored corpus — no rescan needed</span></div>`;

          $('pp-seed').onclick = async () => {
            try {
              const r = await api('/people/seed', { method: 'POST', body: JSON.stringify({ account: state.account, project: firstProject }) });
              state.people = r.people;
              card.style.display = 'none';
              $('settings-toggle').click();
            } catch (e) { err(e.message); }
          };
          $('wk-add').onclick = () => {
            const div = document.createElement('div');
            div.innerHTML = workerRow({ provider: PROVIDERS[0] || 'claude', model: '' }, Date.now());
            const row = div.firstElementChild;
            $('workers').appendChild(row);
            row.querySelector('.wk-del').onclick = () => row.remove();
          };
          card.querySelectorAll('.wk-del').forEach((b) => (b.onclick = () => b.closest('.worker-row').remove()));
          // Consensus mode reveals the summarizer picker.
          $('cfg-est-mode').onchange = (e) => {
            $('summarizer-wrap').style.display = e.target.value === 'consensus' ? '' : 'none';
          };
          const defs = (config._defaults) || {};
          const rd = card.querySelector('.rub-default');
          if (rd) rd.onclick = () => { $('cfg-rubric').value = (defs.rubric || []).join('\n'); };
          const rdd = card.querySelector('.rep-default-dev');
          if (rdd) rdd.onclick = () => { $('cfg-report-instr').value = defs.dev_report_instructions || ''; };
          const rdt = card.querySelector('.rep-default-team');
          if (rdt) rdt.onclick = () => { $('cfg-report-instr').value = defs.team_report_instructions || ''; };

          $('save-config').onclick = async () => {
            // people first (separate store)
            const people = {};
            card.querySelectorAll('.people-row').forEach((row) => {
              people[row.dataset.id] = {
                included: row.querySelector('.pp-inc').checked,
                role: row.querySelector('.pp-role').value,
                aliases: row.querySelector('.pp-alias').value.split(',').map((x) => x.trim()).filter(Boolean),
                merged_into: row.querySelector('.pp-merge').value || null,
              };
            });
            const status_map = { ...state.config.status_map };
            const projMap = {};
            card.querySelectorAll('.st-map').forEach((sel) => { projMap[sel.dataset.status] = sel.value; });
            if (Object.keys(projMap).length) status_map[firstProject] = projMap;
            const workers = [...card.querySelectorAll('.worker-row')].map((row) => ({
              provider: row.querySelector('.wk-provider').value,
              model: row.querySelector('.wk-model').value.trim(),
            }));
            const body = {
              issue_types: $('cfg-types').value.split(',').map((x) => x.trim()).filter(Boolean),
              workweek: $('cfg-week').value.split(',').map(Number),
              max_issues: parseInt($('cfg-max').value, 10),
              git_depth: parseInt($('cfg-depth').value, 10),
              pace_ms: parseInt($('cfg-pace').value, 10),
              git_fetch: $('cfg-fetch').checked,
              deploy_tag_pattern: $('cfg-deploytag').value.trim(),
              stale_days: parseInt($('cfg-stale').value, 10),
              fix_window_days: parseInt($('cfg-fixwin').value, 10),
              fix_include_min_commits: parseInt($('cfg-fixmin').value, 10),
              hours_per_day: parseInt($('cfg-hpd').value, 10),
              auto_scan_minutes: parseInt($('cfg-autoscan').value, 10),
              estimate_enabled: $('cfg-est-on').checked,
              estimate_since: $('cfg-est-since').value || '',
              estimate_window_months: parseInt($('cfg-est-window').value, 10),
              estimate_max_batches: parseInt($('cfg-est-batches').value, 10),
              evidence_months: parseInt($('cfg-ev-months').value, 10),
              estimate_rubric: $('cfg-rubric').value.split('\n').map((x) => x.trim()).filter(Boolean),
              estimate_instructions: $('cfg-est-instr').value,
              report_instructions: $('cfg-report-instr').value,
              estimate_workers: workers.length ? workers : undefined,
              estimate_mode: $('cfg-est-mode').value,
              estimate_summarizer: { provider: $('cfg-sum-provider').value, model: $('cfg-sum-model').value.trim() },
              feature_repos: [...card.querySelectorAll('.fr-cb')].filter((cb) => cb.checked).map((cb) => cb.value),
              roles: $('cfg-roles').value.split(',').map((x) => x.trim()).filter(Boolean),
              status_map,
            };
            try {
              if (Object.keys(people).length) await api('/people', { method: 'PUT', body: JSON.stringify({ account: state.account, people }) });
              await api('/config', { method: 'PUT', body: JSON.stringify(body) });
              card.style.display = 'none';
              await refreshPeople();
              await refresh();
            } catch (e) { err(e.message); }
          };
        } catch (e) { card.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
      };
    </script>
  </body>
</html>
