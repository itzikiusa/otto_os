<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team Performance</title>
    <script>
      // Pick the theme before first paint (no light/dark flash): ?theme= or
      // ?scheme= from the host wins, else the OS preference. otto:init/otto:theme
      // later refine it with Otto's live token values.
      (function () {
        var t = '';
        try {
          var q = new URLSearchParams(location.search);
          t = q.get('theme') || q.get('scheme') || '';
        } catch (e) {
          /* no query */
        }
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="toolbar" role="banner">
      <div class="title">
        <h1>Team Performance</h1>
        <span id="tp-version" class="dim small"></span>
      </div>
      <div class="scope" role="group" aria-label="Scope">
        <label class="sr-only" for="account">Jira account</label>
        <select id="account" title="Jira account"></select>
        <button type="button" id="proj-btn" aria-haspopup="dialog" aria-expanded="false" title="Projects in scope">
          <span id="proj-label">Projects</span><svg class="svg-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 6.2 3.5 3.5 3.5-3.5" /></svg>
        </button>
        <label class="scope-label" for="period">Period</label>
        <select id="period" title="Completed-work window — every metric is computed on this period">
          <option value="">All time</option>
          <option value="1">Last month</option>
          <option value="3">Last 3 months</option>
          <option value="6">Last 6 months</option>
          <option value="12" selected>Last 12 months</option>
          <option value="ytd">Year to date</option>
          <option value="custom">Since date…</option>
        </select>
        <label class="sr-only" for="period-date">Since date</label>
        <input id="period-date" type="date" hidden />
      </div>
      <div class="actions">
        <button type="button" class="primary" id="scan" title="Incremental scan: Jira → git → pull requests">Scan</button>
        <button type="button" class="icon" id="more-btn" aria-haspopup="menu" aria-expanded="false" aria-label="More actions" title="More actions">
          <svg class="svg-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r=".6" /><circle cx="8" cy="8" r=".6" /><circle cx="12.5" cy="8" r=".6" /></svg>
        </button>
      </div>
    </header>

    <main id="main">
      <div id="scan-status" class="scan-status" role="status" aria-live="polite"></div>
      <div id="freshness" class="freshness" aria-label="Data freshness"></div>
      <div id="crumbs"></div>
      <div id="tabs" class="segmented" role="tablist" aria-label="Views"></div>
      <div id="view" role="tabpanel" tabindex="-1"></div>
    </main>

    <script src="components.js"></script>
    <script src="views/overview.js"></script>
    <script src="views/flow.js"></script>
    <script src="views/quality.js"></script>
    <script src="views/investment.js"></script>
    <script src="views/people.js"></script>
    <script src="views/person.js"></script>
    <script src="views/estimates.js"></script>
    <script src="views/reports.js"></script>
    <script src="views/settings.js"></script>
    <script src="views/app.js"></script>
  </body>
</html>
