[package]
name = "otto-desktop"
version = "0.6.1-rc.3"
edition = "2021"
license = "MIT"

# Standalone workspace: the Tauri app builds separately from the daemon crates.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["macos-private-api", "tray-icon", "unstable", "devtools"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-global-shortcut = "2.4.1"
# Check + download + minisign verify only (Otto installs the bundle itself).
# No default features: TLS comes from this crate's own reqwest (rustls), no
# second crypto provider, no zip (Windows only).
tauri-plugin-updater = { version = "2.14.1", default-features = false }
window-vibrancy = "0.8.1"
# Opens the browser's Web Inspector DETACHED via the private WKWebView
# `_inspector` API, and (with `exception`) catches AppKit's Objective-C
# exceptions in appkit_guard.rs — same objc2 version wry uses.
objc2 = { version = "0.6.5", features = ["exception"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Decodes the updater pubkey to refuse the TEST key (updater/mod.rs); already
# in the tree through tauri-plugin-updater.
base64 = "0.23.1"
# Orders release tags for "Include release candidates" (updater/mod.rs);
# already in the tree through tauri-plugin-updater.
semver = "1.0.28"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time"] }
dirs = "7.0.0"
# Clipboard history (clipboard/mac.rs): typed NSPasteboard / NSWorkspace —
# the same objc2 0.6 family tao and wry already build.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSData", "NSArray", "NSURL", "NSDictionary", "NSValue", "NSAttributedString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSAttributedString"] }
# desktop.log: SIGTERM / SIGINT / SIGHUP via a self-pipe (lifecycle.rs).
signal-hook = { version = "0.4.6", default-features = false, features = ["iterator"] }
# Updates (updater/): unpack the verified .app.tar.gz into the 0700 staging
# dir (the same tar/flate2 the updater plugin already builds), statfs for the
# free-disk check.
tar = "0.4.46"
flate2 = "1.1.10"
libc = "0.2.191"

[dev-dependencies]
# updater tests: a mock Tauri app hosting the updater plugin, and TEST
# minisign signatures made in the test itself.
tauri = { version = "2.12.5", features = ["test"] }
minisign = "0.10.0"
# Isolated native probes compare child bounds to actual AppKit content bounds.
objc2-foundation = "0.3.2"
