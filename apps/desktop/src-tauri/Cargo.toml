[package]
name = "otto-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Standalone workspace: the Tauri app builds separately from the daemon crates.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["macos-private-api", "tray-icon", "unstable", "devtools"] }
tauri-plugin-notification = "2.5.1"
tauri-plugin-shell = "2.4.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-global-shortcut = "2.4.0"
window-vibrancy = "0.8.1"
# Opens the browser's Web Inspector DETACHED via the private WKWebView
# `_inspector` API, and (with `exception`) catches AppKit's Objective-C
# exceptions in appkit_guard.rs — same objc2 version wry uses.
objc2 = { version = "0.6.4", features = ["exception"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time"] }
dirs = "7.0.0"

[dev-dependencies]
# Isolated native probes compare child bounds to actual AppKit content bounds.
objc2-foundation = "0.3.2"
